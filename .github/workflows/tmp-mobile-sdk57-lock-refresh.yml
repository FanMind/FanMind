name: Temporary Mobile SDK57 Lock Refresh

on:
  push:
    branches:
      - fix/mobile-staging-login-diagnostics-20260905

permissions:
  contents: write

jobs:
  resolve-mobile-sdk57-lock:
    if: github.ref == 'refs/heads/fix/mobile-staging-login-diagnostics-20260905'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/mobile-staging-login-diagnostics-20260905

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Resolve reviewed Expo SDK 57 patch set
        working-directory: apps/mobile
        run: >-
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          expo@~57.0.20
          expo-constants@~57.0.17
          expo-dev-client@~57.0.18
          expo-linking@~57.0.9
          expo-notifications@~57.0.17
          expo-router@~57.0.19
          expo-secure-store@~57.0.3

      - name: Commit resolved manifests if changed
        run: |
          set -euo pipefail
          if git diff --quiet -- apps/mobile/package.json apps/mobile/package-lock.json; then
            echo 'Mobile manifests already resolved.'
            exit 0
          fi
          git config user.name 'fanmind-github-mobile'
          git config user.email 'actions@users.noreply.github.com'
          git add apps/mobile/package.json apps/mobile/package-lock.json
          git commit -m 'chore(mobile): align Expo SDK 57 patches'
          git push origin HEAD:fix/mobile-staging-login-diagnostics-20260905
