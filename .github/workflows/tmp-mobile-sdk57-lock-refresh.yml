name: Temporary Mobile SDK 57 Lock Refresh

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.7.0
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Refresh Expo SDK 57 package contract
        working-directory: apps/mobile
        run: |
          npm ci --no-audit --no-fund
          npx expo install --fix

      - name: Upload refreshed dependency contract
        uses: actions/upload-artifact@v4
        with:
          name: mobile-sdk57-lock-refresh
          path: |
            apps/mobile/package.json
            apps/mobile/package-lock.json
          if-no-files-found: error
          retention-days: 1
