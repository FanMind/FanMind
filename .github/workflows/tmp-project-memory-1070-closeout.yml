name: Temporary Project Memory 1070 closeout publisher

on:
  push:
    branches:
      - ops/billing-1070-closeout-20260906

permissions:
  contents: write

jobs:
  reconcile-project-memory:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout closeout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ops/billing-1070-closeout-20260906
          fetch-depth: 0
          persist-credentials: true

      - name: Reconcile current Billing readers
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path('.')
          session = root / 'project-memory' / 'SESSION_HANDOFF.md'
          started = root / 'project-memory' / 'STARTED_WORK.md'

          session_text = session.read_text(encoding='utf-8')
          latest = (
              "- 2026-09-06 latest: #1069 merged as `294264e216ee0c6844caab5c6f51f11f2a76eeeb`; "
              "#1070 merged as `2be4f5a784eff80ba417037ed0460a77f9f8353e`. The exact-main Production Web deploy "
              "`34054123685`, CodeQL `34054123690`, Browser E2E `34054123687` and Supply Chain `34054123750` "
              "all passed. This does not equal the isolated Staging deploy: exact `2be4f5a...` still requires "
              "`deploy-staging.yml` with the existing protected/manual contract, followed by independent runtime "
              "countercheck and the rollback-only `staging-billing-canonical-acceptance.yml`. Canonical Billing "
              "projection remains disabled; no actual payment/refund, provider activation or Plus/Ultra activation occurred. "
              "Android real-device registration and Restore SSH remain pending under `LOCK-FINISHLINE-RESUME-20260906`.\n"
          )
          marker = "## Current handoff\n"
          if latest not in session_text:
              if marker not in session_text:
                  raise SystemExit('SESSION_HANDOFF current-handoff marker missing')
              session_text = session_text.replace(marker, marker + latest, 1)
          stale = "canonical Billing bridge is the next repository task under the existing R4 lock."
          if stale in session_text:
              session_text = session_text.replace(
                  stale,
                  "that repository-next-step statement is superseded by merged #1069/#1070; use the newest entry above.",
                  1,
              )
          session.write_text(session_text, encoding='utf-8')

          started_text = started.read_text(encoding='utf-8')
          replacements = {
              "- Completed so far: main 8ef7970866f04d0d575522d361ebef868db23ae3; Billing schema installed, capture proof 34043010578 and unfreeze deployment 34043148548 PASS. Push registration configured; device evidence pending.":
              "- Completed so far: Billing schema/capture-only foundation remains proven (Apply 34040107219, durable capture 34043010578, unfreeze 34043148548); #1069 merged as `294264e216ee0c6844caab5c6f51f11f2a76eeeb`; #1070 merged as `2be4f5a784eff80ba417037ed0460a77f9f8353e`; exact-main Production Web deploy 34054123685 plus CodeQL 34054123690, Browser E2E 34054123687 and Supply Chain 34054123750 passed. Push registration runtime is configured; real device evidence remains pending.",
              "- Still open: current Play/build details, protected Billing cutover, actual device/provider evidence and Restore connectivity/readiness.":
              "- Still open: exact isolated-Staging deploy/runtime proof for `2be4f5a...`, rollback-only canonical Billing acceptance, actual Android device/provider registration/delivery evidence, Play cohort/complete Store-device acceptance and Restore connectivity/readiness. Canonical projection, real payment and paid-tier activation remain disabled.",
              "- Exact next step: implement the missing canonical Billing command and downstream orchestration boundary, prove negative/retry ordering, then exact-head review. No canonical runtime activation or legal acceptance is implied.":
              "- Exact next step: deploy exact reviewed `main` `2be4f5a784eff80ba417037ed0460a77f9f8353e` to isolated Staging through `deploy-staging.yml` with `confirmation=deploy-staging-only` and `billing_write_freeze=preserve`; independently countercheck the exact Staging runtime and disabled canonical projection; only then run the separately protected rollback-only `staging-billing-canonical-acceptance.yml`. No Production DB mutation, actual payment/refund, provider activation, Plus/Ultra activation or legal acceptance is implied.",
          }
          for old, new in replacements.items():
              if old not in started_text:
                  if new in started_text:
                      continue
                  raise SystemExit(f'STARTED_WORK expected line missing: {old[:80]}')
              started_text = started_text.replace(old, new, 1)
          started.write_text(started_text, encoding='utf-8')
          PY

          python3 scripts/project_memory_status.py
          python3 scripts/project_memory_quality_check.py
          python3 scripts/fanmind_drift_preflight.py
          python3 scripts/fanmind_memory_v8.py --check
          git diff --check

      - name: Commit reconciled readers and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/tmp-project-memory-1070-closeout.yml
          git add project-memory/SESSION_HANDOFF.md project-memory/STARTED_WORK.md project-memory/PROJECT_STATUS.md
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No closeout changes required.'
            exit 0
          fi
          git commit -m 'docs(memory): reconcile canonical billing closeout'
          git push origin HEAD:ops/billing-1070-closeout-20260906
