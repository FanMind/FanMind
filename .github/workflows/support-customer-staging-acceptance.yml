name: FanMind Support Customer Staging Acceptance
on:
  workflow_dispatch:
    inputs:
      consent_schema_action:
        description: Separate additive Support AI consent schema control; none preserves existing acceptance
        type: choice
        options: [none, verify, apply]
        default: none
      expected_current_release:
        description: Exact observed Staging release for consent schema control
        type: string
        required: false
      reviewed_commit:
        description: Exact reviewed main commit already deployed to Staging
        type: string
        required: true
      ui_only:
        description: Retest customer UI using existing API acceptance evidence
        type: boolean
        default: false
      verify_diagnostics:
        description: Also accept the separately enabled read-only diagnostic and safe-check routes
        type: boolean
        default: false
      widget_only:
        description: Test only the existing synthetic embedded widget with guaranteed cleanup
        type: boolean
        default: false
      widget_workspace_id:
        description: Existing marked synthetic workspace owning a disabled widget installation
        type: string
        required: false
      confirmation:
        description: Type run-staging-support-customer-acceptance
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: fanmind-staging-deploy
  cancel-in-progress: false
jobs:
  acceptance:
    if: github.ref == 'refs/heads/main' && inputs.reviewed_commit == github.sha && ((inputs.consent_schema_action == 'none' && inputs.confirmation == 'run-staging-support-customer-acceptance') || (inputs.consent_schema_action != 'none' && inputs.confirmation == 'support-ai-consent-staging-only'))
    environment: staging
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      FANMIND_RUNTIME_ENVIRONMENT: staging
      NEXT_PUBLIC_APP_URL: ${{ vars.FANMIND_STAGING_APP_URL }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.FANMIND_STAGING_SUPABASE_URL }}
      FANMIND_TARGET_API_ORIGIN: ${{ vars.FANMIND_STAGING_APP_URL }}
      FANMIND_PRODUCTION_API_ORIGIN: https://fanmind.ch
      FANMIND_TARGET_SUPABASE_PROJECT_REF: ${{ vars.FANMIND_STAGING_SUPABASE_PROJECT_REF }}
      FANMIND_PRODUCTION_SUPABASE_PROJECT_REF: ${{ vars.FANMIND_PRODUCTION_SUPABASE_PROJECT_REF }}
      FANMIND_SUPPORT_REVIEWED_COMMIT: ${{ inputs.reviewed_commit }}
      FANMIND_SUPPORT_DIAGNOSTICS_ACCEPTANCE: ${{ inputs.verify_diagnostics }}
      FANMIND_SUPPORT_WIDGET_ONLY: ${{ inputs.widget_only }}
      FANMIND_STAGING_WIDGET_WORKSPACE_ID: ${{ inputs.widget_workspace_id }}
      FANMIND_SUPPORT_CUSTOMER_UI_ONLY: ${{ inputs.ui_only }}
      FANMIND_SUPPORT_CUSTOMER_CONFIRM: ${{ inputs.confirmation }}
      FANMIND_ENABLE_NON_PRODUCTION_WRITES: 'true'
      FANMIND_NON_PRODUCTION_WRITE_ACK: I_UNDERSTAND_NON_PRODUCTION_ONLY
      FANMIND_STAGING_E2E_WORKSPACE_ID: ${{ vars.FANMIND_STAGING_E2E_WORKSPACE_ID }}
      FANMIND_STAGING_E2E_SECONDARY_WORKSPACE_ID: ${{ vars.FANMIND_STAGING_E2E_SECONDARY_WORKSPACE_ID }}
      PGHOST: ${{ secrets.FANMIND_STAGING_DB_HOST }}
      FANMIND_TARGET_DB_HOST: ${{ secrets.FANMIND_STAGING_DB_HOST }}
      FANMIND_PRODUCTION_DB_HOST: db.drqkpdvtbbrrdwmtrodz.supabase.co
      PGPORT: '5432'
      PGDATABASE: postgres
      PGUSER: postgres.vshyhvgcmrlagvfnvomc
      PGSSLMODE: verify-full
      PGSSLROOTCERT: ${{ github.workspace }}/config/certificates/supabase-root-2021-ca.crt
      CI: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
        if: inputs.consent_schema_action == 'none'
      - name: Prepare private database proof connection
        env:
          PASSWORD: ${{ secrets.FANMIND_STAGING_DB_PASSWORD }}
          PGPASSFILE: ${{ runner.temp }}/support-customer.pgpass
        run: |
          set -euo pipefail
          umask 077
          case "$PASSWORD" in ''|*$'\n'*|*$'\r'*) exit 1 ;; esac
          ESCAPED="${PASSWORD//\\/\\\\}"
          ESCAPED="${ESCAPED//:/\\:}"
          printf '%s:%s:%s:%s:%s\n' "$PGHOST" "$PGPORT" "$PGDATABASE" "$PGUSER" "$ESCAPED" > "$PGPASSFILE"
      - name: Separately verify or install additive consent schema
        if: inputs.consent_schema_action != 'none'
        env:
          PGPASSFILE: ${{ runner.temp }}/support-customer.pgpass
          CONSENT_SCHEMA_ACTION: ${{ inputs.consent_schema_action }}
          CONSENT_EXPECTED_RELEASE: ${{ inputs.expected_current_release }}
        run: node scripts/operations/support-ai-consent-schema.mjs
      - name: Test only synthetic customer sessions and prove cleanup
        if: inputs.consent_schema_action == 'none' && inputs.widget_only != true
        env:
          PGPASSFILE: ${{ runner.temp }}/support-customer.pgpass
          FANMIND_STAGING_E2E_EMAIL: ${{ secrets.FANMIND_STAGING_E2E_EMAIL }}
          FANMIND_STAGING_E2E_PASSWORD: ${{ secrets.FANMIND_STAGING_E2E_PASSWORD }}
          FANMIND_STAGING_E2E_SECONDARY_EMAIL: ${{ secrets.FANMIND_STAGING_E2E_SECONDARY_EMAIL }}
          FANMIND_STAGING_E2E_SECONDARY_PASSWORD: ${{ secrets.FANMIND_STAGING_E2E_SECONDARY_PASSWORD }}
        run: node scripts/operations/support-customer-staging-acceptance.mjs
      - name: Test actual synthetic widget UI and endpoints and restore its disabled state
        if: inputs.consent_schema_action == 'none' && inputs.widget_only == true
        env:
          PGPASSFILE: ${{ runner.temp }}/support-customer.pgpass
        run: node scripts/operations/support-widget-staging-acceptance.mjs
      - name: Remove private connection file
        if: always()
        env:
          PGPASSFILE: ${{ runner.temp }}/support-customer.pgpass
        run: rm -f "$PGPASSFILE"
