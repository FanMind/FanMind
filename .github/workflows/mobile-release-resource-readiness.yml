name: FanMind Mobile Release Resource Readiness

on:
  workflow_dispatch:
    inputs:
      release_environment:
        description: 'EAS environment to verify without building or submitting'
        required: true
        type: choice
        options:
          - development
          - preview
          - production
      confirmation:
        description: 'Type verify-mobile-release-resources to run the read-only EAS resource check'
        required: true
        type: string

concurrency:
  group: fanmind-mobile-release-resource-readiness-${{ inputs.release_environment }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify-mobile-release-resources:
    name: Verify EAS project and public environment without release writes
    if: >-
      ${{
        github.ref == 'refs/heads/main' &&
        inputs.confirmation == 'verify-mobile-release-resources'
      }}
    runs-on: ubuntu-24.04
    environment:
      name: mobile-${{ inputs.release_environment }}
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      FANMIND_MOBILE_RELEASE_ENVIRONMENT: ${{ inputs.release_environment }}
      FANMIND_MOBILE_RELEASE_RESOURCE_CONFIRM: verify-mobile-release-resources
      FANMIND_MOBILE_EXPECTED_EAS_OWNER: ${{ vars.FANMIND_MOBILE_EAS_OWNER }}
      FANMIND_MOBILE_EXPECTED_EAS_PROJECT_ID: ${{ vars.FANMIND_MOBILE_EAS_PROJECT_ID }}
      FANMIND_MOBILE_EXPECTED_SUPABASE_PROJECT_REF: ${{ vars.FANMIND_MOBILE_SUPABASE_PROJECT_REF }}
      FANMIND_PRODUCTION_SUPABASE_PROJECT_REF: ${{ vars.FANMIND_PRODUCTION_SUPABASE_PROJECT_REF }}
      FANMIND_MOBILE_EXPECTED_API_ORIGIN: ${{ vars.FANMIND_MOBILE_API_ORIGIN }}
      FANMIND_PRODUCTION_API_ORIGIN: https://fanmind.ch
      FANMIND_ENABLE_MOBILE_EAS_BUILD: 'false'
      FANMIND_ENABLE_MOBILE_EAS_SUBMIT: 'false'
      FANMIND_ENABLE_MOBILE_EAS_UPDATE: 'false'
      EXPO_NO_TELEMETRY: '1'

    steps:
      - name: Checkout reviewed main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install Mobile dependencies
        working-directory: apps/mobile
        run: npm ci --no-audit --no-fund

      - name: Verify exact existing EAS project binding
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          umask 077
          REPORT_PATH="$RUNNER_TEMP/fanmind-mobile-eas-project-info.txt"
          trap 'rm -f "$REPORT_PATH"' EXIT
          if ! npx --yes eas-cli@21.2.0 project:info >"$REPORT_PATH" 2>&1; then
            echo "MOBILE_RELEASE_READINESS_ERROR=eas_project_lookup_failed" >&2
            exit 1
          fi
          if ! node ../../scripts/operations/mobile-eas-project-info-verify.mjs \
            "$REPORT_PATH"; then
            echo "MOBILE_RELEASE_READINESS_ERROR=eas_project_binding_mismatch" >&2
            exit 1
          fi
          echo "MOBILE_RELEASE_READINESS_EAS_PROJECT=exact-binding-verified"

      - name: Verify selected EAS public environment without release writes
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          umask 077
          REPORT_PATH="$RUNNER_TEMP/fanmind-mobile-eas-environment.txt"
          trap 'rm -f "$REPORT_PATH"' EXIT
          if ! npx --yes eas-cli@21.2.0 env:exec \
            "${{ inputs.release_environment }}" \
            "node ../../scripts/operations/mobile-release-resource-readiness.mjs" \
            --non-interactive >"$REPORT_PATH" 2>&1; then
            echo "MOBILE_RELEASE_READINESS_ERROR=public_environment_check_failed" >&2
            exit 1
          fi
          if ! grep -qx 'MOBILE_RELEASE_RESOURCE_READINESS=PASS' "$REPORT_PATH"; then
            echo "MOBILE_RELEASE_READINESS_ERROR=public_environment_check_incomplete" >&2
            exit 1
          fi
          echo "MOBILE_RELEASE_READINESS_PUBLIC_ENVIRONMENT=verified"
          echo "MOBILE_RELEASE_READINESS_BUILD=disabled"
          echo "MOBILE_RELEASE_READINESS_SUBMIT=disabled"
          echo "MOBILE_RELEASE_READINESS_UPDATE=disabled"
          echo "SECRETS_WURDEN_NICHT_AUSGEGEBEN=true"
          echo "MOBILE_RELEASE_RESOURCE_READINESS=PASS"
