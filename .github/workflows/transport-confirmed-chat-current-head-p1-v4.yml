name: Transport confirmed-chat reviewed remediation

on:
  push:
    branches:
      - feat/creator-confirmed-chat-rollout-runner-20260923
    paths:
      - .github/workflows/transport-confirmed-chat-current-head-p1-v4.yml

permissions:
  contents: write

jobs:
  transport:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/creator-confirmed-chat-rollout-runner-20260923
          fetch-depth: 0
          persist-credentials: true

      - name: Transport exact already-tested blobs, verify, commit, and push
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          BASE=de64f58efbd3b585c5e7901399724de10e4164d3
          BRANCH=feat/creator-confirmed-chat-rollout-runner-20260923
          HELPER=.github/workflows/transport-confirmed-chat-current-head-p1-v4.yml
          COMMENT_ID=5817040694
          RUNNER=scripts/operations/creator-confirmed-chat-learning-migration-runner.mjs
          CASES=tests/creator-confirmed-chat-learning-verifier-review.cases.mjs

          test "$(git rev-parse HEAD^)" = "$BASE"
          test "$(git diff --name-only "$BASE" HEAD)" = "$HELPER"

          author=$(gh api "repos/FanMind/FanMind/issues/comments/$COMMENT_ID" --jq '.user.login')
          test "$author" = 'chatgpt-codex-connector[bot]'
          gh api "repos/FanMind/FanMind/issues/comments/$COMMENT_ID" --jq '.body' > /tmp/fanmind-1168-transport.md

          python3 - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib, re

          body = Path('/tmp/fanmind-1168-transport.md').read_text(encoding='utf-8')
          expected_base = 'de64f58efbd3b585c5e7901399724de10e4164d3'
          expected_local = 'af9197421e7843a5cd5825e114e0ac042643ccb6'
          if f'REMOTE_BASE_SHA={expected_base}' not in body:
              raise SystemExit('transport_remote_base_mismatch')
          if f'LOCAL_COMMIT_SHA={expected_local}' not in body:
              raise SystemExit('transport_local_commit_mismatch')

          runner_heading = '#### `scripts/operations/creator-confirmed-chat-learning-migration-runner.mjs`'
          cases_heading = '#### `tests/creator-confirmed-chat-learning-verifier-review.cases.mjs`'
          if runner_heading not in body or cases_heading not in body:
              raise SystemExit('transport_section_missing')
          runner_section = body.split(runner_heading, 1)[1].split(cases_heading, 1)[0]
          cases_section = body.split(cases_heading, 1)[1]

          def extract(section, label):
              match = re.search(rf'{re.escape(label)}=([A-Za-z0-9+/=]+)', section)
              if not match:
                  raise SystemExit(f'transport_chunk_missing:{label}')
              return match.group(1)

          specs = [
              (
                  Path('scripts/operations/creator-confirmed-chat-learning-migration-runner.mjs'),
                  runner_section,
                  ['GZIP_BASE64_CHUNK_01_OF_02', 'GZIP_BASE64_CHUNK_02_OF_02'],
                  '2bebd26f7a73ab8ac31acdc4f4ee5fa41467638e',
                  63889,
              ),
              (
                  Path('tests/creator-confirmed-chat-learning-verifier-review.cases.mjs'),
                  cases_section,
                  ['GZIP_BASE64_CHUNK_01_OF_01'],
                  'b8d161516c6067280cee43c3b66c022e3500c925',
                  16469,
              ),
          ]

          for path, section, labels, expected_blob, expected_length in specs:
              encoded = ''.join(extract(section, label) for label in labels)
              data = gzip.decompress(base64.b64decode(encoded, validate=True))
              if len(data) != expected_length:
                  raise SystemExit(f'transport_length_mismatch:{path}:{len(data)}')
              blob = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
              if blob != expected_blob:
                  raise SystemExit(f'transport_blob_mismatch:{path}:{blob}')
              data.decode('utf-8')
              path.write_bytes(data)
          PY

          git rm "$HELPER"

          test "$(git hash-object "$RUNNER")" = 2bebd26f7a73ab8ac31acdc4f4ee5fa41467638e
          test "$(git hash-object "$CASES")" = b8d161516c6067280cee43c3b66c022e3500c925

          node scripts/operations/creator-confirmed-chat-learning-migration-runner.mjs --check
          node --test tests/creator-confirmed-chat-learning.test.mjs
          node --test tests/test-suite-coverage.test.mjs
          npx eslint scripts/operations/creator-confirmed-chat-learning-migration-runner.mjs tests/creator-confirmed-chat-learning.test.mjs tests/creator-confirmed-chat-learning-verifier-review.cases.mjs
          npm run test:operations
          git diff --check

          git add "$RUNNER" "$CASES" "$HELPER"
          git diff --cached --check
          changed=$(git diff --cached --name-only | sort)
          expected=$(printf '%s\n' "$HELPER" "$RUNNER" "$CASES" | sort)
          test "$changed" = "$expected"

          git commit -m "Close confirmed-chat current-head review findings"
          git push origin "HEAD:refs/heads/$BRANCH"
