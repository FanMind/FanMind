name: FanMind Protected One-Hour Audit Policy Install
on:
  workflow_dispatch:
    inputs:
      reviewed_main_commit:
        type: string
        required: true
      confirmation:
        type: string
        required: true
        description: install-audit-one-hour
permissions:
  contents: read
  actions: read
concurrency:
  group: fanmind-production-deploy
  cancel-in-progress: false
jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - name: Validate current main and existing protected environment
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REQUESTED_ACTION: verify
          REVIEWED_CONTROLLER_COMMIT: ${{ inputs.reviewed_main_commit }}
          WORKER_SOURCE_COMMIT: 8e5dcbdca844972fb2f133c188ecfee5d5252273
          EXPECTED_APPLICATION_COMMIT: 707d22702a784e3b9999d1c9ae9c1e11c096a1bc
          CONFIRMATION: backup-worker-verify
        run: node scripts/operations/backup-worker-install-github-preflight.mjs
  install:
    needs: validate
    runs-on: [self-hosted, fanmind-prod, exoscale, linux, x64]
    environment: backup-production-recovery
    timeout-minutes: 10
    env:
      CURRENT_MAIN: ${{ inputs.reviewed_main_commit }}
      CONFIRMATION: ${{ inputs.confirmation }}
      APPROVAL: ${{ vars.FANMIND_AUDIT_POLICY_INSTALL_APPROVAL }}
    steps:
      - name: Install only the frozen reviewed audit pair with rollback and full audit
        shell: /usr/bin/bash --noprofile --norc -p -euo pipefail {0}
        env:
          BASH_ENV: ''
          ENV: ''
        run: |
          [[ "$GITHUB_REPOSITORY" == FanMind/FanMind && "$GITHUB_REPOSITORY_ID" == 1259448985 ]]
          [[ "$GITHUB_REF" == refs/heads/main && "$GITHUB_SHA" == "$CURRENT_MAIN" ]]
          [[ "$GITHUB_ACTOR_ID" == 270165082 && "$RUNNER_NAME" == fanmind-prod-01-exoscale ]]
          [[ "$CONFIRMATION" == install-audit-one-hour ]]
          [[ "$APPROVAL" == "$CURRENT_MAIN:install-audit-one-hour:935d1d806d09bd7291e89bcffb2250864dcf6739:707d22702a784e3b9999d1c9ae9c1e11c096a1bc:admin-bypass-disabled" ]]
          /usr/bin/curl --fail --silent --show-error --proto '=https' --tlsv1.2 --max-time 30 \
            https://api.github.com/repos/FanMind/FanMind/branches/main | \
            /usr/bin/node -e 'let s="";process.stdin.on("data",b=>{s+=b;if(s.length>65536)process.exit(1)});process.stdin.on("end",()=>{const j=JSON.parse(s);if(j.commit?.sha!==process.argv[1]||j.protected!==true)process.exit(1)})' "$CURRENT_MAIN"
          INSTALLER="$(/usr/bin/mktemp "$RUNNER_TEMP/fanmind-audit-installer.XXXXXX")"
          COLLECTOR="$(/usr/bin/mktemp "$RUNNER_TEMP/fanmind-audit-collector.XXXXXX")"
          VERIFIER="$(/usr/bin/mktemp "$RUNNER_TEMP/fanmind-audit-verifier.XXXXXX")"
          trap '/usr/bin/rm -f "$INSTALLER" "$COLLECTOR" "$VERIFIER"' EXIT
          /usr/bin/curl --fail --silent --show-error --proto '=https' --tlsv1.2 --max-time 30 \
            "https://raw.githubusercontent.com/FanMind/FanMind/$CURRENT_MAIN/scripts/operations/install-production-audit-policy.mjs" --output "$INSTALLER"
          /usr/bin/curl --fail --silent --show-error --proto '=https' --tlsv1.2 --max-time 30 \
            https://raw.githubusercontent.com/FanMind/FanMind/935d1d806d09bd7291e89bcffb2250864dcf6739/scripts/operations/read-only-production-audit.sh --output "$COLLECTOR"
          /usr/bin/curl --fail --silent --show-error --proto '=https' --tlsv1.2 --max-time 30 \
            https://raw.githubusercontent.com/FanMind/FanMind/935d1d806d09bd7291e89bcffb2250864dcf6739/scripts/operations/verify-production-audit-output.mjs --output "$VERIFIER"
          /usr/bin/env -i PATH=/usr/bin:/bin LANG=C LC_ALL=C \
            /usr/bin/sudo -n /usr/bin/node - "$INSTALLER" 4e0fe4762973b20728868081017e04ca9b69174792689798d61c87e264e6e808 "$COLLECTOR" "$VERIFIER" <<'NODE'
          const fs=require('node:fs'),crypto=require('node:crypto'),cp=require('node:child_process');
          let fd;
          try {
            if(process.getuid()!==0||!Number.isSafeInteger(+process.env.SUDO_UID)||+process.env.SUDO_UID<=0)throw Error();
            fd=fs.openSync(process.argv[2],fs.constants.O_RDONLY|fs.constants.O_NOFOLLOW);
            const a=fs.fstatSync(fd,{bigint:true});
            if(!a.isFile()||a.nlink!==1n||a.uid!==BigInt(process.env.SUDO_UID)||(Number(a.mode)&0o777)!==0o600||a.size<1n||a.size>131072n)throw Error();
            const b=fs.readFileSync(fd),z=fs.fstatSync(fd,{bigint:true});
            for(const key of ['ino','dev','size','mtimeNs','ctimeNs','mode','uid','gid','nlink'])if(a[key]!==z[key])throw Error();
            if(crypto.createHash('sha256').update(b).digest('hex')!==process.argv[3])throw Error();
            const lock='/run/lock/fanmind-backup-worker-install.lock';
            const lf=fs.openSync(lock,fs.constants.O_CREAT|fs.constants.O_RDWR|fs.constants.O_NOFOLLOW,0o600);
            const st=fs.fstatSync(lf);fs.closeSync(lf);
            if(!st.isFile()||st.uid!==0||st.gid!==0||st.nlink!==1||(st.mode&0o022))throw Error();
            const r=cp.spawnSync('/usr/bin/flock',['--nonblock',lock,'/usr/bin/node','--input-type=module','-',process.argv[4],process.argv[5],process.env.SUDO_UID],{input:b,env:{PATH:'/usr/bin:/bin',LANG:'C',LC_ALL:'C'},stdio:['pipe','inherit','inherit'],timeout:300000});
            process.exitCode=r.error||r.status!==0?1:0;
          }catch{process.stderr.write('PRODUCTION_AUDIT_POLICY_LAUNCHER=BLOCK\n');process.exitCode=1;}
          finally{if(fd!==undefined)fs.closeSync(fd);}
          NODE
