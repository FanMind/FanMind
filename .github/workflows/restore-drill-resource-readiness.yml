name: FanMind Restore Drill Resource Readiness

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type verify-isolated-restore-resources to run the read-only resource check'
        required: true
        type: string

concurrency:
  group: fanmind-restore-drill-resource-readiness
  cancel-in-progress: false

permissions: {}

env:
  all_proxy: ''
  http_proxy: ''
  https_proxy: ''
  no_proxy: ''

jobs:
  validate-dispatch:
    name: Reject an invalid resource-readiness dispatch
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Validate main and the exact confirmation
        shell: /usr/bin/bash --noprofile --norc -p -euo pipefail {0}
        env:
          REQUESTED_CONFIRMATION: ${{ inputs.confirmation }}
          RESTORE_RUNNER_SCOPE: ${{ vars.FANMIND_RESTORE_RUNNER_SCOPE }}
        run: |
          [[ "$GITHUB_REF" == 'refs/heads/main' ]]
          [[ "$REQUESTED_CONFIRMATION" == 'verify-isolated-restore-resources' ]]
          [[ "$RESTORE_RUNNER_SCOPE" == 'organization-workflow-allowlist' ]]

  verify-restore-host:
    name: Verify the isolated restore host before loading the environment
    needs: validate-dispatch
    runs-on:
      group: fanmind-restore-drill
      labels: [self-hosted, fanmind-restore, fanmind-restore-01, linux, x64]
    timeout-minutes: 10
    env:
      ALL_PROXY: ''
      PATH: /opt/fanmind-restore/node-v24.19.0-linux-x64/bin:/usr/lib/postgresql/17/bin:/usr/bin:/bin
      RESTORE_HOST_GATE_SHA256: 71249afb3364203908d7ecf8bb85d50d02efaf605f2d36b12faf32e1e5f64ac2
      BASH_ENV: ''
      BASHOPTS: ''
      BASH_XTRACEFD: ''
      CURL_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
      ENV: ''
      GCONV_PATH: ''
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_GLOBAL: /dev/null
      GIT_CONFIG_KEY_0: core.hooksPath
      GIT_CONFIG_PARAMETERS: ''
      GIT_CONFIG_SYSTEM: /dev/null
      GIT_CONFIG_VALUE_0: /dev/null
      GIT_CURL_VERBOSE: ''
      GIT_EXEC_PATH: ''
      GIT_SSL_CAINFO: /etc/ssl/certs/ca-certificates.crt
      GIT_SSL_CAPATH: /etc/ssl/certs
      GIT_TRACE: ''
      GIT_TRACE_CURL: ''
      GIT_TRACE_CURL_NO_DATA: ''
      GIT_TRACE_FSMONITOR: ''
      GIT_TRACE_PACK_ACCESS: ''
      GIT_TRACE_PACKFILE: ''
      GIT_TRACE_PACKET: ''
      GIT_TRACE_PERFORMANCE: ''
      GIT_TRACE_REFS: ''
      GIT_TRACE_REDACT: 'true'
      GIT_TRACE_SETUP: ''
      GIT_TRACE_SHALLOW: ''
      GIT_TRACE2: ''
      GIT_TRACE2_BRIEF: ''
      GIT_TRACE2_CONFIG_PARAMS: ''
      GIT_TRACE2_ENV_VARS: ''
      GIT_TRACE2_EVENT: ''
      GIT_TRACE2_EVENT_BRIEF: ''
      GIT_TRACE2_EVENT_NESTING: ''
      GIT_TRACE2_PARENT_NAME: ''
      GIT_TRACE2_PERF: ''
      GIT_TRACE2_PERF_BRIEF: ''
      HTTP_PROXY: ''
      HTTPS_PROXY: ''
      LD_AUDIT: ''
      LD_LIBRARY_PATH: ''
      LD_PRELOAD: ''
      NODE_DEBUG: ''
      NODE_DEBUG_NATIVE: ''
      NODE_OPTIONS: ''
      NODE_PATH: ''
      NODE_EXTRA_CA_CERTS: ''
      NODE_TLS_REJECT_UNAUTHORIZED: '1'
      NO_PROXY: ''
      NPM_CONFIG_SCRIPT_SHELL: ''
      OPENSSL_CONF: ''
      OPENSSL_ENGINES: ''
      OPENSSL_MODULES: ''
      PYTHONPATH: ''
      REQUESTS_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
      PS4: ''
      SHELLOPTS: ''
      SSL_CERT_DIR: /etc/ssl/certs
      SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
    steps:
      - name: Verify the preinstalled isolated restore host gate without Restore secrets
        shell: /usr/bin/bash --noprofile --norc -p -euo pipefail {0}
        env:
          BASH_ENV: ''
          ENV: ''
          LD_LIBRARY_PATH: ''
          LD_PRELOAD: ''
          NODE_OPTIONS: ''
          NODE_PATH: ''
          NPM_CONFIG_SCRIPT_SHELL: ''
          PYTHONPATH: ''
          FANMIND_ENABLE_NON_PRODUCTION_WRITES: 'false'
          FANMIND_NON_PRODUCTION_WRITE_ACK: ''
          FANMIND_ENABLE_RESTORE_DRILL: 'false'
          FANMIND_RESTORE_TARGET_ACK: ''
          FANMIND_RESTORE_HOST_CONFIRMATION: verify-isolated-restore-host
          NEXT_PUBLIC_SUPABASE_URL: ''
          FANMIND_TARGET_SUPABASE_PROJECT_REF: ''
          FANMIND_PRODUCTION_SUPABASE_PROJECT_REF: ''
          PGHOST: ''
          PGPORT: ''
          PGDATABASE: ''
          PGUSER: ''
          PGPASSWORD: ''
          PGPASSFILE: ''
          PGHOSTADDR: ''
          PGSERVICE: ''
          PGSERVICEFILE: ''
          PGSSLMODE: ''
          PGSSLROOTCERT: ''
          PGGSSENCMODE: ''
          PGOPTIONS: ''
          TMPDIR: ${{ runner.temp }}
        run: |
          umask 077
          [[ -z "${GIT_SSL_NO_VERIFY+x}" ]]
          readonly RESTORE_CA_BUNDLE=/etc/ssl/certs/ca-certificates.crt
          readonly RESTORE_CA_DIRECTORY=/etc/ssl/certs
          [[ "$CURL_CA_BUNDLE" == "$RESTORE_CA_BUNDLE" ]]
          [[ "$GIT_SSL_CAINFO" == "$RESTORE_CA_BUNDLE" ]]
          [[ "$GIT_SSL_CAPATH" == "$RESTORE_CA_DIRECTORY" ]]
          [[ "$REQUESTS_CA_BUNDLE" == "$RESTORE_CA_BUNDLE" ]]
          [[ "$SSL_CERT_FILE" == "$RESTORE_CA_BUNDLE" ]]
          [[ "$SSL_CERT_DIR" == "$RESTORE_CA_DIRECTORY" ]]
          [[ -s "$RESTORE_CA_BUNDLE" && ! -L "$RESTORE_CA_BUNDLE" && ! -w "$RESTORE_CA_BUNDLE" ]]
          [[ "$(/usr/bin/realpath -- "$RESTORE_CA_BUNDLE")" == "$RESTORE_CA_BUNDLE" ]]
          read -r CA_OWNER CA_MODE CA_TYPE <<< "$(/usr/bin/stat -Lc '%u %a %F' -- "$RESTORE_CA_BUNDLE")"
          [[ "$CA_OWNER" == 0 && "$CA_MODE" =~ ^[0-7]{3,4}$ && "$CA_TYPE" == 'regular file' ]]
          (( (8#$CA_MODE & 07022) == 0 ))
          [[ -d "$RESTORE_CA_DIRECTORY" && ! -L "$RESTORE_CA_DIRECTORY" && ! -w "$RESTORE_CA_DIRECTORY" ]]
          [[ "$(/usr/bin/realpath -- "$RESTORE_CA_DIRECTORY")" == "$RESTORE_CA_DIRECTORY" ]]
          read -r CA_DIR_OWNER CA_DIR_MODE CA_DIR_TYPE <<< "$(/usr/bin/stat -Lc '%u %a %F' -- "$RESTORE_CA_DIRECTORY")"
          [[ "$CA_DIR_OWNER" == 0 && "$CA_DIR_MODE" =~ ^[0-7]{3,4}$ && "$CA_DIR_TYPE" == 'directory' ]]
          (( (8#$CA_DIR_MODE & 07022) == 0 ))
          NODE_PATH=/opt/fanmind-restore/node-v24.19.0-linux-x64/bin/node
          GATE_PATH=/opt/fanmind-restore/restore-host-readiness.mjs
          [[ -f "$GATE_PATH" && ! -L "$GATE_PATH" ]]
          [[ "$(/usr/bin/realpath -- "$GATE_PATH")" == "$GATE_PATH" ]]
          [[ ! -w "$GATE_PATH" ]]
          for GATE_PARENT in /opt /opt/fanmind-restore /opt/fanmind-restore/node-v24.19.0-linux-x64 /opt/fanmind-restore/node-v24.19.0-linux-x64/bin; do
            [[ -d "$GATE_PARENT" && ! -L "$GATE_PARENT" && ! -w "$GATE_PARENT" ]]
            [[ "$(/usr/bin/realpath -- "$GATE_PARENT")" == "$GATE_PARENT" ]]
            read -r PARENT_OWNER PARENT_MODE <<< "$(/usr/bin/stat -Lc '%u %a' -- "$GATE_PARENT")"
            [[ "$PARENT_OWNER" == 0 && "$PARENT_MODE" =~ ^[0-7]{3,4}$ ]]
            (( (8#$PARENT_MODE & 07022) == 0 ))
          done
          [[ -f "$NODE_PATH" && ! -L "$NODE_PATH" && ! -w "$NODE_PATH" ]]
          [[ "$(/usr/bin/realpath -- "$NODE_PATH")" == "$NODE_PATH" ]]
          read -r NODE_OWNER NODE_MODE <<< "$(/usr/bin/stat -Lc '%u %a' -- "$NODE_PATH")"
          [[ "$NODE_OWNER" == 0 && "$NODE_MODE" =~ ^[0-7]{3,4}$ ]]
          (( (8#$NODE_MODE & 07022) == 0 ))
          [[ "$(/usr/bin/env -i LANG=C LC_ALL=C "$NODE_PATH" --version)" == v24.19.0 ]]
          read -r GATE_OWNER GATE_MODE <<< "$(/usr/bin/stat -Lc '%u %a' -- "$GATE_PATH")"
          [[ "$GATE_OWNER" == 0 ]]
          [[ "$GATE_MODE" =~ ^[0-7]{3,4}$ ]]
          (( (8#$GATE_MODE & 07022) == 0 ))
          GATE_DIGEST="$(/usr/bin/sha256sum --binary -- "$GATE_PATH")"
          [[ "${GATE_DIGEST%% *}" == "$RESTORE_HOST_GATE_SHA256" ]]
          /usr/bin/env -i \
            LANG=C \
            LC_ALL=C \
            GITHUB_ACTIONS="$GITHUB_ACTIONS" \
            GITHUB_EVENT_NAME="$GITHUB_EVENT_NAME" \
            GITHUB_REF="$GITHUB_REF" \
            GITHUB_REPOSITORY="$GITHUB_REPOSITORY" \
            GITHUB_REPOSITORY_ID="$GITHUB_REPOSITORY_ID" \
            GITHUB_WORKSPACE="$GITHUB_WORKSPACE" \
            RUNNER_ARCH="$RUNNER_ARCH" \
            RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" \
            RUNNER_NAME="$RUNNER_NAME" \
            RUNNER_OS="$RUNNER_OS" \
            RUNNER_TEMP="$RUNNER_TEMP" \
            TMPDIR="$RUNNER_TEMP" \
            FANMIND_ENABLE_NON_PRODUCTION_WRITES=false \
            FANMIND_NON_PRODUCTION_WRITE_ACK= \
            FANMIND_ENABLE_RESTORE_DRILL=false \
            FANMIND_RESTORE_TARGET_ACK= \
            FANMIND_RESTORE_HOST_CONFIRMATION=verify-isolated-restore-host \
            "$NODE_PATH" \
            "$GATE_PATH"
          printf 'TMPDIR=%s\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"

  verify-isolated-restore-resources:
    name: Verify isolated restore target and encrypted backup without writes
    needs: verify-restore-host
    runs-on:
      group: fanmind-restore-drill
      labels: [self-hosted, fanmind-restore, fanmind-restore-01, linux, x64]
    environment: restore-drill
    permissions:
      contents: read
    env:
      ALL_PROXY: ''
      PATH: /opt/fanmind-restore/node-v24.19.0-linux-x64/bin:/usr/lib/postgresql/17/bin:/usr/bin:/bin
      RESTORE_HOST_GATE_SHA256: 71249afb3364203908d7ecf8bb85d50d02efaf605f2d36b12faf32e1e5f64ac2
      BASH_ENV: ''
      BASHOPTS: ''
      BASH_XTRACEFD: ''
      CURL_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
      ENV: ''
      GCONV_PATH: ''
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_GLOBAL: /dev/null
      GIT_CONFIG_KEY_0: core.hooksPath
      GIT_CONFIG_PARAMETERS: ''
      GIT_CONFIG_SYSTEM: /dev/null
      GIT_CONFIG_VALUE_0: /dev/null
      GIT_CURL_VERBOSE: ''
      GIT_EXEC_PATH: ''
      GIT_SSL_CAINFO: /etc/ssl/certs/ca-certificates.crt
      GIT_SSL_CAPATH: /etc/ssl/certs
      GIT_TRACE: ''
      GIT_TRACE_CURL: ''
      GIT_TRACE_CURL_NO_DATA: ''
      GIT_TRACE_FSMONITOR: ''
      GIT_TRACE_PACK_ACCESS: ''
      GIT_TRACE_PACKFILE: ''
      GIT_TRACE_PACKET: ''
      GIT_TRACE_PERFORMANCE: ''
      GIT_TRACE_REFS: ''
      GIT_TRACE_REDACT: 'true'
      GIT_TRACE_SETUP: ''
      GIT_TRACE_SHALLOW: ''
      GIT_TRACE2: ''
      GIT_TRACE2_BRIEF: ''
      GIT_TRACE2_CONFIG_PARAMS: ''
      GIT_TRACE2_ENV_VARS: ''
      GIT_TRACE2_EVENT: ''
      GIT_TRACE2_EVENT_BRIEF: ''
      GIT_TRACE2_EVENT_NESTING: ''
      GIT_TRACE2_PARENT_NAME: ''
      GIT_TRACE2_PERF: ''
      GIT_TRACE2_PERF_BRIEF: ''
      HTTP_PROXY: ''
      HTTPS_PROXY: ''
      LD_AUDIT: ''
      LD_LIBRARY_PATH: ''
      LD_PRELOAD: ''
      NODE_DEBUG: ''
      NODE_DEBUG_NATIVE: ''
      NODE_OPTIONS: ''
      NODE_PATH: ''
      NODE_EXTRA_CA_CERTS: ''
      NODE_TLS_REJECT_UNAUTHORIZED: '1'
      NO_PROXY: ''
      NPM_CONFIG_SCRIPT_SHELL: ''
      OPENSSL_CONF: ''
      OPENSSL_ENGINES: ''
      OPENSSL_MODULES: ''
      PYTHONPATH: ''
      REQUESTS_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
      PS4: ''
      SHELLOPTS: ''
      SSL_CERT_DIR: /etc/ssl/certs
      SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
    steps:
      - name: Re-attest the preinstalled gate before checkout or environment-secret use
        shell: /usr/bin/bash --noprofile --norc -p -euo pipefail {0}
        env:
          BASH_ENV: ''
          ENV: ''
          LD_LIBRARY_PATH: ''
          LD_PRELOAD: ''
          NODE_OPTIONS: ''
          NODE_PATH: ''
          NPM_CONFIG_SCRIPT_SHELL: ''
          PYTHONPATH: ''
          FANMIND_ENABLE_NON_PRODUCTION_WRITES: 'false'
          FANMIND_NON_PRODUCTION_WRITE_ACK: ''
          FANMIND_ENABLE_RESTORE_DRILL: 'false'
          FANMIND_RESTORE_TARGET_ACK: ''
          FANMIND_RESTORE_HOST_CONFIRMATION: verify-isolated-restore-host
          NEXT_PUBLIC_SUPABASE_URL: ''
          FANMIND_TARGET_SUPABASE_PROJECT_REF: ''
          FANMIND_PRODUCTION_SUPABASE_PROJECT_REF: ''
          PGHOST: ''
          PGPORT: ''
          PGDATABASE: ''
          PGUSER: ''
          PGPASSWORD: ''
          PGPASSFILE: ''
          PGHOSTADDR: ''
          PGSERVICE: ''
          PGSERVICEFILE: ''
          PGSSLMODE: ''
          PGSSLROOTCERT: ''
          PGGSSENCMODE: ''
          PGOPTIONS: ''
          TMPDIR: ${{ runner.temp }}
        run: |
          umask 077
          [[ -z "${GIT_SSL_NO_VERIFY+x}" ]]
          readonly RESTORE_CA_BUNDLE=/etc/ssl/certs/ca-certificates.crt
          readonly RESTORE_CA_DIRECTORY=/etc/ssl/certs
          [[ "$CURL_CA_BUNDLE" == "$RESTORE_CA_BUNDLE" ]]
          [[ "$GIT_SSL_CAINFO" == "$RESTORE_CA_BUNDLE" ]]
          [[ "$GIT_SSL_CAPATH" == "$RESTORE_CA_DIRECTORY" ]]
          [[ "$REQUESTS_CA_BUNDLE" == "$RESTORE_CA_BUNDLE" ]]
          [[ "$SSL_CERT_FILE" == "$RESTORE_CA_BUNDLE" ]]
          [[ "$SSL_CERT_DIR" == "$RESTORE_CA_DIRECTORY" ]]
          [[ -s "$RESTORE_CA_BUNDLE" && ! -L "$RESTORE_CA_BUNDLE" && ! -w "$RESTORE_CA_BUNDLE" ]]
          [[ "$(/usr/bin/realpath -- "$RESTORE_CA_BUNDLE")" == "$RESTORE_CA_BUNDLE" ]]
          read -r CA_OWNER CA_MODE CA_TYPE <<< "$(/usr/bin/stat -Lc '%u %a %F' -- "$RESTORE_CA_BUNDLE")"
          [[ "$CA_OWNER" == 0 && "$CA_MODE" =~ ^[0-7]{3,4}$ && "$CA_TYPE" == 'regular file' ]]
          (( (8#$CA_MODE & 07022) == 0 ))
          [[ -d "$RESTORE_CA_DIRECTORY" && ! -L "$RESTORE_CA_DIRECTORY" && ! -w "$RESTORE_CA_DIRECTORY" ]]
          [[ "$(/usr/bin/realpath -- "$RESTORE_CA_DIRECTORY")" == "$RESTORE_CA_DIRECTORY" ]]
          read -r CA_DIR_OWNER CA_DIR_MODE CA_DIR_TYPE <<< "$(/usr/bin/stat -Lc '%u %a %F' -- "$RESTORE_CA_DIRECTORY")"
          [[ "$CA_DIR_OWNER" == 0 && "$CA_DIR_MODE" =~ ^[0-7]{3,4}$ && "$CA_DIR_TYPE" == 'directory' ]]
          (( (8#$CA_DIR_MODE & 07022) == 0 ))
          NODE_PATH=/opt/fanmind-restore/node-v24.19.0-linux-x64/bin/node
          GATE_PATH=/opt/fanmind-restore/restore-host-readiness.mjs
          [[ -f "$GATE_PATH" && ! -L "$GATE_PATH" ]]
          [[ "$(/usr/bin/realpath -- "$GATE_PATH")" == "$GATE_PATH" ]]
          [[ ! -w "$GATE_PATH" ]]
          for GATE_PARENT in /opt /opt/fanmind-restore /opt/fanmind-restore/node-v24.19.0-linux-x64 /opt/fanmind-restore/node-v24.19.0-linux-x64/bin; do
            [[ -d "$GATE_PARENT" && ! -L "$GATE_PARENT" && ! -w "$GATE_PARENT" ]]
            [[ "$(/usr/bin/realpath -- "$GATE_PARENT")" == "$GATE_PARENT" ]]
            read -r PARENT_OWNER PARENT_MODE <<< "$(/usr/bin/stat -Lc '%u %a' -- "$GATE_PARENT")"
            [[ "$PARENT_OWNER" == 0 && "$PARENT_MODE" =~ ^[0-7]{3,4}$ ]]
            (( (8#$PARENT_MODE & 07022) == 0 ))
          done
          [[ -f "$NODE_PATH" && ! -L "$NODE_PATH" && ! -w "$NODE_PATH" ]]
          [[ "$(/usr/bin/realpath -- "$NODE_PATH")" == "$NODE_PATH" ]]
          read -r NODE_OWNER NODE_MODE <<< "$(/usr/bin/stat -Lc '%u %a' -- "$NODE_PATH")"
          [[ "$NODE_OWNER" == 0 && "$NODE_MODE" =~ ^[0-7]{3,4}$ ]]
          (( (8#$NODE_MODE & 07022) == 0 ))
          [[ "$(/usr/bin/env -i LANG=C LC_ALL=C "$NODE_PATH" --version)" == v24.19.0 ]]
          read -r GATE_OWNER GATE_MODE <<< "$(/usr/bin/stat -Lc '%u %a' -- "$GATE_PATH")"
          [[ "$GATE_OWNER" == 0 ]]
          [[ "$GATE_MODE" =~ ^[0-7]{3,4}$ ]]
          (( (8#$GATE_MODE & 07022) == 0 ))
          GATE_DIGEST="$(/usr/bin/sha256sum --binary -- "$GATE_PATH")"
          [[ "${GATE_DIGEST%% *}" == "$RESTORE_HOST_GATE_SHA256" ]]
          /usr/bin/env -i \
            LANG=C \
            LC_ALL=C \
            GITHUB_ACTIONS="$GITHUB_ACTIONS" \
            GITHUB_EVENT_NAME="$GITHUB_EVENT_NAME" \
            GITHUB_REF="$GITHUB_REF" \
            GITHUB_REPOSITORY="$GITHUB_REPOSITORY" \
            GITHUB_REPOSITORY_ID="$GITHUB_REPOSITORY_ID" \
            GITHUB_WORKSPACE="$GITHUB_WORKSPACE" \
            RUNNER_ARCH="$RUNNER_ARCH" \
            RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" \
            RUNNER_NAME="$RUNNER_NAME" \
            RUNNER_OS="$RUNNER_OS" \
            RUNNER_TEMP="$RUNNER_TEMP" \
            TMPDIR="$RUNNER_TEMP" \
            FANMIND_ENABLE_NON_PRODUCTION_WRITES=false \
            FANMIND_NON_PRODUCTION_WRITE_ACK= \
            FANMIND_ENABLE_RESTORE_DRILL=false \
            FANMIND_RESTORE_TARGET_ACK= \
            FANMIND_RESTORE_HOST_CONFIRMATION=verify-isolated-restore-host \
            "$NODE_PATH" \
            "$GATE_PATH"
          printf 'TMPDIR=%s\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Checkout reviewed main commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          set-safe-directory: false

      - name: Verify isolated restore resources without writes
        env:
          FANMIND_RUNTIME_ENVIRONMENT: staging
          NEXT_PUBLIC_APP_URL: ${{ vars.FANMIND_RESTORE_APP_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.FANMIND_RESTORE_SUPABASE_URL }}
          FANMIND_TARGET_SUPABASE_PROJECT_REF: ${{ vars.FANMIND_RESTORE_SUPABASE_PROJECT_REF }}
          FANMIND_PRODUCTION_SUPABASE_PROJECT_REF: ${{ vars.FANMIND_PRODUCTION_SUPABASE_PROJECT_REF }}
          FANMIND_ENABLE_NON_PRODUCTION_WRITES: 'false'
          FANMIND_NON_PRODUCTION_WRITE_ACK: ''
          FANMIND_ENABLE_RESTORE_DRILL: 'false'
          FANMIND_RESTORE_TARGET_ACK: ''
          FANMIND_RESTORE_READINESS_CONFIRM: verify-isolated-restore-resources
          FANMIND_RESTORE_TARGET_DB_HOST: ${{ secrets.FANMIND_RESTORE_TARGET_DB_HOST }}
          FANMIND_RESTORE_TARGET_DB_PORT: ${{ vars.FANMIND_RESTORE_TARGET_DB_PORT }}
          FANMIND_RESTORE_TARGET_DB_NAME: ${{ vars.FANMIND_RESTORE_TARGET_DB_NAME }}
          FANMIND_RESTORE_TARGET_DB_USER: ${{ secrets.FANMIND_RESTORE_TARGET_DB_USER }}
          FANMIND_PRODUCTION_DB_HOST: ${{ secrets.FANMIND_PRODUCTION_DB_HOST }}
          FANMIND_PRODUCTION_DB_PORT: ${{ vars.FANMIND_PRODUCTION_DB_PORT }}
          FANMIND_PRODUCTION_DB_NAME: ${{ vars.FANMIND_PRODUCTION_DB_NAME }}
          FANMIND_PRODUCTION_DB_USER: ${{ secrets.FANMIND_PRODUCTION_DB_USER }}
          FANMIND_RESTORE_ARTIFACT_PATH: ${{ secrets.FANMIND_RESTORE_ARTIFACT_PATH }}
          PGHOST: ''
          PGPORT: ''
          PGDATABASE: ''
          PGUSER: ''
          PGPASSWORD: ''
          PGPASSFILE: ''
          PGHOSTADDR: ''
          PGSERVICE: ''
          PGSERVICEFILE: ''
        shell: /usr/bin/bash --noprofile --norc -p -euo pipefail {0}
        run: /opt/fanmind-restore/node-v24.19.0-linux-x64/bin/node scripts/operations/restore-drill-resource-readiness.mjs

      - name: Verify isolated PostgreSQL target compatibility read-only
        env:
          FANMIND_RUNTIME_ENVIRONMENT: staging
          NEXT_PUBLIC_APP_URL: ${{ vars.FANMIND_RESTORE_APP_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.FANMIND_RESTORE_SUPABASE_URL }}
          FANMIND_TARGET_SUPABASE_PROJECT_REF: ${{ vars.FANMIND_RESTORE_SUPABASE_PROJECT_REF }}
          FANMIND_PRODUCTION_SUPABASE_PROJECT_REF: ${{ vars.FANMIND_PRODUCTION_SUPABASE_PROJECT_REF }}
          FANMIND_ENABLE_NON_PRODUCTION_WRITES: 'false'
          FANMIND_NON_PRODUCTION_WRITE_ACK: ''
          FANMIND_ENABLE_RESTORE_DRILL: 'false'
          FANMIND_RESTORE_TARGET_ACK: ''
          FANMIND_RESTORE_READINESS_CONFIRM: verify-isolated-restore-resources
          FANMIND_RESTORE_TARGET_DB_HOST: ${{ secrets.FANMIND_RESTORE_TARGET_DB_HOST }}
          FANMIND_RESTORE_TARGET_DB_PORT: ${{ vars.FANMIND_RESTORE_TARGET_DB_PORT }}
          FANMIND_RESTORE_TARGET_DB_NAME: ${{ vars.FANMIND_RESTORE_TARGET_DB_NAME }}
          FANMIND_RESTORE_TARGET_DB_USER: ${{ secrets.FANMIND_RESTORE_TARGET_DB_USER }}
          FANMIND_PRODUCTION_DB_HOST: ${{ secrets.FANMIND_PRODUCTION_DB_HOST }}
          FANMIND_PRODUCTION_DB_PORT: ${{ vars.FANMIND_PRODUCTION_DB_PORT }}
          FANMIND_PRODUCTION_DB_NAME: ${{ vars.FANMIND_PRODUCTION_DB_NAME }}
          FANMIND_PRODUCTION_DB_USER: ${{ secrets.FANMIND_PRODUCTION_DB_USER }}
          FANMIND_RESTORE_TARGET_COMPATIBILITY_CONFIRM: verify-read-only-restore-target
          FANMIND_RESTORE_TARGET_PGPASSFILE_PATH: ${{ secrets.FANMIND_RESTORE_TARGET_PGPASSFILE_PATH }}
          FANMIND_RESTORE_TARGET_CA_CERT_PATH: ${{ secrets.FANMIND_RESTORE_TARGET_CA_CERT_PATH }}
          FANMIND_OPERATIONAL_TEST_MODE: ''
          FANMIND_PSQL_BIN: ''
          PGHOST: ''
          PGPORT: ''
          PGDATABASE: ''
