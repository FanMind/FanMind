name: Transport bounded confirmed-chat P1 remediation v3

on:
  push:
    branches:
      - feat/creator-confirmed-chat-rollout-runner-20260923
    paths:
      - .github/workflows/transport-confirmed-chat-current-head-p1-v3.yml

permissions:
  contents: write
  issues: write

jobs:
  transport:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/creator-confirmed-chat-rollout-runner-20260923
          fetch-depth: 0
          persist-credentials: true

      - name: Apply exact bounded P1 remediation, test, commit, and remove helper
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BASE=95b2f2ca79ed5b5a61ea506bc470569fd81df101
          BRANCH=feat/creator-confirmed-chat-rollout-runner-20260923
          HELPER=.github/workflows/transport-confirmed-chat-current-head-p1-v3.yml

          cleanup_failure() {
            code=$?
            if [ "$code" -ne 0 ]; then
              git reset --hard HEAD || true
              if [ -f "$HELPER" ]; then
                git rm -f "$HELPER" || true
                git commit -m "Remove failed confirmed-chat P1 transport v3" || true
                git push origin "HEAD:refs/heads/$BRANCH" || true
              fi
              gh issue comment 1168 --body "Current-head P1 transport v3 failed closed with exit code \`$code\`. No protected/database/runtime action occurred; helper cleanup was attempted."
            fi
            exit "$code"
          }
          trap cleanup_failure EXIT

          test "$(git rev-parse HEAD^)" = "$BASE"
          test "$(git diff --name-only "$BASE" HEAD | sort -u)" = "$HELPER"

          python3 - <<'PY'
          from pathlib import Path

          runner_path = Path('scripts/operations/creator-confirmed-chat-learning-migration-runner.mjs')
          tests_path = Path('tests/creator-confirmed-chat-learning-verifier-review.cases.mjs')
          runner = runner_path.read_text(encoding='utf-8')
          tests = tests_path.read_text(encoding='utf-8')

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}:expected_one_found_{count}')
              return text.replace(old, new, 1)

          index_anchor = """  if exists (\n    select 1\n      from pg_index i\n     where i.indrelid = learning_table\n       and i.indisunique\n       and i.indisready\n       and i.indislive\n"""
          index_guard = """  if exists (\n    select 1\n      from pg_index i\n     where i.indrelid = learning_table\n       and (i.indpred is not null or i.indexprs is not null)\n  ) then\n    raise exception 'creator_learning_unexpected_expression_or_partial_index';\n  end if;\n\n"""
          runner = replace_once(
              runner,
              index_anchor,
              index_guard + index_anchor,
              'unexpected_expression_partial_index_guard',
          )

          old_mode = """function runDatabaseMode(mode, sql, verifySql, state, environment, database) {\n  const before = databaseState(database(verifySql));\n  if (state === \"preinstall\") {\n    if (before === \"installed\") fail(\"installed_target_with_preinstall_source\");\n    if (mode === \"apply\") fail(\"source_state_not_installed\");\n    return [\n      \"CREATOR_CONFIRMED_CHAT_SCHEMA_STATE=absent\",\n      \"CREATOR_CONFIRMED_CHAT_SOURCE_STATE=preinstall\",\n      \"CREATOR_CONFIRMED_CHAT_NEXT=reviewed_state_switch_before_apply\",\n      \"CREATOR_CONFIRMED_CHAT_APPLY=not_requested\",\n    ];\n  }\n\n  if (mode === \"verify\") {\n    if (before === \"installed\") {\n      return [\n        \"CREATOR_CONFIRMED_CHAT_SCHEMA_STATE=installed\",\n        \"CREATOR_CONFIRMED_CHAT_SOURCE_STATE=installed\",\n        \"CREATOR_CONFIRMED_CHAT_POSTFLIGHT=PASS\",\n        \"CREATOR_CONFIRMED_CHAT_APPLY=not_requested\",\n      ];\n    }\n    const runtime = clean(environment.FANMIND_RUNTIME_ENVIRONMENT).toLowerCase();\n    return runtime === \"production\"\n      ? [\n          \"CREATOR_CONFIRMED_CHAT_SCHEMA_STATE=absent\",\n          \"CREATOR_CONFIRMED_CHAT_SOURCE_STATE=installed\",\n          \"CREATOR_CONFIRMED_CHAT_NEXT=separate_production_rollout_plan_required\",\n          \"CREATOR_CONFIRMED_CHAT_APPLY=forbidden\",\n        ]\n      : [\n          \"CREATOR_CONFIRMED_CHAT_SCHEMA_STATE=absent\",\n          \"CREATOR_CONFIRMED_CHAT_SOURCE_STATE=installed\",\n          \"CREATOR_CONFIRMED_CHAT_NEXT=apply\",\n          \"CREATOR_CONFIRMED_CHAT_APPLY=not_requested\",\n        ];\n  }\n\n  if (before !== \"absent\") fail(\"apply_requires_absent_target\");\n  const applied = database(sql);\n  if (applied.error || applied.status !== 0) fail(\"apply_indeterminate_verify_before_retry\");\n  const after = databaseState(database(verifySql));\n  if (after !== \"installed\") fail(\"postflight_failed\");\n  return [\n    \"CREATOR_CONFIRMED_CHAT_SCHEMA_STATE=installed\",\n    \"CREATOR_CONFIRMED_CHAT_SOURCE_STATE=installed\",\n    \"CREATOR_CONFIRMED_CHAT_APPLY=committed\",\n    \"CREATOR_CONFIRMED_CHAT_POSTFLIGHT=PASS\",\n    \"CREATOR_CONFIRMED_CHAT_RUNTIME_ACTIVATED=false\",\n  ];\n}\n"""

          new_mode = """function buildLockedApplySql(sql, verifySql) {\n  if (!/^\\s*begin;/iu.test(sql) || !/commit;\\s*$/iu.test(sql)) {\n    fail(\"apply_sql_contract_invalid\");\n  }\n  const lockedMigration = sql.replace(\n    /^\\s*begin;\\s*/iu,\n    String.raw`begin;\nset local search_path = pg_catalog;\nlock table public.conversation_messages in access exclusive mode;\ndo $apply_preflight$\nbegin\n  if to_regclass('public.creator_confirmed_chat_learning') is not null\n     or exists (\n       select 1 from pg_attribute\n        where attrelid = to_regclass('public.conversation_messages')\n          and attname = 'creator_learning_manual_send'\n          and attnum > 0 and not attisdropped\n     )\n     or exists (\n       select 1\n         from pg_proc p\n         join pg_namespace n on n.oid = p.pronamespace\n        where n.nspname = 'public'\n          and p.proname in (\n            'stamp_creator_learning_manual_send',\n            'record_creator_confirmed_chat_proposals',\n            'confirm_creator_confirmed_chat_outbound',\n            'link_creator_confirmed_chat_outcomes'\n          )\n     )\n     or exists (\n       select 1\n         from pg_trigger t\n        where t.tgrelid = to_regclass('public.conversation_messages')\n          and t.tgname = 'conversation_messages_stamp_creator_learning_manual_send'\n          and not t.tgisinternal\n     ) then\n    raise exception 'creator_learning_apply_requires_absent_target';\n  end if;\nend\n$apply_preflight$;\n`,\n  );\n  const advisoryKey = \"hashtextextended('fanmind:creator-confirmed-chat-learning', 0)\";\n  return String.raw`\\set ON_ERROR_STOP on\nselect pg_advisory_lock(${advisoryKey});\n${verifySql}\n${lockedMigration}\nselect pg_advisory_unlock(${advisoryKey});\n`;\n}\n\nfunction runDatabaseMode(mode, sql, verifySql, state, environment, database) {\n  if (mode === \"apply\") {\n    if (state !== \"installed\") fail(\"source_state_not_installed\");\n    const applied = database(buildLockedApplySql(sql, verifySql));\n    if (applied.error || applied.status !== 0) {\n      fail(\"apply_indeterminate_verify_before_retry\");\n    }\n    const after = databaseState(database(verifySql));\n    if (after !== \"installed\") fail(\"postflight_failed\");\n    return [\n      \"CREATOR_CONFIRMED_CHAT_SCHEMA_STATE=installed\",\n      \"CREATOR_CONFIRMED_CHAT_SOURCE_STATE=installed\",\n      \"CREATOR_CONFIRMED_CHAT_APPLY=committed\",\n      \"CREATOR_CONFIRMED_CHAT_POSTFLIGHT=PASS\",\n      \"CREATOR_CONFIRMED_CHAT_RUNTIME_ACTIVATED=false\",\n    ];\n  }\n\n  const before = databaseState(database(verifySql));\n  if (state === \"preinstall\") {\n    if (before === \"installed\") fail(\"installed_target_with_preinstall_source\");\n    return [\n      \"CREATOR_CONFIRMED_CHAT_SCHEMA_STATE=absent\",\n      \"CREATOR_CONFIRMED_CHAT_SOURCE_STATE=preinstall\",\n      \"CREATOR_CONFIRMED_CHAT_NEXT=reviewed_state_switch_before_apply\",\n      \"CREATOR_CONFIRMED_CHAT_APPLY=not_requested\",\n    ];\n  }\n\n  if (before === \"installed\") {\n    return [\n      \"CREATOR_CONFIRMED_CHAT_SCHEMA_STATE=installed\",\n      \"CREATOR_CONFIRMED_CHAT_SOURCE_STATE=installed\",\n      \"CREATOR_CONFIRMED_CHAT_POSTFLIGHT=PASS\",\n      \"CREATOR_CONFIRMED_CHAT_APPLY=not_requested\",\n    ];\n  }\n  const runtime = clean(environment.FANMIND_RUNTIME_ENVIRONMENT).toLowerCase();\n  return runtime === \"production\"\n    ? [\n        \"CREATOR_CONFIRMED_CHAT_SCHEMA_STATE=absent\",\n        \"CREATOR_CONFIRMED_CHAT_SOURCE_STATE=installed\",\n        \"CREATOR_CONFIRMED_CHAT_NEXT=separate_production_rollout_plan_required\",\n        \"CREATOR_CONFIRMED_CHAT_APPLY=forbidden\",\n      ]\n    : [\n        \"CREATOR_CONFIRMED_CHAT_SCHEMA_STATE=absent\",\n        \"CREATOR_CONFIRMED_CHAT_SOURCE_STATE=installed\",\n        \"CREATOR_CONFIRMED_CHAT_NEXT=apply\",\n        \"CREATOR_CONFIRMED_CHAT_APPLY=not_requested\",\n      ];\n}\n"""
          runner = replace_once(runner, old_mode, new_mode, 'locked_apply_mode')

          extra_tests = r'''\n\ntest("APPLY keeps read-only verification and mutation in one guarded psql session", async () => {\n  const runner = await runnerSource();\n  assert.match(runner, /pg_advisory_lock\(\$\{advisoryKey\}\)/u);\n  assert.match(runner, /lock table public\.conversation_messages in access exclusive mode/u);\n  assert.match(runner, /creator_learning_apply_requires_absent_target/u);\n  assert.match(runner, /database\(buildLockedApplySql\(sql, verifySql\)\)/u);\n  const mode = runner.slice(runner.indexOf("function runDatabaseMode"), runner.indexOf("export function main"));\n  assert.doesNotMatch(mode, /if \(before !== "absent"\)[\s\S]*database\(sql\)/u);\n});\n\ntest("verifier rejects every expression or partial index on the learning table", async () => {\n  const runner = await runnerSource();\n  assert.match(\n    runner,\n    /i\.indrelid = learning_table[\s\S]*i\.indpred is not null or i\.indexprs is not null[\s\S]*creator_learning_unexpected_expression_or_partial_index/u,\n  );\n});\n'''
          if 'APPLY keeps read-only verification and mutation in one guarded psql session' in tests:
              raise SystemExit('tests_already_present')
          tests += extra_tests

          runner_path.write_text(runner, encoding='utf-8')
          tests_path.write_text(tests, encoding='utf-8')
          PY

          node scripts/operations/creator-confirmed-chat-learning-migration-runner.mjs --check
          node --test tests/creator-confirmed-chat-learning.test.mjs
          node --test tests/test-suite-coverage.test.mjs
          git diff --check

          git rm "$HELPER"
          git add scripts/operations/creator-confirmed-chat-learning-migration-runner.mjs tests/creator-confirmed-chat-learning-verifier-review.cases.mjs
          git diff --cached --check
          git commit -m "Close confirmed-chat current-head P1 findings"
          git push origin "HEAD:refs/heads/$BRANCH"
          trap - EXIT