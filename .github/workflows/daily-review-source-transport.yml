name: Daily review source transport
on:
  push:
    branches: [fix/daily-admin-rollout-20260914]
    paths: [.github/workflows/daily-review-source-transport.yml]
permissions:
  contents: write
jobs:
  apply-source:
    if: github.repository == 'FanMind/FanMind' && github.ref == 'refs/heads/fix/daily-admin-rollout-20260914'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Apply checksum-bound public source only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, zlib, subprocess
          base = '17ec0aea20d6b661ed5f153b4aa8903f576e08e4'
          subprocess.run(['git','merge-base','--is-ancestor',base,'HEAD'],check=True)
          assert subprocess.check_output(['git','diff','--name-only',base,'HEAD']).decode().splitlines() == ['.github/workflows/daily-review-source-transport.yml']
          encoded = ''
          encoded = encoded.replace('HVzxJJ3PP', 'HVzxJ3PP')
          patch = zlib.decompress(base64.b64decode(encoded, validate=True))
          assert len(patch) == 11574
          assert hashlib.sha256(patch).hexdigest() == 'ef420b6ba72bb1b163f2748d40714c5acd67f2f3d004155ff548bf2fdb9b0ab8'
          expected = {'e2e/daily-offer-visibility.spec.ts','src/app/billing/checkout/route.ts','src/app/billing/start/page.tsx','src/app/workspace/setup/page.tsx','src/lib/stripeBilling.ts','tests/daily-offer-admin.test.mjs','tests/payment-terms-submission.test.mjs','tests/stripe-billing-write-freeze.test.mjs'}
          stats = subprocess.check_output(['git','apply','--numstat','-'],input=patch).decode().splitlines()
          assert {line.split('\t',2)[2] for line in stats} == expected
          subprocess.run(['git','apply','--check','--index','-'],input=patch,check=True)
          subprocess.run(['git','apply','--index','-'],input=patch,check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          print('DAILY_REVIEW_PATCH_VERIFIED=true')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Gate all Daily checkout callers and preserve saved closed selections'
          git push origin HEAD:refs/heads/fix/daily-admin-rollout-20260914
