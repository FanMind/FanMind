name: FanMind Read-only Production Audit

on:
  workflow_run:
    workflows: ["Deploy FanMind"]
    types: [completed]
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type run-read-only-production-audit'
        required: true
        type: string
      expected_commit:
        description: 'Exact 40-character main commit expected on Production'
        required: true
        type: string

concurrency:
  group: fanmind-production-readonly-audit
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  audit:
    name: Verify installed Production runtime without writes
    if: >-
      ${{
        (github.event_name == 'workflow_run' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'main') ||
        github.event_name == 'schedule' ||
        (github.event_name == 'workflow_dispatch' &&
          github.ref == 'refs/heads/main' &&
          inputs.confirmation == 'run-read-only-production-audit')
      }}
    runs-on: [self-hosted, fanmind-prod, exoscale, linux, x64]
    environment: production
    timeout-minutes: 15
    steps:
      - name: Resolve the installed Production commit for scheduled audit
        id: target
        env:
          REQUESTED_COMMIT: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_commit || github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || '' }}
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_COMMIT="$REQUESTED_COMMIT"
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            EXPECTED_COMMIT="$(curl -fsS --max-time 15 https://fanmind.ch/api/version | python3 -c 'import json,sys; print(json.load(sys.stdin).get("releaseCommit", ""))')"
          fi
          if [[ ! "$EXPECTED_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Expected Production commit is invalid." >&2
            exit 1
          fi
          echo "commit=$EXPECTED_COMMIT" >> "$GITHUB_OUTPUT"

      - name: Run installed root-owned audit and verify redacted result
        env:
          EXPECTED_COMMIT: ${{ steps.target.outputs.commit }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$EXPECTED_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Expected Production commit is invalid." >&2
            exit 1
          fi

          if [[ ! -x /usr/local/lib/fanmind-audit/read-only-production-audit.sh ]]; then
            echo "Installed Production audit is unavailable." >&2
            exit 1
          fi
          if [[ ! -r /usr/local/lib/fanmind-audit/verify-production-audit-output.mjs ]]; then
            echo "Installed Production audit verifier is unavailable." >&2
            exit 1
          fi

          AUDIT_OUTPUT="$(mktemp "$RUNNER_TEMP/fanmind-production-audit.XXXXXX")"
          AUDIT_STDERR=""
          trap 'rm -f "$AUDIT_OUTPUT" "$AUDIT_STDERR"' EXIT
          AUDIT_STDERR="$(mktemp "$RUNNER_TEMP/fanmind-production-audit-stderr.XXXXXX")"

          AUDIT_EXIT_CODE=0
          FANMIND_AUDIT_VERIFIER_PATH=/usr/local/lib/fanmind-ops/verify-backup-artifact.mjs \
          /usr/local/lib/fanmind-audit/read-only-production-audit.sh \
            > "$AUDIT_OUTPUT" 2> "$AUDIT_STDERR" || AUDIT_EXIT_CODE=$?
          node \
            /usr/local/lib/fanmind-audit/verify-production-audit-output.mjs \
            "$AUDIT_OUTPUT" \
            "$EXPECTED_COMMIT" \
            "$AUDIT_EXIT_CODE"

      - name: Write sanitized audit receipt
        env:
          EXPECTED_COMMIT: ${{ steps.target.outputs.commit }}
        shell: bash
        run: |
          set -euo pipefail
          RECEIPT="$RUNNER_TEMP/fanmind-production-audit-receipt.json"
          printf '{"schema":"fanmind-production-audit-receipt-v1","release_commit":"%s","run_id":"%s","run_attempt":"%s","result":"success"}\n' \
            "$EXPECTED_COMMIT" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > "$RECEIPT"
          chmod 0600 "$RECEIPT"

      - name: Store sanitized audit receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fanmind-production-audit-${{ steps.target.outputs.commit }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fanmind-production-audit-receipt.json
          if-no-files-found: error
          retention-days: 14
