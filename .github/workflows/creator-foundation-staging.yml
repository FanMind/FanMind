name: FanMind Creator Foundation Staging

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Read-only verification or controlled isolated Staging installation'
        required: true
        default: verify
        type: choice
        options: [verify, apply, upgrade, accept, cleanup]
      reviewed_commit:
        description: 'Exact reviewed main commit containing the pinned controlled SQL'
        required: true
        type: string
      confirmation:
        description: 'Type the selected action followed by -creator-foundation'
        required: true
        type: string
      cleanup_receipt:
        description: 'Cleanup only: original RUN_ID:RUN_ATTEMPT:COMMIT from the failed acceptance'
        required: false
        default: ''
        type: string

concurrency:
  group: fanmind-staging-core-csv-write
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  apply-creator-foundation:
    name: Verify or install the Creator foundation on isolated Staging
    if: >-
      ${{
        github.ref == 'refs/heads/main' &&
        inputs.reviewed_commit == github.sha &&
        ((inputs.action == 'verify' && inputs.confirmation == 'verify-creator-foundation') || (inputs.action == 'apply' && inputs.confirmation == 'apply-creator-foundation') || (inputs.action == 'upgrade' && inputs.confirmation == 'upgrade-creator-foundation') || (inputs.action == 'accept' && inputs.confirmation == 'accept-creator-foundation') || (inputs.action == 'cleanup' && inputs.confirmation == 'cleanup-creator-foundation')) &&
        ((inputs.action == 'cleanup' && inputs.cleanup_receipt != '') || (inputs.action != 'cleanup' && inputs.cleanup_receipt == ''))
      }}
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    environment: staging
    env:
      FANMIND_RUNTIME_ENVIRONMENT: staging
      NEXT_PUBLIC_APP_URL: ${{ vars.FANMIND_STAGING_APP_URL }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.FANMIND_STAGING_SUPABASE_URL }}
      FANMIND_TARGET_API_ORIGIN: ${{ vars.FANMIND_STAGING_APP_URL }}
      FANMIND_PRODUCTION_API_ORIGIN: https://fanmind.ch
      FANMIND_TARGET_SUPABASE_PROJECT_REF: ${{ vars.FANMIND_STAGING_SUPABASE_PROJECT_REF }}
      FANMIND_PRODUCTION_SUPABASE_PROJECT_REF: ${{ vars.FANMIND_PRODUCTION_SUPABASE_PROJECT_REF }}
      FANMIND_ENABLE_NON_PRODUCTION_WRITES: ${{ (inputs.action == 'apply' || inputs.action == 'upgrade') && 'true' || 'false' }}
      FANMIND_NON_PRODUCTION_WRITE_ACK: ${{ (inputs.action == 'apply' || inputs.action == 'upgrade') && 'I_UNDERSTAND_NON_PRODUCTION_ONLY' || '' }}
      FANMIND_CREATOR_FOUNDATION_REVIEWED_COMMIT: ${{ inputs.reviewed_commit }}
      FANMIND_CREATOR_FOUNDATION_APPLY_CONFIRM: ${{ inputs.confirmation }}
      FANMIND_CREATOR_FOUNDATION_UPGRADE_CONFIRM: ${{ inputs.confirmation }}
      FANMIND_CREATOR_FOUNDATION_VERIFY_CONFIRM: ${{ (inputs.action == 'accept' || inputs.action == 'cleanup') && 'verify-creator-foundation' || inputs.confirmation }}
      FANMIND_CREATOR_INTELLIGENCE_ENABLED: 'false'
      PGHOST: ${{ secrets.FANMIND_STAGING_DB_HOST }}
      FANMIND_TARGET_DB_HOST: ${{ secrets.FANMIND_STAGING_DB_HOST }}
      FANMIND_PRODUCTION_DB_HOST: ${{ format('db.{0}.supabase.co', vars.FANMIND_PRODUCTION_SUPABASE_PROJECT_REF) }}
      PGPORT: '5432'
      PGDATABASE: ${{ vars.FANMIND_STAGING_DB_NAME }}
      PGUSER: ${{ format('postgres.{0}', vars.FANMIND_STAGING_SUPABASE_PROJECT_REF) }}
      PGSSLMODE: verify-full
      PGSSLROOTCERT: ${{ github.workspace }}/config/certificates/supabase-root-2021-ca.crt

    steps:
      - name: Checkout reviewed main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Verify pinned controlled SQL offline
        run: node scripts/operations/creator-foundation-staging-runner.mjs --check

      - name: Prepare dedicated private database password file
        env:
          FANMIND_STAGING_DB_PASSWORD: ${{ secrets.FANMIND_STAGING_DB_PASSWORD }}
          PGPASSFILE: ${{ runner.temp }}/fanmind-creator-foundation.pgpass
        run: |
          set -euo pipefail
          umask 077
          case "$FANMIND_STAGING_DB_PASSWORD" in
            ''|*$'\n'*|*$'\r'*)
              echo "Staging database password is missing or contains an unsupported line break." >&2
              exit 1
              ;;
          esac
          ESCAPED_DB_PASSWORD="${FANMIND_STAGING_DB_PASSWORD//\\/\\\\}"
          ESCAPED_DB_PASSWORD="${ESCAPED_DB_PASSWORD//:/\\:}"
          printf '%s:%s:%s:%s:%s\n' \
            "$PGHOST" "$PGPORT" "$PGDATABASE" "$PGUSER" \
            "$ESCAPED_DB_PASSWORD" > "$PGPASSFILE"
          chmod 600 "$PGPASSFILE"

      - name: Verify or install the pinned Creator foundation
        env:
          PGPASSFILE: ${{ runner.temp }}/fanmind-creator-foundation.pgpass
          CREATOR_ACTION: ${{ inputs.action }}
        run: |
          case "$CREATOR_ACTION" in
            verify) node scripts/operations/creator-foundation-staging-runner.mjs --verify ;;
            apply) node scripts/operations/creator-foundation-staging-runner.mjs --apply ;;
            upgrade) node scripts/operations/creator-foundation-staging-runner.mjs --upgrade ;;
            accept|cleanup)
              RESULT="$(node scripts/operations/creator-foundation-staging-runner.mjs --verify)"
              printf '%s\n' "$RESULT"
              grep -Fxq 'CREATOR_FOUNDATION_POSTFLIGHT=PASS' <<< "$RESULT"
              ;;
            *) exit 1 ;;
          esac

      - name: Install the pinned PDF acceptance dependency without lifecycle scripts
        if: ${{ inputs.action == 'accept' }}
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify the reviewed Staging deployment before fixture authentication
        if: ${{ inputs.action == 'accept' }}
        run: node scripts/operations/creator-staging-disclosure-acceptance.mjs --verify-release

      - name: Generate a masked ephemeral member credential
        if: ${{ inputs.action == 'accept' }}
        id: member_generation
        run: node scripts/operations/staging-ephemeral-member-credential.mjs --generate

      - name: Prepare the protected acceptance or cleanup invocation
        if: ${{ inputs.action == 'accept' || inputs.action == 'cleanup' }}
        id: member_activation
        env: &creator_acceptance_environment
          FANMIND_ENABLE_NON_PRODUCTION_WRITES: 'true'
          FANMIND_NON_PRODUCTION_WRITE_ACK: I_UNDERSTAND_NON_PRODUCTION_ONLY
          FANMIND_STAGING_SUPABASE_URL: ${{ secrets.FANMIND_STAGING_SUPABASE_URL }}
          FANMIND_STAGING_SUPABASE_ANON_KEY: ${{ secrets.FANMIND_STAGING_SUPABASE_ANON_KEY }}
          FANMIND_STAGING_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.FANMIND_STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          FANMIND_STAGING_E2E_WORKSPACE_ID: ${{ vars.FANMIND_STAGING_E2E_WORKSPACE_ID }}
          FANMIND_STAGING_E2E_SECONDARY_WORKSPACE_ID: ${{ vars.FANMIND_STAGING_E2E_SECONDARY_WORKSPACE_ID }}
          FANMIND_STAGING_E2E_EMAIL: ${{ secrets.FANMIND_STAGING_E2E_EMAIL }}
          FANMIND_STAGING_E2E_PASSWORD: ${{ secrets.FANMIND_STAGING_E2E_PASSWORD }}
          FANMIND_STAGING_E2E_SECONDARY_EMAIL: ${{ secrets.FANMIND_STAGING_E2E_SECONDARY_EMAIL }}
          FANMIND_STAGING_E2E_SECONDARY_PASSWORD: ${{ secrets.FANMIND_STAGING_E2E_SECONDARY_PASSWORD }}
          FANMIND_STAGING_CREATOR_ACCEPT_CONFIRM: ${{ inputs.confirmation }}
          FANMIND_CREATOR_CLEANUP_RECEIPT: ${{ inputs.cleanup_receipt }}
          CREATOR_ACTION: ${{ inputs.action }}
          FANMIND_STAGING_EPHEMERAL_MEMBER_REVIEWED_COMMIT: ${{ inputs.reviewed_commit }}
          FANMIND_STAGING_EPHEMERAL_MEMBER_CONFIRM: activate-staging-ephemeral-member-credential
          NODE_OPTIONS: ''
          NODE_EXTRA_CA_CERTS: ''
          NODE_USE_ENV_PROXY: ''
          HTTP_PROXY: ''
          HTTPS_PROXY: ''
          ALL_PROXY: ''
        run: |
          set -euo pipefail
          unset http_proxy https_proxy all_proxy
          case "$CREATOR_ACTION" in
            accept) node scripts/operations/staging-ephemeral-member-credential.mjs --activate ;;
            cleanup) node scripts/operations/creator-staging-jwt-acceptance.mjs --validate-cleanup ;;
            *) exit 1 ;;
          esac

      - name: Prove real JWT Creator isolation and atomic approval
        if: ${{ inputs.action == 'accept' }}
        id: creator_acceptance
        env: *creator_acceptance_environment
        run: |
          set -euo pipefail
          unset http_proxy https_proxy all_proxy
          node scripts/operations/creator-staging-jwt-acceptance.mjs --run

      - name: Recover only the explicitly selected failed acceptance
        if: ${{ inputs.action == 'cleanup' }}
        env: *creator_acceptance_environment
        run: |
          set -euo pipefail
          unset http_proxy https_proxy all_proxy
          node scripts/operations/creator-staging-jwt-acceptance.mjs --cleanup

      - name: Independently verify exact test-bundle cleanup
        if: ${{ always() && inputs.action == 'accept' && steps.creator_acceptance.outcome != 'skipped' && steps.member_generation.outcome == 'success' }}
        env: *creator_acceptance_environment
        run: |
          set -euo pipefail
          unset http_proxy https_proxy all_proxy
          node scripts/operations/creator-staging-jwt-acceptance.mjs --cleanup

      - name: Revoke the temporary marked member credential
        if: ${{ always() && inputs.action == 'accept' && steps.member_generation.outcome == 'success' }}
        env: *creator_acceptance_environment
        run: |
          set -euo pipefail
          unset http_proxy https_proxy all_proxy
          FANMIND_STAGING_EPHEMERAL_MEMBER_CONFIRM=revoke-staging-ephemeral-member-credential node scripts/operations/staging-ephemeral-member-credential.mjs --revoke

      - name: Remove dedicated private database password file
        if: ${{ always() }}
        env:
          PGPASSFILE: ${{ runner.temp }}/fanmind-creator-foundation.pgpass
        run: rm -f "$PGPASSFILE"
