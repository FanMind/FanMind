name: Check final Daily source corrections
on:
  push:
    branches: [fix/daily-admin-visibility-20260914]
    paths: [.github/workflows/daily-admin-source-check.yml]
permissions:
  contents: write
jobs:
  source:
    if: github.repository == 'FanMind/FanMind' && github.ref == 'refs/heads/fix/daily-admin-visibility-20260914'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.13.1
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Reconcile exact source assertions and check existing tests without provider access
        run: |
          python3 - <<'PY'
          from pathlib import Path
          def replace(file, old, new):
              path = Path(file)
              text = path.read_text()
              assert text.count(old) == 1, file + ': exact source mismatch'
              path.write_text(text.replace(old, new))
          p = 'tests/customer-billing-policy.test.mjs'
          replace(p, '  assert.match(runtimeSettingsSource, /publicDailyTestPlanEnabled/);', '  assert.match(runtimeSettingsSource, /getPublicDailyPlanState/);')
          replace(p, '  assert.match(runtimeSettingsSource, /getTemporaryPublicDailyTestPlanStatus/);', '  assert.match(runtimeSettingsSource, /readDailyPlanSettings/);\n  assert.doesNotMatch(runtimeSettingsSource, /getTemporaryPublicDailyTestPlanStatus/);')
          replace(p, r'  assert.match(runtimeSettingsSource, /rename\(temporaryPath, settingsPath\)/);', r'  assert.match(fs.readFileSync("src/lib/dailyPlanSettings.mjs", "utf8"), /rename\(temporary, file\)/);')
          replace(p, r'/PUBLIC_DAILY_PLAN_ENABLED && termsReady && provisioningReady && stripeReady[\s\S]*Sichere Registrierung[\s\S]*Stripe &amp; Webhook/u', r'/activationReady = termsReady && provisioningReady && stripeReady[\s\S]*Workspace-Erstellung[\s\S]*Stripe &amp; Webhook/u')
          replace('src/app/admin/settings/page.tsx', '<button type="submit" role="switch"', '<button className={visibility.enabled ? styles.buttonSecondary : styles.buttonPrimary} type="submit" role="switch"')
          replace('src/app/api/billing/checkout/route.ts', 'Das interne Live-Testabo kann nur im Adminbereich gestartet werden.', 'Dieses Angebot ist derzeit für neue Buchungen nicht verfügbar.')
          PY
          node --test tests/customer-billing-policy.test.mjs tests/daily-admin-visibility.test.mjs
          git diff --check
      - name: Publish unreferenced corrected source objects only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess, urllib.request
          from pathlib import Path
          assert os.environ['GITHUB_REPOSITORY'] == 'FanMind/FanMind'
          assert os.environ['GITHUB_REF'] == 'refs/heads/fix/daily-admin-visibility-20260914'
          files = ['tests/customer-billing-policy.test.mjs', 'src/app/admin/settings/page.tsx', 'src/app/api/billing/checkout/route.ts']
          assert set(subprocess.check_output(['git','diff','--name-only'], text=True).splitlines()) == set(files)
          def api(endpoint, payload):
              request = urllib.request.Request('https://api.github.com/repos/FanMind/FanMind/git/' + endpoint, data=json.dumps(payload).encode(), method='POST', headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'], 'Accept':'application/vnd.github+json', 'Content-Type':'application/json'})
              with urllib.request.urlopen(request, timeout=30) as response: return json.load(response)
          entries = []
          for file in files:
              sha = api('blobs', {'content':Path(file).read_text(), 'encoding':'utf-8'})['sha']
              entries.append({'path':file,'mode':'100644','type':'blob','sha':sha})
          entries.append({'path':'.github/workflows/daily-admin-source-check.yml','mode':'100644','type':'blob','sha':None})
          tree = subprocess.check_output(['git','rev-parse','HEAD^{tree}'], text=True).strip()
          result = api('trees', {'base_tree':tree,'tree':entries})
          print('CORRECTED_DAILY_TREE=' + result['sha'])
          print('CORRECTED_PARENT=' + subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip())
          PY
