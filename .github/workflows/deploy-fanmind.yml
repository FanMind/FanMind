name: Deploy FanMind

on:
  workflow_dispatch:
    inputs:
      release_commit:
        description: Exact 40-character main commit to release
        required: true
        type: string
      task_id:
        description: Bound FM task identifier
        required: true
        type: string
      risk:
        description: Reviewed risk class; this value never grants authorization
        required: true
        type: choice
        options: [R1, R2, R3, R4]
      authorization_comment_id:
        description: Exact owner authorization issue-comment ID
        required: true
        type: string
      recovery_audit_run_id:
        description: Fresh successful read-only Production audit run ID
        required: true
        type: string
      confirmation:
        description: Type release-production
        required: true
        type: string

concurrency:
  group: fanmind-production-deploy
  cancel-in-progress: false

permissions:
  actions: read
  contents: read
  issues: read
  pull-requests: read

jobs:
  authorize-release:
    name: Verify exact release authorization and evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      release_commit: ${{ steps.control.outputs.release_commit }}
      manifest_sha256: ${{ steps.control.outputs.manifest_sha256 }}
      rollback_commit: ${{ steps.control.outputs.rollback_commit }}
    steps:
      - name: Checkout exact requested main revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_commit }}
          persist-credentials: false

      - name: Verify owner authorization, review, CI and recovery evidence
        id: control
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FANMIND_PRODUCTION_RELEASE_GATE_ENABLED: ${{ vars.FANMIND_PRODUCTION_RELEASE_GATE_ENABLED }}
          FANMIND_PRODUCTION_OWNER_LOGIN: ${{ vars.FANMIND_PRODUCTION_OWNER_LOGIN }}
          FANMIND_RELEASE_COMMIT: ${{ inputs.release_commit }}
          FANMIND_RELEASE_TASK_ID: ${{ inputs.task_id }}
          FANMIND_RELEASE_RISK: ${{ inputs.risk }}
          FANMIND_RELEASE_CONFIRMATION: ${{ inputs.confirmation }}
          FANMIND_AUTHORIZATION_COMMENT_ID: ${{ inputs.authorization_comment_id }}
          FANMIND_RECOVERY_AUDIT_RUN_ID: ${{ inputs.recovery_audit_run_id }}
          FANMIND_RELEASE_MANIFEST_PATH: ${{ runner.temp }}/fanmind-production-release-control.json
        run: node scripts/operations/production-release-control.mjs

      - name: Store sanitized release-control manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fanmind-production-release-control-${{ steps.control.outputs.release_commit }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fanmind-production-release-control.json
          if-no-files-found: error
          retention-days: 30

  deploy:
    name: Deploy to Exoscale production
    needs: authorize-release
    environment: production
    timeout-minutes: 60
    runs-on:
      - self-hosted
      - fanmind-prod
      - exoscale
      - linux
      - x64

    steps:
      - name: Deploy on fanmind-prod-01
        env:
          EXPECTED_RELEASE_COMMIT: ${{ needs.authorize-release.outputs.release_commit }}
        run: |
          set -euo pipefail

          SOURCE_DIR="/var/www/fanmind"
          cd "$SOURCE_DIR"

          if [[ ! "$EXPECTED_RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid triggering release commit." >&2
            exit 1
          fi
          case "$(git remote get-url origin)" in
            git@github.com:Bernds-tech/FanMind.git|https://github.com/Bernds-tech/FanMind.git) ;;
            *)
              echo "Unexpected Production repository origin." >&2
              exit 1
              ;;
          esac

          # Seed fail-closed runtime settings once. A Platform Admin may later
          # enable the manual Daily beta; deploys never overwrite that choice.
          RUNTIME_SETTINGS_FILE="$SOURCE_DIR/.fanmind-runtime-settings.json"
          if [ ! -e "$RUNTIME_SETTINGS_FILE" ]; then
            RUNTIME_SETTINGS_TMP="$(mktemp "$SOURCE_DIR/.fanmind-runtime-settings.XXXXXX")"
            printf '{"publicDailyTestPlanEnabled":false,"publicDailyTestPlanEnabledUntil":null}\n' > "$RUNTIME_SETTINGS_TMP"
            chmod 0600 "$RUNTIME_SETTINGS_TMP"
            mv "$RUNTIME_SETTINGS_TMP" "$RUNTIME_SETTINGS_FILE"
          fi

          echo "Deploying the exact triggering FanMind commit on Exoscale..."
          git fetch --prune origin main

          if ! git cat-file -e "$EXPECTED_RELEASE_COMMIT^{commit}" 2>/dev/null; then
            git fetch --no-tags origin "$EXPECTED_RELEASE_COMMIT"
          fi
          if ! git merge-base --is-ancestor "$EXPECTED_RELEASE_COMMIT" origin/main; then
            echo "Production accepts only the triggering commit when it is reachable from origin/main." >&2
            exit 1
          fi
          RELEASE_COMMIT="$EXPECTED_RELEASE_COMMIT"
          export FANMIND_RELEASE_COMMIT="$RELEASE_COMMIT"
          # ChatAdmin fan runtime is still capability-gated in the database; Production has exactly one enabled workspace.
          export FANMIND_CHAT_ADMIN_CHARACTER_FANS_ENABLED=true

          if ! grep -Eq '^[[:space:]]*FANMIND_ENABLE_ISOLATED_RELEASE_DEPLOY[[:space:]]*=[[:space:]]*true[[:space:]]*$' .env.production; then
            echo "Production release blocked: isolated release deployment is not enabled." >&2
            exit 1
          fi

          DEPLOY_SCRIPT="$(mktemp /tmp/fanmind-isolated-deploy.XXXXXX.sh)"
          trap 'rm -f "$DEPLOY_SCRIPT"' EXIT
          git show "$RELEASE_COMMIT:scripts/operations/deploy-isolated-release.sh" > "$DEPLOY_SCRIPT"
          chmod 0700 "$DEPLOY_SCRIPT"
          FANMIND_SOURCE_DIR="$SOURCE_DIR" \
            bash "$DEPLOY_SCRIPT" "$RELEASE_COMMIT"
          rm -f "$DEPLOY_SCRIPT"
          trap - EXIT

          cd "$SOURCE_DIR"
          if [ "$(git rev-parse HEAD)" != "$RELEASE_COMMIT" ]; then
            echo "Source checkout is not synchronized after deployment." >&2
            exit 1
          fi

          sudo install -d -o root -g root -m 0700 /usr/local/lib/fanmind-ops
          sudo install -d -o root -g root -m 0755 /usr/local/lib/fanmind-audit
          sudo install -d -o root -g root -m 0755 /usr/local/lib/fanmind-monitor
          sudo install -d -o root -g root -m 0755 /usr/local/src/lib
          test -x /usr/bin/flock
          sudo install -o root -g root -m 0755 scripts/operations/write-backup-release-env.sh /usr/local/lib/fanmind-ops/write-backup-release-env.sh
          sudo install -o root -g root -m 0644 config/certificates/supabase-root-2021-ca.crt /usr/local/lib/fanmind-ops/supabase-root-2021-ca.crt
          sudo install -o root -g root -m 0750 scripts/operations/database-authorization-contract.mjs /usr/local/lib/fanmind-ops/database-authorization-contract.mjs
          sudo install -o root -g root -m 0750 scripts/operations/backup-worker.mjs /usr/local/lib/fanmind-ops/backup-worker.mjs
          sudo install -o root -g root -m 0750 scripts/operations/enqueue-backup-job.mjs /usr/local/lib/fanmind-ops/enqueue-backup-job.mjs
          sudo install -o root -g root -m 0750 scripts/operations/backup-retention.mjs /usr/local/lib/fanmind-ops/backup-retention.mjs
          sudo install -o root -g root -m 0750 scripts/operations/offsite-backup-retention-plan.mjs /usr/local/lib/fanmind-ops/offsite-backup-retention-plan.mjs
          sudo install -o root -g root -m 0750 scripts/operations/verify-backup-artifact.mjs /usr/local/lib/fanmind-ops/verify-backup-artifact.mjs
          sudo install -o root -g root -m 0755 scripts/operations/read-only-production-audit.sh /usr/local/lib/fanmind-audit/read-only-production-audit.sh
          sudo install -o root -g root -m 0644 scripts/operations/production-boot-readiness.mjs /usr/local/lib/fanmind-audit/production-boot-readiness.mjs
          sudo install -o root -g root -m 0755 scripts/operations/verify-production-audit-output.mjs /usr/local/lib/fanmind-audit/verify-production-audit-output.mjs
          sudo install -o root -g root -m 0755 scripts/operations/verify-operations-monitor-probe-log.mjs /usr/local/lib/fanmind-audit/verify-operations-monitor-probe-log.mjs
          sudo install -o root -g root -m 0755 scripts/operations/verify-operations-monitor-lifecycle-log.mjs /usr/local/lib/fanmind-audit/verify-operations-monitor-lifecycle-log.mjs
          sudo install -o root -g root -m 0755 scripts/operations/verify-operations-monitor-migration-log.mjs /usr/local/lib/fanmind-audit/verify-operations-monitor-migration-log.mjs
          sudo install -o root -g root -m 0755 scripts/operations/verify-backup-verification-migration-log.mjs /usr/local/lib/fanmind-audit/verify-backup-verification-migration-log.mjs
          sudo install -o root -g root -m 0755 scripts/operations/verify-server-error-migration-log.mjs /usr/local/lib/fanmind-audit/verify-server-error-migration-log.mjs
          sudo install -o root -g root -m 0755 scripts/operations/verify-server-error-acceptance-log.mjs /usr/local/lib/fanmind-audit/verify-server-error-acceptance-log.mjs
          sudo install -o root -g root -m 0755 scripts/operations/verify-trigger-function-hardening-production-log.mjs /usr/local/lib/fanmind-audit/verify-trigger-function-hardening-production-log.mjs
          sudo install -o root -g root -m 0644 scripts/public-health-policy.mjs /usr/local/lib/public-health-policy.mjs
          sudo install -o root -g root -m 0644 scripts/operations/operations-monitor.mjs /usr/local/lib/fanmind-monitor/operations-monitor.mjs
          sudo install -o root -g root -m 0644 scripts/operations/operations-monitor-lifecycle.mjs /usr/local/lib/fanmind-monitor/operations-monitor-lifecycle.mjs
          sudo install -o root -g root -m 0750 scripts/operations/enable-operations-monitor.sh /usr/local/lib/fanmind-ops/enable-operations-monitor.sh
          sudo install -o root -g root -m 0750 scripts/operations/operations-monitor-migration-runner.mjs /usr/local/lib/fanmind-ops/operations-monitor-migration-runner.mjs
          sudo install -o root -g root -m 0600 supabase/migrations/20260718190000_operations_monitor_components.sql /usr/local/lib/fanmind-ops/20260718190000_operations_monitor_components.sql
          sudo install -o root -g root -m 0750 scripts/operations/backup-verification-migration-runner.mjs /usr/local/lib/fanmind-ops/backup-verification-migration-runner.mjs
          sudo install -o root -g root -m 0600 supabase/migrations/20260718173000_enable_safe_backup_verification.sql /usr/local/lib/fanmind-ops/20260718173000_enable_safe_backup_verification.sql
          sudo install -o root -g root -m 0750 scripts/operations/server-error-migration-runner.mjs /usr/local/lib/fanmind-ops/server-error-migration-runner.mjs
          sudo install -o root -g root -m 0750 scripts/operations/server-error-production-acceptance.mjs /usr/local/lib/fanmind-ops/server-error-production-acceptance.mjs
          sudo install -o root -g root -m 0750 scripts/operations/enable-server-error-tracking.sh /usr/local/lib/fanmind-ops/enable-server-error-tracking.sh
          sudo install -o root -g root -m 0600 supabase/migrations/20260718203000_privacy_server_error_tracking.sql /usr/local/lib/fanmind-ops/20260718203000_privacy_server_error_tracking.sql
          sudo install -o root -g root -m 0750 scripts/operations/trigger-function-hardening-production-runner.mjs /usr/local/lib/fanmind-ops/trigger-function-hardening-production-runner.mjs
          sudo install -o root -g root -m 0600 supabase/controlled/20260806203023_harden_trigger_function_privileges.sql /usr/local/lib/fanmind-ops/20260806203023_harden_trigger_function_privileges.sql
          sudo install -o root -g root -m 0750 scripts/operations/run-demo-cleanup.mjs /usr/local/lib/fanmind-ops/run-demo-cleanup.mjs
          sudo install -o root -g root -m 0750 scripts/operations/webhook-diagnostic-retention.mjs /usr/local/lib/fanmind-ops/webhook-diagnostic-retention.mjs
          sudo install -o root -g root -m 0750 scripts/operations/process-account-deletion.mjs /usr/local/lib/fanmind-ops/process-account-deletion.mjs
          sudo install -o root -g root -m 0644 src/lib/confirmedChatLearningDeletionVerification.mjs /usr/local/src/lib/confirmedChatLearningDeletionVerification.mjs
          sudo install -o root -g root -m 0750 scripts/operations/deploy-isolated-release.sh /usr/local/lib/fanmind-ops/deploy-isolated-release.sh
          sudo install -o root -g root -m 0644 ops/systemd/fanmind-backup-worker.service /etc/systemd/system/fanmind-backup-worker.service
          sudo install -o root -g root -m 0644 ops/systemd/fanmind-backup-enqueue@.service /etc/systemd/system/fanmind-backup-enqueue@.service
          sudo install -o root -g root -m 0644 ops/systemd/fanmind-backup-retention.service /etc/systemd/system/fanmind-backup-retention.service
          sudo install -o root -g root -m 0644 ops/systemd/fanmind-backup-database.timer /etc/systemd/system/fanmind-backup-database.timer
          sudo install -o root -g root -m 0644 ops/systemd/fanmind-backup-storage.timer /etc/systemd/system/fanmind-backup-storage.timer
          sudo install -o root -g root -m 0644 ops/systemd/fanmind-backup-server_config.timer /etc/systemd/system/fanmind-backup-server_config.timer
          sudo install -o root -g root -m 0644 ops/systemd/fanmind-backup-full.timer /etc/systemd/system/fanmind-backup-full.timer
          sudo install -o root -g root -m 0644 ops/systemd/fanmind-backup-retention.timer /etc/systemd/system/fanmind-backup-retention.timer
          sudo install -o root -g root -m 0644 ops/systemd/fanmind-operations-monitor.service /etc/systemd/system/fanmind-operations-monitor.service
          sudo install -o root -g root -m 0644 ops/systemd/fanmind-operations-monitor-probe.service /etc/systemd/system/fanmind-operations-monitor-probe.service
          sudo install -o root -g root -m 0644 ops/systemd/fanmind-operations-monitor-lifecycle.service /etc/systemd/system/fanmind-operations-monitor-lifecycle.service
          sudo install -o root -g root -m 0644 ops/systemd/fanmind-operations-monitor.timer /etc/systemd/system/fanmind-operations-monitor.timer
          sudo install -o root -g root -m 0644 ops/systemd/fanmind-operations-monitor-migration@.service /etc/systemd/system/fanmind-operations-monitor-migration@.service
          sudo install -o root -g root -m 0644 ops/systemd/fanmind-backup-verification-migration@.service /etc/systemd/system/fanmind-backup-verification-migration@.service
          sudo install -o root -g root -m 0644 ops/systemd/fanmind-server-error-migration@.service /etc/systemd/system/fanmind-server-error-migration@.service
          sudo install -o root -g root -m 0644 ops/systemd/fanmind-server-error-acceptance.service /etc/systemd/system/fanmind-server-error-acceptance.service
          sudo install -o root -g root -m 0644 ops/systemd/fanmind-trigger-function-hardening@.service /etc/systemd/system/fanmind-trigger-function-hardening@.service
          sudo install -o root -g root -m 0644 ops/systemd/fanmind-demo-cleanup.service /etc/systemd/system/fanmind-demo-cleanup.service
          sudo install -o root -g root -m 0644 ops/systemd/fanmind-demo-cleanup.timer /etc/systemd/system/fanmind-demo-cleanup.timer
          sudo install -o root -g root -m 0644 ops/systemd/fanmind-webhook-retention.service /etc/systemd/system/fanmind-webhook-retention.service
          sudo install -o root -g root -m 0644 ops/systemd/fanmind-webhook-retention.timer /etc/systemd/system/fanmind-webhook-retention.timer
          sudo systemctl daemon-reload

          sudo /usr/local/lib/fanmind-ops/write-backup-release-env.sh "$RELEASE_COMMIT"

          if sudo systemctl is-active --quiet fanmind-backup-worker.service; then
            sudo systemctl restart fanmind-backup-worker.service
          else
            echo "Backup worker is not active; not starting it."
          fi

          if sudo systemctl is-enabled --quiet fanmind-operations-monitor.timer; then
            sudo systemctl restart fanmind-operations-monitor.timer
          else
            echo "Operations monitor installed but intentionally not enabled yet."
          fi

          if sudo systemctl is-enabled --quiet fanmind-demo-cleanup.timer; then
            sudo systemctl restart fanmind-demo-cleanup.timer
          else
            echo "Demo cleanup timer installed but intentionally not enabled yet."
          fi

          if sudo systemctl is-enabled --quiet fanmind-webhook-retention.timer; then
            sudo systemctl restart fanmind-webhook-retention.timer
          else
            echo "Webhook retention timer installed but intentionally not enabled before migration verification."
          fi

          echo "FanMind deployment finished successfully at $RELEASE_COMMIT."

      - name: Write sanitized Production release result
        if: always()
        env:
          RESULT: ${{ job.status }}
          RELEASE_COMMIT: ${{ needs.authorize-release.outputs.release_commit }}
          ROLLBACK_COMMIT: ${{ needs.authorize-release.outputs.rollback_commit }}
          MANIFEST_SHA256: ${{ needs.authorize-release.outputs.manifest_sha256 }}
          TASK_ID: ${{ inputs.task_id }}
          RISK: ${{ inputs.risk }}
        run: |
          set -euo pipefail
          RECEIPT="$RUNNER_TEMP/fanmind-production-release-result.json"
          node - "$RECEIPT" <<'NODE'
          const fs = require("node:fs");
          const [path] = process.argv.slice(2);
          const receipt = {
            schema: "fanmind-production-release-result-v1",
            task_id: process.env.TASK_ID,
            risk: process.env.RISK,
            release_commit: process.env.RELEASE_COMMIT,
            rollback_commit: process.env.ROLLBACK_COMMIT,
            control_manifest_sha256: process.env.MANIFEST_SHA256,
            workflow_run: { id: process.env.GITHUB_RUN_ID, attempt: process.env.GITHUB_RUN_ATTEMPT },
            result: process.env.RESULT,
          };
          fs.writeFileSync(path, `${JSON.stringify(receipt, null, 2)}\n`, { mode: 0o600 });
          NODE

      - name: Store sanitized Production release result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fanmind-production-release-result-${{ needs.authorize-release.outputs.release_commit }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fanmind-production-release-result.json
          if-no-files-found: error
          retention-days: 30
