name: FanMind CodeQL

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

concurrency:
  group: fanmind-codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  packages: read
  security-events: write

jobs:
  analyze:
    name: JavaScript and TypeScript security analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/mobile/package-lock.json

      - name: Install web dependencies reproducibly
        run: npm ci --no-audit --no-fund

      - name: Install Mobile dependencies reproducibly
        run: npm ci --prefix apps/mobile --no-audit --no-fund

      - name: Analyze JavaScript and TypeScript
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:javascript-typescript"

      - name: Summarize bounded CodeQL finding locations
        if: always()
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const dir = '../results';
          if (fs.existsSync(dir)) for (const file of fs.readdirSync(dir).filter(x => x.endsWith('.sarif'))) {
            const path = `${dir}/${file}`;
            if (fs.statSync(path).size > 32 * 1024 * 1024) continue;
            for (const run of JSON.parse(fs.readFileSync(path, 'utf8')).runs ?? []) {
              for (const result of (run.results ?? []).slice(0, 20)) {
                const loc = result.locations?.[0]?.physicalLocation;
                console.log('CODEQL_FINDING=' + JSON.stringify({ rule: result.ruleId, path: loc?.artifactLocation?.uri, line: loc?.region?.startLine }));
              }
            }
          }
          JS
