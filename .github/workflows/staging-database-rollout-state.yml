name: FanMind Staging Database Rollout State

on:
  workflow_dispatch:
    inputs:
      scope:
        description: 'Read-only scope; Capacity returns baseline match or block only'
        required: true
        type: choice
        default: rollout
        options:
          - rollout
          - capacity
      reviewed_commit:
        description: 'Exact reviewed main commit to bind to this read-only database state check'
        required: true
        type: string
      confirmation:
        description: 'Type verify-staging-database-rollout-state to run the read-only check'
        required: true
        type: string
      capacity_confirmation:
        description: 'For capacity only: type prepare-readonly-capacity-preflight; requires a new exact authorization'
        required: false
        default: ''
        type: string

concurrency:
  group: fanmind-staging-database-rollout-state-read
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify-staging-database-rollout-state:
    name: Derive safe rollout actions without database writes
    if: >-
      ${{
        github.ref == 'refs/heads/main' &&
        inputs.reviewed_commit == github.sha &&
        inputs.confirmation == 'verify-staging-database-rollout-state'
      }}
    runs-on: ubuntu-24.04
    environment: staging
    env:
      FANMIND_RUNTIME_ENVIRONMENT: staging
      NEXT_PUBLIC_APP_URL: ${{ vars.FANMIND_STAGING_APP_URL }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.FANMIND_STAGING_SUPABASE_URL }}
      FANMIND_TARGET_API_ORIGIN: ${{ vars.FANMIND_STAGING_APP_URL }}
      FANMIND_PRODUCTION_API_ORIGIN: https://fanmind.ch
      FANMIND_TARGET_SUPABASE_PROJECT_REF: ${{ vars.FANMIND_STAGING_SUPABASE_PROJECT_REF }}
      FANMIND_PRODUCTION_SUPABASE_PROJECT_REF: ${{ vars.FANMIND_PRODUCTION_SUPABASE_PROJECT_REF }}
      FANMIND_ENABLE_NON_PRODUCTION_WRITES: 'false'
      FANMIND_NON_PRODUCTION_WRITE_ACK: ''
      FANMIND_STAGING_DATABASE_ROLLOUT_REVIEWED_COMMIT: ${{ inputs.reviewed_commit }}
      FANMIND_STAGING_DATABASE_ROLLOUT_STATE_CONFIRM: verify-staging-database-rollout-state
      FANMIND_STAGING_DATABASE_ROLLOUT_SCOPE: ${{ inputs.scope }}
      FANMIND_CAPACITY_PREFLIGHT_CONFIRM: ${{ inputs.capacity_confirmation }}
      PGHOST: ${{ secrets.FANMIND_STAGING_DB_HOST }}
      FANMIND_TARGET_DB_HOST: ${{ secrets.FANMIND_STAGING_DB_HOST }}
      FANMIND_PRODUCTION_DB_HOST: ${{ format('db.{0}.supabase.co', vars.FANMIND_PRODUCTION_SUPABASE_PROJECT_REF) }}
      PGPORT: '5432'
      PGDATABASE: ${{ vars.FANMIND_STAGING_DB_NAME }}
      PGUSER: ${{ format('postgres.{0}', vars.FANMIND_STAGING_SUPABASE_PROJECT_REF) }}
      PGSSLMODE: verify-full
      PGSSLROOTCERT: ${{ github.workspace }}/config/certificates/supabase-root-2021-ca.crt

    steps:
      - name: Checkout reviewed main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.reviewed_commit }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Validate requested read-only scope and current main before credentials
        run: |
          set -euo pipefail
          case "$FANMIND_STAGING_DATABASE_ROLLOUT_SCOPE" in
            rollout)
              test -z "$FANMIND_CAPACITY_PREFLIGHT_CONFIRM"
              ;;
            capacity)
              if [ "$FANMIND_CAPACITY_PREFLIGHT_CONFIRM" != 'prepare-readonly-capacity-preflight' ]; then
                echo 'STAGING_DATABASE_ROLLOUT_CAPACITY=BLOCK'
                exit 1
              fi
              ;;
            *)
              echo 'STAGING_DATABASE_ROLLOUT_CAPACITY=BLOCK'
              exit 1
              ;;
          esac
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse refs/remotes/origin/main)" = "$GITHUB_SHA"

      - name: Verify every reused control offline
        run: npm run db:staging-rollout-state:check

      - name: Prepare dedicated private database password file
        env:
          FANMIND_STAGING_DB_PASSWORD: ${{ secrets.FANMIND_STAGING_DB_PASSWORD }}
          PGPASSFILE: ${{ runner.temp }}/fanmind-staging-rollout-state.pgpass
        run: |
          set -euo pipefail
          umask 077
          case "$FANMIND_STAGING_DB_PASSWORD" in
            ''|*$'\n'*|*$'\r'*)
              echo "Staging database password is missing or contains an unsupported line break." >&2
              exit 1
              ;;
          esac
          ESCAPED_DB_PASSWORD="${FANMIND_STAGING_DB_PASSWORD//\\/\\\\}"
          ESCAPED_DB_PASSWORD="${ESCAPED_DB_PASSWORD//:/\\:}"
          printf '%s:%s:%s:%s:%s\n' \
            "$PGHOST" "$PGPORT" "$PGDATABASE" "$PGUSER" \
            "$ESCAPED_DB_PASSWORD" > "$PGPASSFILE"
          chmod 600 "$PGPASSFILE"

      - name: Derive read-only rollout state
        env:
          PGPASSFILE: ${{ runner.temp }}/fanmind-staging-rollout-state.pgpass
        run: npm run db:staging-rollout-state:run

      - name: Remove dedicated private database password file
        if: ${{ always() }}
        env:
          PGPASSFILE: ${{ runner.temp }}/fanmind-staging-rollout-state.pgpass
        run: rm -f "$PGPASSFILE"
