name: FanMind God Mode Gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  god-mode:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate God Mode registries
        run: python3 scripts/fanmind_god_mode_preflight.py --check
      - name: Prove fail-closed release decision
        run: python3 scripts/fanmind_release_decision.py --check
      - name: Run God Mode adversarial tests
        run: python3 -m unittest tests/test_fanmind_god_mode.py
      - name: Revalidate Project Memory
        run: |
          python3 scripts/project_memory_quality_check.py
          python3 scripts/fanmind_next_best_action.py --check
          python3 scripts/fanmind_memory_v8.py --check
