name: FanMind AI Tier Stripe Event Ledger Staging

on:
  workflow_dispatch:
    inputs:
      reviewed_commit:
        description: 'Exact reviewed main commit containing the pinned AI tier ledger control'
        required: true
        type: string
      confirmation:
        description: 'Type apply-ai-tier-stripe-event-ledger to apply the pinned controlled SQL to isolated Staging'
        required: true
        type: string

concurrency:
  group: fanmind-ai-tier-stripe-event-ledger-staging
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  apply-ai-tier-stripe-event-ledger:
    name: Apply pinned AI tier event ledger to isolated Staging
    if: >-
      ${{
        github.ref == 'refs/heads/main' &&
        inputs.reviewed_commit == github.sha &&
        inputs.confirmation == 'apply-ai-tier-stripe-event-ledger'
      }}
    runs-on: ubuntu-24.04
    environment: staging
    env:
      FANMIND_RUNTIME_ENVIRONMENT: staging
      NEXT_PUBLIC_APP_URL: ${{ vars.FANMIND_STAGING_APP_URL }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.FANMIND_STAGING_SUPABASE_URL }}
      FANMIND_TARGET_API_ORIGIN: ${{ vars.FANMIND_STAGING_APP_URL }}
      FANMIND_PRODUCTION_API_ORIGIN: https://fanmind.ch
      FANMIND_TARGET_SUPABASE_PROJECT_REF: ${{ vars.FANMIND_STAGING_SUPABASE_PROJECT_REF }}
      FANMIND_PRODUCTION_SUPABASE_PROJECT_REF: ${{ vars.FANMIND_PRODUCTION_SUPABASE_PROJECT_REF }}
      FANMIND_ENABLE_NON_PRODUCTION_WRITES: 'true'
      FANMIND_NON_PRODUCTION_WRITE_ACK: I_UNDERSTAND_NON_PRODUCTION_ONLY
      FANMIND_AI_TIER_STRIPE_EVENT_LEDGER_REVIEWED_COMMIT: ${{ inputs.reviewed_commit }}
      FANMIND_AI_TIER_STRIPE_EVENT_LEDGER_CONFIRM: apply-ai-tier-stripe-event-ledger
      PGHOST: ${{ secrets.FANMIND_STAGING_DB_HOST }}
      FANMIND_TARGET_DB_HOST: ${{ secrets.FANMIND_STAGING_DB_HOST }}
      FANMIND_PRODUCTION_DB_HOST: ${{ format('db.{0}.supabase.co', vars.FANMIND_PRODUCTION_SUPABASE_PROJECT_REF) }}
      PGPORT: ${{ vars.FANMIND_STAGING_DB_PORT }}
      PGDATABASE: ${{ vars.FANMIND_STAGING_DB_NAME }}
      PGUSER: ${{ format('postgres.{0}', vars.FANMIND_STAGING_SUPABASE_PROJECT_REF) }}
      PGSSLMODE: verify-full
      PGSSLROOTCERT: ${{ github.workspace }}/config/certificates/supabase-root-2021-ca.crt

    steps:
      - name: Checkout reviewed main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify pinned controlled SQL offline
        run: npm run db:ai-tier-stripe-ledger:check

      - name: Prepare private database password file
        env:
          FANMIND_STAGING_DB_PASSWORD: ${{ secrets.FANMIND_STAGING_DB_PASSWORD }}
          PGPASSFILE: ${{ runner.temp }}/fanmind-ai-tier-stripe-ledger.pgpass
        run: |
          set -euo pipefail
          umask 077
          case "$FANMIND_STAGING_DB_PASSWORD" in
            *$'\n'*|*$'\r'*)
              echo "Staging database password contains an unsupported line break." >&2
              exit 1
              ;;
          esac
          ESCAPED_DB_PASSWORD="${FANMIND_STAGING_DB_PASSWORD//\\/\\\\}"
          ESCAPED_DB_PASSWORD="${ESCAPED_DB_PASSWORD//:/\\:}"
          printf '%s:%s:%s:%s:%s\n' \
            "$PGHOST" \
            "$PGPORT" \
            "$PGDATABASE" \
            "$PGUSER" \
            "$ESCAPED_DB_PASSWORD" > "$PGPASSFILE"
          chmod 600 "$PGPASSFILE"

      - name: Bind shared read-only rollout state
        env:
          PGPASSFILE: ${{ runner.temp }}/fanmind-ai-tier-stripe-ledger.pgpass
          FANMIND_ENABLE_NON_PRODUCTION_WRITES: 'false'
          FANMIND_NON_PRODUCTION_WRITE_ACK: ''
          FANMIND_STAGING_DATABASE_ROLLOUT_REVIEWED_COMMIT: ${{ inputs.reviewed_commit }}
          FANMIND_STAGING_DATABASE_ROLLOUT_STATE_CONFIRM: verify-staging-database-rollout-state
        run: |
          set -euo pipefail
          ROLLOUT_STATE="$(npm run --silent db:staging-rollout-state:run)"
          printf '%s\n' "$ROLLOUT_STATE"
          grep -Fqx 'STAGING_DATABASE_ROLLOUT_AI_TIER_STRIPE_LEDGER=apply' \
            <<< "$ROLLOUT_STATE"
          grep -Fqx 'STAGING_DATABASE_ROLLOUT_STATE=PASS' <<< "$ROLLOUT_STATE"

      - name: Apply controlled SQL and verify metadata
        env:
          PGPASSFILE: ${{ runner.temp }}/fanmind-ai-tier-stripe-ledger.pgpass
        run: npm run db:ai-tier-stripe-ledger:apply

      - name: Remove private database password file
        if: ${{ always() }}
        env:
          PGPASSFILE: ${{ runner.temp }}/fanmind-ai-tier-stripe-ledger.pgpass
        run: rm -f "$PGPASSFILE"
