name: FanMind Website Chat Retention Staging

on:
  schedule:
    - cron: '23 2 * * *'
    - cron: '23 */6 * * *'
  workflow_dispatch:
    inputs:
      component:
        description: 'Existing Website retention or separately authorized Support rollout'
        type: choice
        default: website
        options: [website, support]
      owner_uuid:
        description: 'Only for a separately approved explicit platform Owner binding'
        required: false
        type: string
      reviewed_commit:
        description: 'Exact reviewed main commit containing the pinned Website Chat retention contract'
        required: true
        type: string
      action:
        description: 'Read-only verification or separately approved Staging apply'
        required: true
        type: choice
        options:
          - verify
          - apply
          - retention
          - monitor
          - owner
          - rollback-empty
      confirmation:
        description: 'Type the exact confirmation shown in the runbook'
        required: true
        type: string

concurrency:
  group: fanmind-website-chat-staging-write
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify-retention-schema:
    name: Verify Website Chat retention only on isolated Staging
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' &&
        (inputs.component == 'website' || inputs.component == '') &&
        github.ref == 'refs/heads/main' &&
        inputs.reviewed_commit == github.sha &&
        inputs.action == 'verify' &&
        inputs.confirmation == 'verify-website-chat-retention-schema'
      }}
    runs-on: ubuntu-24.04
    environment: staging
    env:
      FANMIND_RUNTIME_ENVIRONMENT: staging
      NEXT_PUBLIC_APP_URL: ${{ vars.FANMIND_STAGING_APP_URL }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.FANMIND_STAGING_SUPABASE_URL }}
      FANMIND_TARGET_API_ORIGIN: ${{ vars.FANMIND_STAGING_APP_URL }}
      FANMIND_PRODUCTION_API_ORIGIN: https://fanmind.ch
      FANMIND_TARGET_SUPABASE_PROJECT_REF: ${{ vars.FANMIND_STAGING_SUPABASE_PROJECT_REF }}
      FANMIND_PRODUCTION_SUPABASE_PROJECT_REF: ${{ vars.FANMIND_PRODUCTION_SUPABASE_PROJECT_REF }}
      FANMIND_ENABLE_NON_PRODUCTION_WRITES: 'false'
      FANMIND_NON_PRODUCTION_WRITE_ACK: ''
      FANMIND_WEBSITE_CHAT_RETENTION_REVIEWED_COMMIT: ${{ inputs.reviewed_commit }}
      FANMIND_WEBSITE_CHAT_RETENTION_SCHEMA_CONFIRM: verify-website-chat-retention-schema
      PGHOST: ${{ secrets.FANMIND_STAGING_DB_HOST }}
      FANMIND_TARGET_DB_HOST: ${{ secrets.FANMIND_STAGING_DB_HOST }}
      FANMIND_PRODUCTION_DB_HOST: ${{ format('db.{0}.supabase.co', vars.FANMIND_PRODUCTION_SUPABASE_PROJECT_REF) }}
      PGPORT: ${{ vars.FANMIND_STAGING_DB_PORT }}
      PGDATABASE: ${{ vars.FANMIND_STAGING_DB_NAME }}
      PGUSER: ${{ secrets.FANMIND_STAGING_DB_USER }}
      PGSSLMODE: verify-full
    steps:
      - name: Checkout reviewed main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Verify pinned retention SQL offline
        run: npm run db:website-chat-retention:check
      - name: Prepare dedicated private database password file
        env:
          FANMIND_STAGING_DB_PASSWORD: ${{ secrets.FANMIND_STAGING_DB_PASSWORD }}
          PGPASSFILE: ${{ runner.temp }}/fanmind-website-chat-retention.pgpass
        run: |
          set -euo pipefail
          umask 077
          case "$FANMIND_STAGING_DB_PASSWORD" in
            *$'\n'*|*$'\r'*) exit 1 ;;
          esac
          ESCAPED_DB_PASSWORD="${FANMIND_STAGING_DB_PASSWORD//\\/\\\\}"
          ESCAPED_DB_PASSWORD="${ESCAPED_DB_PASSWORD//:/\\:}"
          printf '%s:%s:%s:%s:%s\n' "$PGHOST" "$PGPORT" "$PGDATABASE" "$PGUSER" "$ESCAPED_DB_PASSWORD" > "$PGPASSFILE"
          chmod 600 "$PGPASSFILE"
      - name: Verify retention service-role-only schema
        env:
          PGPASSFILE: ${{ runner.temp }}/fanmind-website-chat-retention.pgpass
        run: npm run db:website-chat-retention:verify
      - name: Remove dedicated private database password file
        if: ${{ always() }}
        env:
          PGPASSFILE: ${{ runner.temp }}/fanmind-website-chat-retention.pgpass
        run: rm -f "$PGPASSFILE"

  apply-retention-schema:
    name: Apply pinned Website Chat retention only to isolated Staging
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' &&
        (inputs.component == 'website' || inputs.component == '') &&
        github.ref == 'refs/heads/main' &&
        inputs.reviewed_commit == github.sha &&
        inputs.action == 'apply' &&
        inputs.confirmation == 'apply-website-chat-retention-migration'
      }}
    runs-on: ubuntu-24.04
    environment: staging
    env:
      FANMIND_RUNTIME_ENVIRONMENT: staging
      NEXT_PUBLIC_APP_URL: ${{ vars.FANMIND_STAGING_APP_URL }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.FANMIND_STAGING_SUPABASE_URL }}
      FANMIND_TARGET_API_ORIGIN: ${{ vars.FANMIND_STAGING_APP_URL }}
      FANMIND_PRODUCTION_API_ORIGIN: https://fanmind.ch
      FANMIND_TARGET_SUPABASE_PROJECT_REF: ${{ vars.FANMIND_STAGING_SUPABASE_PROJECT_REF }}
      FANMIND_PRODUCTION_SUPABASE_PROJECT_REF: ${{ vars.FANMIND_PRODUCTION_SUPABASE_PROJECT_REF }}
      FANMIND_ENABLE_NON_PRODUCTION_WRITES: 'true'
      FANMIND_NON_PRODUCTION_WRITE_ACK: I_UNDERSTAND_NON_PRODUCTION_ONLY
      FANMIND_WEBSITE_CHAT_RETENTION_REVIEWED_COMMIT: ${{ inputs.reviewed_commit }}
      FANMIND_WEBSITE_CHAT_RETENTION_MIGRATION_CONFIRM: apply-website-chat-retention-migration
      PGHOST: ${{ secrets.FANMIND_STAGING_DB_HOST }}
      FANMIND_TARGET_DB_HOST: ${{ secrets.FANMIND_STAGING_DB_HOST }}
      FANMIND_PRODUCTION_DB_HOST: ${{ format('db.{0}.supabase.co', vars.FANMIND_PRODUCTION_SUPABASE_PROJECT_REF) }}
      PGPORT: ${{ vars.FANMIND_STAGING_DB_PORT }}
      PGDATABASE: ${{ vars.FANMIND_STAGING_DB_NAME }}
      PGUSER: ${{ secrets.FANMIND_STAGING_DB_USER }}
      PGSSLMODE: verify-full
    steps:
      - name: Checkout reviewed main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Verify pinned retention SQL offline
        run: npm run db:website-chat-retention:check
      - name: Prepare dedicated private database password file
        env:
          FANMIND_STAGING_DB_PASSWORD: ${{ secrets.FANMIND_STAGING_DB_PASSWORD }}
          PGPASSFILE: ${{ runner.temp }}/fanmind-website-chat-retention.pgpass
        run: |
          set -euo pipefail
          umask 077
          case "$FANMIND_STAGING_DB_PASSWORD" in
            *$'\n'*|*$'\r'*) exit 1 ;;
          esac
          ESCAPED_DB_PASSWORD="${FANMIND_STAGING_DB_PASSWORD//\\/\\\\}"
          ESCAPED_DB_PASSWORD="${ESCAPED_DB_PASSWORD//:/\\:}"
          printf '%s:%s:%s:%s:%s\n' "$PGHOST" "$PGPORT" "$PGDATABASE" "$PGUSER" "$ESCAPED_DB_PASSWORD" > "$PGPASSFILE"
          chmod 600 "$PGPASSFILE"
      - name: Apply pinned retention and verify service-role-only schema
        env:
          PGPASSFILE: ${{ runner.temp }}/fanmind-website-chat-retention.pgpass
        run: npm run db:website-chat-retention:apply
      - name: Remove dedicated private database password file
        if: ${{ always() }}
        env:
          PGPASSFILE: ${{ runner.temp }}/fanmind-website-chat-retention.pgpass
        run: rm -f "$PGPASSFILE"

  support-staging-control:
    name: Controlled Support schema and retention on existing Staging
    if: >-
      ${{ github.ref == 'refs/heads/main' &&
          (github.event_name == 'workflow_dispatch' && inputs.component == 'support' ||
           github.event_name == 'schedule' && vars.FANMIND_SUPPORT_RETENTION_SCHEDULE_ENABLED == 'true') }}
    runs-on: ubuntu-24.04
    environment: staging
    env:
      FANMIND_RUNTIME_ENVIRONMENT: staging
      NEXT_PUBLIC_APP_URL: ${{ vars.FANMIND_STAGING_APP_URL }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.FANMIND_STAGING_SUPABASE_URL }}
      FANMIND_TARGET_API_ORIGIN: ${{ vars.FANMIND_STAGING_APP_URL }}
      FANMIND_PRODUCTION_API_ORIGIN: https://fanmind.ch
      FANMIND_TARGET_SUPABASE_PROJECT_REF: ${{ vars.FANMIND_STAGING_SUPABASE_PROJECT_REF }}
      FANMIND_PRODUCTION_SUPABASE_PROJECT_REF: ${{ vars.FANMIND_PRODUCTION_SUPABASE_PROJECT_REF }}
      FANMIND_ENABLE_NON_PRODUCTION_WRITES: ${{ (github.event_name == 'schedule' && github.event.schedule == '23 2 * * *' || github.event_name != 'schedule' && inputs.action != 'verify' && inputs.action != 'monitor') && 'true' || 'false' }}
      FANMIND_NON_PRODUCTION_WRITE_ACK: ${{ (github.event_name == 'schedule' && github.event.schedule == '23 2 * * *' || github.event_name != 'schedule' && inputs.action != 'verify' && inputs.action != 'monitor') && 'I_UNDERSTAND_NON_PRODUCTION_ONLY' || '' }}
      PGHOST: ${{ secrets.FANMIND_STAGING_DB_HOST }}
      FANMIND_TARGET_DB_HOST: ${{ secrets.FANMIND_STAGING_DB_HOST }}
      FANMIND_PRODUCTION_DB_HOST: ${{ format('db.{0}.supabase.co', vars.FANMIND_PRODUCTION_SUPABASE_PROJECT_REF) }}
      PGPORT: ${{ vars.FANMIND_STAGING_DB_PORT }}
      PGDATABASE: ${{ vars.FANMIND_STAGING_DB_NAME }}
      PGUSER: ${{ secrets.FANMIND_STAGING_DB_USER }}
      PGSSLMODE: verify-full
      PGSSLROOTCERT: ${{ github.workspace }}/config/certificates/supabase-root-2021-ca.crt
      FANMIND_SUPPORT_ADMIN_EMAILS: ${{ vars.FANMIND_STAGING_ADMIN_EMAILS }}
      FANMIND_SUPPORT_REVIEWED_COMMIT: ${{ github.event_name == 'schedule' && vars.FANMIND_SUPPORT_RETENTION_SOURCE_COMMIT || inputs.reviewed_commit }}
      FANMIND_SUPPORT_CONFIRM: ${{ github.event_name == 'schedule' && (github.event.schedule == '23 2 * * *' && 'run-support-retention' || 'verify-support-retention') || inputs.confirmation }}
      FANMIND_SUPPORT_RETENTION_SCHEDULE_ENABLED: ${{ vars.FANMIND_SUPPORT_RETENTION_SCHEDULE_ENABLED }}
      FANMIND_SUPPORT_RETENTION_RETRY: ${{ github.run_attempt > 1 && 'true' || 'false' }}
      FANMIND_SUPPORT_OWNER_UUID: ${{ inputs.owner_uuid }}
      SUPPORT_ACTION: ${{ github.event_name == 'schedule' && (github.event.schedule == '23 2 * * *' && 'retention' || 'monitor') || inputs.action }}
    steps:
      - name: Checkout explicitly reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.FANMIND_SUPPORT_REVIEWED_COMMIT }}
          fetch-depth: 0
      - name: Verify approved source belongs to protected main history
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$FANMIND_SUPPORT_REVIEWED_COMMIT"
          git merge-base --is-ancestor "$FANMIND_SUPPORT_REVIEWED_COMMIT" origin/main
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Check full pinned Support schema and independent reference offline
        run: node scripts/operations/support-centre-staging.mjs --check
      - name: Prepare dedicated private database password file
        env:
          FANMIND_STAGING_DB_PASSWORD: ${{ secrets.FANMIND_STAGING_DB_PASSWORD }}
          PGPASSFILE: ${{ runner.temp }}/fanmind-support-staging.pgpass
        run: |
          set -euo pipefail
          umask 077
          case "$FANMIND_STAGING_DB_PASSWORD" in
            *$'\n'*|*$'\r'*) exit 1 ;;
          esac
          ESCAPED_DB_PASSWORD="${FANMIND_STAGING_DB_PASSWORD//\\/\\\\}"
          ESCAPED_DB_PASSWORD="${ESCAPED_DB_PASSWORD//:/\\:}"
          printf '%s:%s:%s:%s:%s\n' "$PGHOST" "$PGPORT" "$PGDATABASE" "$PGUSER" "$ESCAPED_DB_PASSWORD" > "$PGPASSFILE"
          chmod 600 "$PGPASSFILE"
      - name: Execute only the explicitly selected Support action
        env:
          PGPASSFILE: ${{ runner.temp }}/fanmind-support-staging.pgpass
        run: node scripts/operations/support-centre-staging.mjs "--$SUPPORT_ACTION"
      - name: Remove dedicated private database password file
        if: ${{ always() }}
        env:
          PGPASSFILE: ${{ runner.temp }}/fanmind-support-staging.pgpass
        run: rm -f "$PGPASSFILE"
