name: FanMind Orchestrator Builder Dispatch
run-name: Orchestrator handoff ${{ inputs.handoff_id }} task ${{ inputs.task_id }} digest ${{ inputs.payload_sha256 }}

on:
  workflow_dispatch:
    inputs:
      handoff_id:
        description: "Exact handoff identity emitted by preparation"
        required: true
        type: string
      task_id:
        description: "Exact task_id emitted by preparation"
        required: true
        type: string
      previous_task_id:
        description: "Authoritative previous handoff task_id, never inferred from the receipt"
        required: true
        type: string
      payload_sha256:
        description: "SHA-256 emitted by preparation"
        required: true
        type: string
      handoff_base64:
        description: "Exact single prepared task envelope, base64 encoded"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: fanmind-orchestrator-builder-lifecycle
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout fresh main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1

      - name: Materialize the exact prepared envelope
        env:
          HANDOFF_BASE64: ${{ inputs.handoff_base64 }}
        run: |
          set -euo pipefail
          printf '%s' "${HANDOFF_BASE64}" | base64 --decode > "${RUNNER_TEMP}/fanmind-handoff.json"
          test -s "${RUNNER_TEMP}/fanmind-handoff.json"

      - name: Admit prepared handoff
        env:
          REQUESTED_HANDOFF_ID: ${{ inputs.handoff_id }}
          REQUESTED_TASK_ID: ${{ inputs.task_id }}
          REQUESTED_PREVIOUS_TASK_ID: ${{ inputs.previous_task_id }}
          REQUESTED_PAYLOAD_SHA256: ${{ inputs.payload_sha256 }}
        run: |
          set -euo pipefail
          python3 scripts/fanmind_orchestrator_admission.py admit \
            --handoff "${RUNNER_TEMP}/fanmind-handoff.json" \
            --handoff-id "${REQUESTED_HANDOFF_ID}" \
            --task-id "${REQUESTED_TASK_ID}" \
            --previous-task-id "${REQUESTED_PREVIOUS_TASK_ID}" \
            --payload-sha256 "${REQUESTED_PAYLOAD_SHA256}" \
            --repository "${GITHUB_REPOSITORY}" \
            --current-run-id "${GITHUB_RUN_ID}" \
            --output "${RUNNER_TEMP}/fanmind-builder-input.txt"

      - name: Transport exactly one admitted handoff
        env:
          AGENT_ACCESS_TOKEN: ${{ secrets.CHATGPT_WORKSPACE_AGENT_ACCESS_TOKEN }}
          AGENT_TRIGGER_ID: ${{ vars.CHATGPT_FANMIND_MANAGER_TRIGGER_ID }}
        run: |
          set -euo pipefail
          if [[ -z "${AGENT_ACCESS_TOKEN}" || -z "${AGENT_TRIGGER_ID}" ]]; then
            echo "::error title=FanMind Builder dispatch unavailable::Required Workspace Agent trigger configuration is missing."
            exit 1
          fi
          if [[ ! "${AGENT_TRIGGER_ID}" =~ ^agtch_[A-Za-z0-9_-]+$ ]]; then
            echo "::error title=Invalid Workspace Agent trigger id::CHATGPT_FANMIND_MANAGER_TRIGGER_ID must start with agtch_."
            exit 1
          fi
          python3 scripts/fanmind_orchestrator_admission.py transport \
            --input "${RUNNER_TEMP}/fanmind-builder-input.txt" \
            --agent-trigger-id "${AGENT_TRIGGER_ID}" \
            --agent-token "${AGENT_ACCESS_TOKEN}"

      - name: Hold lifecycle concurrency until canonical terminal closeout
        run: |
          set -euo pipefail
          python3 scripts/fanmind_orchestrator_admission.py await-closeout \
            --handoff "${RUNNER_TEMP}/fanmind-handoff.json" \
            --repository "${GITHUB_REPOSITORY}" \
            --current-run-id "${GITHUB_RUN_ID}" \
            --timeout-seconds 21000 \
            --poll-seconds 600
