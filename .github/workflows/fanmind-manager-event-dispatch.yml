name: FanMind Orchestrator Builder Dispatch

on:
  workflow_dispatch:
    inputs:
      task:
        description: "One concrete bounded task selected by FanMind Orchestrator"
        required: true
        type: string
      task_id:
        description: "Unique orchestrator correlation id"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: fanmind-orchestrator-builder-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate Workspace Agent trigger configuration
        id: config
        shell: bash
        env:
          AGENT_ACCESS_TOKEN: ${{ secrets.CHATGPT_WORKSPACE_AGENT_ACCESS_TOKEN }}
          AGENT_TRIGGER_ID: ${{ vars.CHATGPT_FANMIND_MANAGER_TRIGGER_ID }}
          REQUESTED_TASK: ${{ inputs.task }}
          REQUESTED_TASK_ID: ${{ inputs.task_id }}
        run: |
          set -euo pipefail
          if [[ -z "${AGENT_ACCESS_TOKEN}" || -z "${AGENT_TRIGGER_ID}" ]]; then
            echo "::error title=FanMind Builder dispatch unavailable::Required Workspace Agent trigger configuration is missing."
            exit 1
          fi
          if [[ ! "${AGENT_TRIGGER_ID}" =~ ^agtch_[A-Za-z0-9_-]+$ ]]; then
            echo "::error title=Invalid Workspace Agent trigger id::CHATGPT_FANMIND_MANAGER_TRIGGER_ID must start with agtch_."
            exit 1
          fi
          if [[ -z "${REQUESTED_TASK}" || -z "${REQUESTED_TASK_ID}" ]]; then
            echo "::error title=Invalid orchestrator task::Both task and task_id are mandatory."
            exit 1
          fi

      - name: Build bounded Builder payload
        id: payload
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          CURRENT_SHA: ${{ github.sha }}
          REQUESTED_TASK: ${{ inputs.task }}
          REQUESTED_TASK_ID: ${{ inputs.task_id }}
        run: |
          set -euo pipefail
          input="FanMind Orchestrator assigned exactly one bounded task. Repository=${REPOSITORY}; current_workflow_sha=${CURRENT_SHA}; task_id=${REQUESTED_TASK_ID}. TASK: ${REQUESTED_TASK}. The Orchestrator is the sole authority for selecting the next independent FanMind task. Before executing this task, reconcile the previously dispatched task against current GitHub truth and project-memory/ORCHESTRATOR_RESULT.json. If the prior task is unresolved, its receipt is missing/stale, or its task_id/result contradicts verified GitHub evidence, do not begin a new independent task: repair/publish that reconciliation first and return it as the bounded result. Perform the mandatory risk-adaptive FanMind preflight for this task only. You may diagnose and repair blockers only when they are inside this same bounded task. Do not select, start, continue, or substitute another independent roadmap task. If this task reaches a protected boundary or cannot safely continue, stop this task as BLOCKED with the exact blocker and resume condition; do not choose replacement work. Do not overengineer or reopen completed work without new evidence. MANDATORY RETURN: publish one terminal result for exactly task_id=${REQUESTED_TASK_ID} according to project-memory/ORCHESTRATOR_RESULT_PROTOCOL.md. Trigger acceptance is not completion."
          jq -n --arg input "${input}" '{input:$input}' > payload.json
          echo "task_id=${REQUESTED_TASK_ID}" >> "${GITHUB_OUTPUT}"

      - name: Trigger FanMind Builder
        shell: bash
        env:
          AGENT_ACCESS_TOKEN: ${{ secrets.CHATGPT_WORKSPACE_AGENT_ACCESS_TOKEN }}
          AGENT_TRIGGER_ID: ${{ vars.CHATGPT_FANMIND_MANAGER_TRIGGER_ID }}
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          status="$(curl --silent --show-error --output "${response_file}" --write-out '%{http_code}' --request POST "https://api.chatgpt.com/v1/workspace_agents/${AGENT_TRIGGER_ID}/trigger" --header "Authorization: Bearer ${AGENT_ACCESS_TOKEN}" --header "Content-Type: application/json" --data-binary @payload.json)"
          if [[ "${status}" -lt 200 || "${status}" -ge 300 ]]; then
            echo "::error title=FanMind Builder dispatch rejected::Workspace Agent API returned HTTP ${status}."
            echo "### FanMind Builder API diagnostic" >> "${GITHUB_STEP_SUMMARY}"
            echo "- HTTP status: \`${status}\`" >> "${GITHUB_STEP_SUMMARY}"
            echo "- Task ID: \`${{ steps.payload.outputs.task_id }}\`" >> "${GITHUB_STEP_SUMMARY}"
            echo "- Response body:" >> "${GITHUB_STEP_SUMMARY}"
            echo '~~~' >> "${GITHUB_STEP_SUMMARY}"
            head -c 2000 "${response_file}" >> "${GITHUB_STEP_SUMMARY}"
            echo >> "${GITHUB_STEP_SUMMARY}"
            echo '~~~' >> "${GITHUB_STEP_SUMMARY}"
            rm -f "${response_file}" payload.json
            exit 1
          fi
          conversation_url="$(jq -r '.conversation_url // empty' "${response_file}")"
          trigger_run_id="$(jq -r '.agent_trigger_run_id // empty' "${response_file}")"
          echo "### FanMind Orchestrator -> Builder Dispatch" >> "${GITHUB_STEP_SUMMARY}"
          echo "- API trigger accepted: HTTP ${status}" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Task ID: \`${{ steps.payload.outputs.task_id }}\`" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Acceptance is not completion; completion requires the matching result receipt on current main." >> "${GITHUB_STEP_SUMMARY}"
          if [[ -n "${trigger_run_id}" ]]; then echo "- Trigger run: \`${trigger_run_id}\`" >> "${GITHUB_STEP_SUMMARY}"; fi
          if [[ -n "${conversation_url}" ]]; then echo "- Workspace Agent conversation: ${conversation_url}" >> "${GITHUB_STEP_SUMMARY}"; fi
          rm -f "${response_file}" payload.json
