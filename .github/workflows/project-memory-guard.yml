name: Project Memory Guard

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  project-memory-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate project-memory structure
        shell: bash
        run: |
          set -euo pipefail
          required=(
            project-memory/PROTOCOL.md
            project-memory/CURRENT_STATE.md
            project-memory/TASK_LEDGER.md
            project-memory/CHANGE_REQUESTS.md
            project-memory/DECISIONS.md
            project-memory/FAILED_ATTEMPTS.md
          )
          for file in "${required[@]}"; do
            test -s "$file" || { echo "Missing or empty required project-memory file: $file"; exit 1; }
          done

      - name: Require memory update for meaningful PR changes
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # NUL-delimited paths, including both sides of renames (no rename detection).
          # Routine presentation work uses its PR and Git history. Changes to protected
          # disclosures, consent, billing and other unclassified paths retain memory review.
          changed_file="$(mktemp)"
          trap 'rm -f "$changed_file"' EXIT
          git diff --no-renames --name-only -z "$BASE_SHA...$HEAD_SHA" > "$changed_file"
          meaningful=0
          memory_changed=0
          while IFS= read -r -d '' file; do
            printf '%q\n' "$file"
            case "$file" in
              project-memory/*) memory_changed=1 ;;
              docs/operations/FANMIND_WORKSPACE_BUILDER.md) ;;
              src/components/landing/ProductShowcaseSection.tsx|src/components/landing/ProductShowcaseSection.module.css) ;;
              src/components/FanMindLogo.tsx|src/components/FanMindLogo.module.css|src/components/PlatformLogo.tsx|src/components/PlatformLogo.module.css|src/components/FanMindFunctionIcon.tsx) ;;
              src/app/page.module.css|src/app/landing-header-visibility.css|src/app/landing-v2-six-steps-refine.css) ;;
              src/components/WorkspaceSidebar.module.css|src/components/WorkspaceSidebarResponsive.module.css) ;;
              src/lib/inboxMetricFormatting.mjs|src/lib/inboxMetricFormatting.d.mts) ;;
              tests/channels-scroll-layout.test.mjs|tests/chat-admin-crm-layout.test.mjs|tests/workspace-sidebar-icons.test.mjs) ;;
              tests/landing-v2-cross-browser-layout.test.mjs|tests/fan-detail-layout-policy.test.mjs) ;;
              *) meaningful=1 ;;
            esac
          done < "$changed_file"

          if [[ "$meaningful" -eq 1 && "$memory_changed" -ne 1 ]]; then
            echo "Meaningful repository changes require a project-memory update."
            echo "Record the durable change once; routine presentation edits need no duplicate memory entry."
            exit 1
          fi

      - name: Detect duplicate primary memory IDs
        shell: bash
        run: |
          set -euo pipefail
          ids="$(grep -hE '^## [A-Z][A-Z0-9-]+$' project-memory/{TASK_LEDGER,CHANGE_REQUESTS,DECISIONS,FAILED_ATTEMPTS}.md | sed 's/^## //' || true)"
          duplicates="$(printf '%s\n' "$ids" | sed '/^$/d' | sort | uniq -d)"
          if [[ -n "$duplicates" ]]; then
            echo "Duplicate project-memory IDs detected:"
            printf '%s\n' "$duplicates"
            exit 1
          fi
