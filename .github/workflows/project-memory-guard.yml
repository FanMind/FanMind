name: Project Memory Guard

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  project-memory-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate project-memory structure
        shell: bash
        run: |
          set -euo pipefail
          required=(
            project-memory/PROTOCOL.md
            project-memory/CURRENT_STATE.md
            project-memory/TASK_LEDGER.md
            project-memory/CHANGE_REQUESTS.md
            project-memory/DECISIONS.md
            project-memory/FAILED_ATTEMPTS.md
          )
          for file in "${required[@]}"; do
            test -s "$file" || { echo "Missing or empty required project-memory file: $file"; exit 1; }
          done

      - name: Require memory update for meaningful PR changes
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          changed="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          printf '%s\n' "$changed"

          meaningful=0
          memory_changed=0
          while IFS= read -r file; do
            test -n "$file" || continue
            case "$file" in
              project-memory/*) memory_changed=1 ;;
              .github/workflows/project-memory-guard.yml) ;;
              *) meaningful=1 ;;
            esac
          done <<< "$changed"

          if [[ "$meaningful" -eq 1 && "$memory_changed" -ne 1 ]]; then
            echo "Meaningful repository changes require a project-memory update."
            echo "Run the mandatory preflight and record the resulting task/state/decision/failed-attempt/change-request update."
            exit 1
          fi

      - name: Detect duplicate primary memory IDs
        shell: bash
        run: |
          set -euo pipefail
          ids="$(grep -hE '^## [A-Z][A-Z0-9-]+$' project-memory/{TASK_LEDGER,CHANGE_REQUESTS,DECISIONS,FAILED_ATTEMPTS}.md | sed 's/^## //' || true)"
          duplicates="$(printf '%s\n' "$ids" | sed '/^$/d' | sort | uniq -d)"
          if [[ -n "$duplicates" ]]; then
            echo "Duplicate project-memory IDs detected:"
            printf '%s\n' "$duplicates"
            exit 1
          fi
