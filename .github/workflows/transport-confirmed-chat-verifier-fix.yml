name: Transport exact confirmed-chat verifier fixes

on:
  push:
    branches:
      - feat/creator-confirmed-chat-rollout-runner-20260923
    paths:
      - .github/workflows/transport-confirmed-chat-verifier-fix.yml

permissions:
  contents: write

jobs:
  transport:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/creator-confirmed-chat-rollout-runner-20260923
          fetch-depth: 0
          persist-credentials: true
      - name: Verify exact transport ancestry
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD~2)" = "bc4564daf941d5cc5094e1b268e3591f374686a6"
          test "$(git hash-object scripts/operations/creator-confirmed-chat-learning-migration-runner.mjs)" = "2b0e014a428f1c938aa69cc66850377028df3a0d"
      - name: Apply exact tested transformations
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one old block, found {count}")
              return text.replace(old, new, 1)

          runner_path = Path("scripts/operations/creator-confirmed-chat-learning-migration-runner.mjs")
          runner = runner_path.read_text()

          runner = replace_once(runner, '''const WORKSPACE_BOUNDARY_REPO_PATH =
            "supabase/controlled/20260816120000_workspace_member_data_boundary.sql";
          const CREATOR_ACCESS_REPO_PATH = "supabase/controlled/creator_revision_conflict_fix.sql";
          const REVIEWED_CONTROL_REPO_PATHS = Object.freeze([
            RUNNER_REPO_PATH,
            MIGRATION_REPO_PATH,
            ROLLOUT_STATE_REPO_PATH,
            WORKSPACE_BOUNDARY_REPO_PATH,
            CREATOR_ACCESS_REPO_PATH,
          ]);
          const EXPECTED_MIGRATION_GIT_BLOB_SHA1 = "b09a22643d5076e68cfe7816980e88d0d00272f7";
          const EXPECTED_WORKSPACE_BOUNDARY_GIT_BLOB_SHA1 = "07286a4793204a1f3d82c18fca18728b1380d6fa";
          const EXPECTED_CREATOR_ACCESS_GIT_BLOB_SHA1 = "c2132db39e141131483afc44d045d21d632b1672";''', '''const WORKSPACE_BOUNDARY_REPO_PATH =
            "supabase/controlled/20260816120000_workspace_member_data_boundary.sql";
          const CREATOR_ACCESS_REPO_PATH = "supabase/controlled/creator_revision_conflict_fix.sql";
          const WHATSAPP_INBOUND_REPO_PATH =
            "supabase/controlled/20260817230000_whatsapp_cloud_inbound_foundation.sql";
          const REVIEWED_CONTROL_REPO_PATHS = Object.freeze([
            RUNNER_REPO_PATH,
            MIGRATION_REPO_PATH,
            ROLLOUT_STATE_REPO_PATH,
            WORKSPACE_BOUNDARY_REPO_PATH,
            CREATOR_ACCESS_REPO_PATH,
            WHATSAPP_INBOUND_REPO_PATH,
          ]);
          const EXPECTED_MIGRATION_GIT_BLOB_SHA1 = "b09a22643d5076e68cfe7816980e88d0d00272f7";
          const EXPECTED_WORKSPACE_BOUNDARY_GIT_BLOB_SHA1 = "07286a4793204a1f3d82c18fca18728b1380d6fa";
          const EXPECTED_CREATOR_ACCESS_GIT_BLOB_SHA1 = "c2132db39e141131483afc44d045d21d632b1672";
          const EXPECTED_WHATSAPP_INBOUND_GIT_BLOB_SHA1 = "2aac4ab447eaf34685aa7fcff3b78be41332c22b";''', "constants")

          runner = replace_once(runner, '''  const creatorAccess = readPinnedSource(
            CREATOR_ACCESS_REPO_PATH,
            EXPECTED_CREATOR_ACCESS_GIT_BLOB_SHA1,
            "creator_access_contract_unreadable",
            "creator_access_contract_checksum_mismatch",
          );
          for (const contract of FOUNDATION_FUNCTION_CONTRACTS) {
            functionBody(contract.source === "creatorAccess" ? creatorAccess : workspaceBoundary, contract.name);
          }
          return { workspaceBoundary, creatorAccess };
          }''', '''  const creatorAccess = readPinnedSource(
            CREATOR_ACCESS_REPO_PATH,
            EXPECTED_CREATOR_ACCESS_GIT_BLOB_SHA1,
            "creator_access_contract_unreadable",
            "creator_access_contract_checksum_mismatch",
          );
          const whatsappInbound = readPinnedSource(
            WHATSAPP_INBOUND_REPO_PATH,
            EXPECTED_WHATSAPP_INBOUND_GIT_BLOB_SHA1,
            "whatsapp_inbound_contract_unreadable",
            "whatsapp_inbound_contract_checksum_mismatch",
          );
          for (const contract of FOUNDATION_FUNCTION_CONTRACTS) {
            functionBody(contract.source === "creatorAccess" ? creatorAccess : workspaceBoundary, contract.name);
          }
          functionBody(whatsappInbound, "protect_whatsapp_cloud_message_identity");
          return { workspaceBoundary, creatorAccess, whatsappInbound };
          }''', "foundation sources")

          runner = replace_once(runner, '''  const foundationChecks = FOUNDATION_FUNCTION_CONTRACTS.map((contract) => {''', '''  const whatsappIdentityBodyHash = functionBodyHash(
            foundationSources.whatsappInbound,
            "protect_whatsapp_cloud_message_identity",
          );

          const foundationChecks = FOUNDATION_FUNCTION_CONTRACTS.map((contract) => {''', "whatsapp body hash")

          runner = replace_once(runner, '''  function_execute_grantees text[];
            index_def text;''', '''  function_execute_grantees text[];
            table_acl_entries text[];
            index_def text;''', "acl declaration")

          runner = replace_once(runner, '''       and t.tgenabled <> 'D'
                 and t.tgname <> 'conversation_messages_stamp_creator_learning_manual_send'
                 and (t.tgtype & 1) = 1''', '''       and t.tgenabled <> 'D'
                 and t.tgname not in (
                   'conversation_messages_stamp_creator_learning_manual_send',
                   'conversation_messages_whatsapp_identity_immutable'
                 )
                 and (t.tgtype & 1) = 1''', "competing trigger allowlist")

          marker = '''  select pg_get_triggerdef(t.oid, true) into trigger_def
              from pg_trigger t
             where t.tgrelid = messages_table
               and t.tgname = 'conversation_messages_stamp_creator_learning_manual_send'\n'''
          whatsapp_block = '''  if exists (
            select 1 from pg_trigger
             where tgrelid = messages_table
               and tgname = 'conversation_messages_whatsapp_identity_immutable'
               and not tgisinternal
          ) then
            select pg_get_triggerdef(t.oid, true) into trigger_def
              from pg_trigger t
             where t.tgrelid = messages_table
               and t.tgname = 'conversation_messages_whatsapp_identity_immutable'
               and t.tgenabled = 'O'
               and not t.tgisinternal;
            trigger_def := regexp_replace(lower(coalesce(trigger_def, '')), '\\s+', '', 'g');
            if trigger_def <>
               'createtriggerconversation_messages_whatsapp_identity_immutablebeforeupdateonconversation_messagesforeachrowexecutefunctionprotect_whatsapp_cloud_message_identity()' then
              raise exception 'creator_learning_whatsapp_identity_trigger_invalid';
            end if;

            ${pgProcSelect("public.protect_whatsapp_cloud_message_identity()")}
            if ${learningFunctionMetadataCondition(
              {
                securityDefiner: true,
                resultType: "trigger",
              },
              whatsappIdentityBodyHash,
            ).replace(
              `array['search_path=""']::text[]`,
              "array['search_path=pg_catalog, public, pg_temp']::text[]",
            )} then
              raise exception 'creator_learning_whatsapp_identity_function_invalid';
            end if;
            select coalesce(
                     array_agg(grantee_name order by grantee_name),
                     array[]::text[]
                   )
              into function_execute_grantees
              from (
                select distinct
                       case when acl.grantee = 0 then 'PUBLIC' else grantee.rolname end as grantee_name
                  from pg_proc p
                  cross join lateral aclexplode(coalesce(p.proacl, acldefault('f', p.proowner))) acl
                  left join pg_roles grantee on grantee.oid = acl.grantee and acl.grantee <> 0
                 where p.oid = to_regprocedure('public.protect_whatsapp_cloud_message_identity()')
                   and acl.privilege_type = 'EXECUTE'
                   and acl.grantee <> p.proowner
              ) direct_execute;
            if function_execute_grantees is distinct from array['service_role']::text[]
               or exists (
                 select 1
                   from pg_proc p
                   cross join lateral aclexplode(coalesce(p.proacl, acldefault('f', p.proowner))) acl
                  where p.oid = to_regprocedure('public.protect_whatsapp_cloud_message_identity()')
                    and acl.privilege_type = 'EXECUTE'
                    and acl.grantee <> p.proowner
                    and acl.is_grantable
               ) then
              raise exception 'creator_learning_whatsapp_identity_function_acl_invalid';
            end if;
          end if;

'''
          if runner.count(marker) != 1:
              raise SystemExit(f"whatsapp insertion marker: expected 1, found {runner.count(marker)}")
          runner = runner.replace(marker, whatsapp_block + marker, 1)

          runner = replace_once(runner, '''  if not has_table_privilege('authenticated', learning_table, 'SELECT')
             or has_table_privilege('authenticated', learning_table, 'INSERT,UPDATE,DELETE,TRUNCATE,REFERENCES,TRIGGER')
             or has_table_privilege('anon', learning_table, 'SELECT,INSERT,UPDATE,DELETE,TRUNCATE,REFERENCES,TRIGGER')
             or not has_table_privilege('service_role', learning_table, 'SELECT')
             or not has_table_privilege('service_role', learning_table, 'INSERT')
             or not has_table_privilege('service_role', learning_table, 'UPDATE')
             or not has_table_privilege('service_role', learning_table, 'DELETE')
             or not has_table_privilege('service_role', learning_table, 'TRUNCATE')
             or not has_table_privilege('service_role', learning_table, 'REFERENCES')
             or not has_table_privilege('service_role', learning_table, 'TRIGGER') then
            raise exception 'creator_learning_table_privilege_invalid';
          end if;

''', '''  if not has_table_privilege('authenticated', learning_table, 'SELECT')
             or has_table_privilege('authenticated', learning_table, 'INSERT,UPDATE,DELETE,TRUNCATE,REFERENCES,TRIGGER,MAINTAIN')
             or has_table_privilege('anon', learning_table, 'SELECT,INSERT,UPDATE,DELETE,TRUNCATE,REFERENCES,TRIGGER,MAINTAIN')
             or not has_table_privilege('service_role', learning_table, 'SELECT')
             or not has_table_privilege('service_role', learning_table, 'INSERT')
             or not has_table_privilege('service_role', learning_table, 'UPDATE')
             or not has_table_privilege('service_role', learning_table, 'DELETE')
             or not has_table_privilege('service_role', learning_table, 'TRUNCATE')
             or not has_table_privilege('service_role', learning_table, 'REFERENCES')
             or not has_table_privilege('service_role', learning_table, 'TRIGGER')
             or not has_table_privilege('service_role', learning_table, 'MAINTAIN') then
            raise exception 'creator_learning_table_privilege_invalid';
          end if;

          select coalesce(
                   array_agg(
                     (case when acl.grantee = 0 then 'PUBLIC' else grantee.rolname end)
                     || ':' || acl.privilege_type
                     || ':' || acl.is_grantable::text
                     || ':' || grantor.rolname
                     order by
                       case when acl.grantee = 0 then 'PUBLIC' else grantee.rolname end,
                       acl.privilege_type
                   ),
                   array[]::text[]
                 )
            into table_acl_entries
            from pg_class c
            cross join lateral aclexplode(coalesce(c.relacl, acldefault('r', c.relowner))) acl
            left join pg_roles grantee on grantee.oid = acl.grantee and acl.grantee <> 0
            join pg_roles grantor on grantor.oid = acl.grantor
           where c.oid = learning_table
             and acl.grantee <> c.relowner;
          if table_acl_entries is distinct from array[
               'authenticated:SELECT:false:postgres',
               'service_role:DELETE:false:postgres',
               'service_role:INSERT:false:postgres',
               'service_role:MAINTAIN:false:postgres',
               'service_role:REFERENCES:false:postgres',
               'service_role:SELECT:false:postgres',
               'service_role:TRIGGER:false:postgres',
               'service_role:TRUNCATE:false:postgres',
               'service_role:UPDATE:false:postgres'
             ]::text[] then
            raise exception 'creator_learning_table_acl_invalid';
          end if;

''', "table ACL contract")

          runner_path.write_text(runner)

          old_review = Path("tests/creator-confirmed-chat-learning-verifier-review.test.mjs")
          new_review = Path("tests/creator-confirmed-chat-learning-verifier-review.cases.mjs")
          if not old_review.exists() or new_review.exists():
              raise SystemExit("review test rename precondition failed")
          review = old_review.read_text()
          review = replace_once(review, '''  assert.match(
            runner,
            /t\\.tgname <> 'conversation_messages_stamp_creator_learning_manual_send'/u,
          );''', '''  assert.match(runner, /t\\.tgname not in \\(/u);''', "review trigger assertion")
          review += '''\n\ntest("verifier requires the complete PostgreSQL 17 learning-table ACL", async () => {
            const runner = await runnerSource();
            assert.match(runner, /table_acl_entries text\\[\\]/u);
            assert.match(runner, /aclexplode\\(coalesce\\(c\\.relacl, acldefault\\('r', c\\.relowner\\)\\)\\)/u);
            assert.match(runner, /acl\\.grantee <> c\\.relowner/u);
            assert.match(runner, /acl\\.is_grantable::text/u);
            assert.match(runner, /grantor\\.rolname/u);
            assert.match(runner, /'authenticated:SELECT:false:postgres'/u);
            for (const privilege of [
              "DELETE",
              "INSERT",
              "MAINTAIN",
              "REFERENCES",
              "SELECT",
              "TRIGGER",
              "TRUNCATE",
              "UPDATE",
            ]) {
              assert.match(runner, new RegExp(`'service_role:${privilege}:false:postgres'`, "u"));
            }
            assert.match(runner, /creator_learning_table_acl_invalid/u);
          });

          test("verifier safely binds the optional canonical WhatsApp identity trigger", async () => {
            const runner = await runnerSource();
            assert.match(runner, /WHATSAPP_INBOUND_REPO_PATH/u);
            assert.match(
              runner,
              /EXPECTED_WHATSAPP_INBOUND_GIT_BLOB_SHA1 = "2aac4ab447eaf34685aa7fcff3b78be41332c22b"/u,
            );
            assert.match(runner, /functionBodyHash\\(\\s*foundationSources\\.whatsappInbound,\\s*"protect_whatsapp_cloud_message_identity"/u);
            assert.match(
              runner,
              /createtriggerconversation_messages_whatsapp_identity_immutablebeforeupdateonconversation_messagesforeachrowexecutefunctionprotect_whatsapp_cloud_message_identity\\(\\)/u,
            );
            assert.match(runner, /creator_learning_whatsapp_identity_trigger_invalid/u);
            assert.match(runner, /creator_learning_whatsapp_identity_function_invalid/u);
            assert.match(runner, /creator_learning_whatsapp_identity_function_acl_invalid/u);
            assert.match(runner, /array\\['service_role'\\]::text\\[\\]/u);
          });\n'''
          old_review.unlink()
          new_review.write_text(review)

          test_path = Path("tests/creator-confirmed-chat-learning.test.mjs")
          test_text = test_path.read_text()
          test_text = replace_once(test_text, 'import "./creator-confirmed-chat-learning.cases.mjs";\n', 'import "./creator-confirmed-chat-learning.cases.mjs";\nimport "./creator-confirmed-chat-learning-verifier-review.cases.mjs";\n', "test import")
          test_path.write_text(test_text)
          PY
      - name: Verify exact tested result
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git hash-object scripts/operations/creator-confirmed-chat-learning-migration-runner.mjs)" = "bcc1a8de7e9bf343389a95b78d11dba7371bd7d8"
          test "$(git hash-object tests/creator-confirmed-chat-learning-verifier-review.cases.mjs)" = "e099d8f1c941fc8cadf41784a23b31b5295a3d3e"
          test "$(git hash-object tests/creator-confirmed-chat-learning.test.mjs)" = "c0c278342dde0b4f042f373c7db12d90d3e1aba6"
          test ! -e tests/creator-confirmed-chat-learning-verifier-review.test.mjs
          node scripts/operations/creator-confirmed-chat-learning-migration-runner.mjs --check
          node --test tests/creator-confirmed-chat-learning.test.mjs
          node --test tests/test-suite-coverage.test.mjs
      - name: Commit exact transported fix and remove helper
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/transport-confirmed-chat-verifier-fix.yml
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Complete confirmed-chat verifier contracts"
          git push origin HEAD:feat/creator-confirmed-chat-rollout-runner-20260923
