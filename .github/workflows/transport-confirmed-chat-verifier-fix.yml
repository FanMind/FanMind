name: Transport exact confirmed-chat verifier fixes

on:
  push:
    branches:
      - feat/creator-confirmed-chat-rollout-runner-20260923
    paths:
      - .github/workflows/transport-confirmed-chat-verifier-fix.yml

permissions:
  contents: write
  pull-requests: read

jobs:
  transport:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/creator-confirmed-chat-rollout-runner-20260923
          fetch-depth: 0
          persist-credentials: true
      - name: Verify exact product base remains unchanged
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object scripts/operations/creator-confirmed-chat-learning-migration-runner.mjs)" = "2b0e014a428f1c938aa69cc66850377028df3a0d"
          test "$(git hash-object tests/creator-confirmed-chat-learning-verifier-review.test.mjs)" = "ad9499d38751625ae45aeb70d72b32ddaaca46eb"
          test "$(git hash-object tests/creator-confirmed-chat-learning.test.mjs)" = "0dfaa1d6abd7578d65ee2979c68e106999b6e05c"
      - name: Recover exact tested diff from PR evidence and apply
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/FanMind/FanMind/pulls/comments/4089823404 --jq .body > /tmp/review-body.txt
          awk '/^```diff$/{capture=1;next} /^```$/{if(capture) exit} capture{print}' /tmp/review-body.txt > /tmp/review.patch
          test -s /tmp/review.patch
          git apply --check /tmp/review.patch
          git apply /tmp/review.patch
          git diff --check
          test "$(git hash-object scripts/operations/creator-confirmed-chat-learning-migration-runner.mjs)" = "bcc1a8de7e9bf343389a95b78d11dba7371bd7d8"
          test "$(git hash-object tests/creator-confirmed-chat-learning-verifier-review.cases.mjs)" = "e099d8f1c941fc8cadf41784a23b31b5295a3d3e"
          test "$(git hash-object tests/creator-confirmed-chat-learning.test.mjs)" = "c0c278342dde0b4f042f373c7db12d90d3e1aba6"
          test ! -e tests/creator-confirmed-chat-learning-verifier-review.test.mjs
      - name: Run bounded verifier tests
        shell: bash
        run: |
          set -euo pipefail
          node scripts/operations/creator-confirmed-chat-learning-migration-runner.mjs --check
          node --test tests/creator-confirmed-chat-learning.test.mjs
          node --test tests/test-suite-coverage.test.mjs
      - name: Commit exact transported fix and remove transport helper
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/transport-confirmed-chat-verifier-fix.yml
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Complete confirmed-chat verifier contracts"
          git push origin HEAD:feat/creator-confirmed-chat-rollout-runner-20260923
