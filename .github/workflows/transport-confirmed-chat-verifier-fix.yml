name: Transport exact confirmed-chat verifier fixes

on:
  push:
    branches:
      - feat/creator-confirmed-chat-rollout-runner-20260923
    paths:
      - .github/workflows/transport-confirmed-chat-verifier-fix.yml

permissions:
  contents: write

jobs:
  transport:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/creator-confirmed-chat-rollout-runner-20260923
          fetch-depth: 0
          persist-credentials: true
      - name: Verify exact transport base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "bc4564daf941d5cc5094e1b268e3591f374686a6"
      - name: Apply exact tested verifier patch
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/verifier.patch <<'PATCH'
          diff --git a/scripts/operations/creator-confirmed-chat-learning-migration-runner.mjs b/scripts/operations/creator-confirmed-chat-learning-migration-runner.mjs
          index 2b0e014a428f1c938aa69cc66850377028df3a0d..bcc1a8de7e9bf343389a95b78d11dba7371bd7d8 100644
          --- a/scripts/operations/creator-confirmed-chat-learning-migration-runner.mjs
          +++ b/scripts/operations/creator-confirmed-chat-learning-migration-runner.mjs
          @@ -28,16 +28,20 @@ const ROLLOUT_STATE_PATH = resolve(REPO_ROOT, ROLLOUT_STATE_REPO_PATH);
           const WORKSPACE_BOUNDARY_REPO_PATH =
             "supabase/controlled/20260816120000_workspace_member_data_boundary.sql";
           const CREATOR_ACCESS_REPO_PATH = "supabase/controlled/creator_revision_conflict_fix.sql";
          +const WHATSAPP_INBOUND_REPO_PATH =
