name: FanMind AI Tier Staging Migration

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type apply-workspace-ai-tier-entitlements to apply the pinned migration to isolated staging'
        required: true
        type: string

concurrency:
  group: fanmind-ai-tier-staging-migration
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  apply-ai-tier-staging-migration:
    name: Apply pinned AI tier entitlement migration to isolated staging
    if: >-
      ${{
        github.ref == 'refs/heads/main' &&
        inputs.confirmation == 'apply-workspace-ai-tier-entitlements'
      }}
    runs-on: ubuntu-24.04
    environment: staging
    env:
      FANMIND_RUNTIME_ENVIRONMENT: staging
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.FANMIND_STAGING_SUPABASE_URL }}
      FANMIND_TARGET_SUPABASE_PROJECT_REF: ${{ vars.FANMIND_STAGING_SUPABASE_PROJECT_REF }}
      FANMIND_PRODUCTION_SUPABASE_PROJECT_REF: ${{ vars.FANMIND_PRODUCTION_SUPABASE_PROJECT_REF }}
      FANMIND_ENABLE_NON_PRODUCTION_WRITES: 'true'
      FANMIND_NON_PRODUCTION_WRITE_ACK: I_UNDERSTAND_NON_PRODUCTION_ONLY
      FANMIND_AI_TIER_ENTITLEMENT_MIGRATION_CONFIRM: apply-workspace-ai-tier-entitlements
      PGHOST: ${{ secrets.FANMIND_STAGING_DB_HOST }}
      FANMIND_TARGET_DB_HOST: ${{ secrets.FANMIND_STAGING_DB_HOST }}
      PGPORT: ${{ vars.FANMIND_STAGING_DB_PORT }}
      PGDATABASE: ${{ vars.FANMIND_STAGING_DB_NAME }}
      PGUSER: ${{ secrets.FANMIND_STAGING_DB_USER }}

    steps:
      - name: Checkout reviewed main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify pinned migration offline
        run: npm run db:ai-tier-entitlements:check

      - name: Prepare private database password file
        env:
          FANMIND_STAGING_DB_PASSWORD: ${{ secrets.FANMIND_STAGING_DB_PASSWORD }}
          PGPASSFILE: ${{ runner.temp }}/fanmind-ai-tier-staging-migration.pgpass
        run: |
          set -euo pipefail
          umask 077
          case "$FANMIND_STAGING_DB_PASSWORD" in
            *$'\n'*|*$'\r'*)
              echo "Staging database password contains an unsupported line break." >&2
              exit 1
              ;;
          esac
          ESCAPED_DB_PASSWORD="${FANMIND_STAGING_DB_PASSWORD//\\/\\\\}"
          ESCAPED_DB_PASSWORD="${ESCAPED_DB_PASSWORD//:/\\:}"
          printf '%s:%s:%s:%s:%s\n' \
            "$PGHOST" \
            "$PGPORT" \
            "$PGDATABASE" \
            "$PGUSER" \
            "$ESCAPED_DB_PASSWORD" > "$PGPASSFILE"
          chmod 600 "$PGPASSFILE"

      - name: Apply pinned migration and verify metadata
        env:
          PGPASSFILE: ${{ runner.temp }}/fanmind-ai-tier-staging-migration.pgpass
        run: npm run db:ai-tier-entitlements:apply

      - name: Remove private database password file
        if: ${{ always() }}
        env:
          PGPASSFILE: ${{ runner.temp }}/fanmind-ai-tier-staging-migration.pgpass
        run: rm -f "$PGPASSFILE"
