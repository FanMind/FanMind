name: FanMind Confirmed Chat Learning Staging Verify

on:
  workflow_dispatch:
    inputs:
      reviewed_commit:
        description: Exact reviewed main commit to verify on isolated Staging
        required: true
        type: string
      confirmation:
        description: Type verify-creator-confirmed-chat-learning
        required: true
        type: string

concurrency:
  group: fanmind-creator-confirmed-chat-learning-staging-verify
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify confirmed-chat learning schema read-only on isolated Staging
    if: >-
      ${{
        github.ref == 'refs/heads/main' &&
        inputs.reviewed_commit == github.sha &&
        inputs.confirmation == 'verify-creator-confirmed-chat-learning'
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    environment: staging
    env:
      FANMIND_RUNTIME_ENVIRONMENT: staging
      NEXT_PUBLIC_APP_URL: ${{ vars.FANMIND_STAGING_APP_URL }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.FANMIND_STAGING_SUPABASE_URL }}
      FANMIND_TARGET_SUPABASE_PROJECT_REF: ${{ vars.FANMIND_STAGING_SUPABASE_PROJECT_REF }}
      FANMIND_PRODUCTION_SUPABASE_PROJECT_REF: ${{ vars.FANMIND_PRODUCTION_SUPABASE_PROJECT_REF }}
      FANMIND_CREATOR_CONFIRMED_CHAT_REVIEWED_COMMIT: ${{ inputs.reviewed_commit }}
      PGHOST: ${{ secrets.FANMIND_STAGING_DB_HOST }}
      FANMIND_TARGET_DB_HOST: ${{ secrets.FANMIND_STAGING_DB_HOST }}
      PGPORT: '5432'
      PGDATABASE: ${{ vars.FANMIND_STAGING_DB_NAME }}
      PGUSER: ${{ format('postgres.{0}', vars.FANMIND_STAGING_SUPABASE_PROJECT_REF) }}
      PGSSLMODE: verify-full
      PGSSLROOTCERT: ${{ github.workspace }}/config/certificates/supabase-root-2021-ca.crt
      PGCONNECT_TIMEOUT: '10'
      PGOPTIONS: '-c lock_timeout=5000 -c statement_timeout=120000'

    steps:
      - name: Checkout exact reviewed main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Verify pinned source contract offline
        run: node scripts/operations/creator-confirmed-chat-learning-migration-runner.mjs --check

      - name: Prepare dedicated private database password file
        env:
          FANMIND_STAGING_DB_PASSWORD: ${{ secrets.FANMIND_STAGING_DB_PASSWORD }}
          PGPASSFILE: ${{ runner.temp }}/fanmind-creator-confirmed-chat-learning.pgpass
        run: |
          set -euo pipefail
          umask 077
          case "$FANMIND_STAGING_DB_PASSWORD" in
            ''|*$'\n'*|*$'\r'*)
              echo "Staging database password is missing or contains an unsupported line break." >&2
              exit 1
              ;;
          esac
          ESCAPED_DB_PASSWORD="${FANMIND_STAGING_DB_PASSWORD//\\/\\\\}"
          ESCAPED_DB_PASSWORD="${ESCAPED_DB_PASSWORD//:/\\:}"
          printf '%s:%s:%s:%s:%s\n' \
            "$PGHOST" "$PGPORT" "$PGDATABASE" "$PGUSER" \
            "$ESCAPED_DB_PASSWORD" > "$PGPASSFILE"
          chmod 600 "$PGPASSFILE"

      - name: VERIFY confirmed-chat learning schema read-only
        env:
          PGPASSFILE: ${{ runner.temp }}/fanmind-creator-confirmed-chat-learning.pgpass
          FANMIND_ENABLE_NON_PRODUCTION_WRITES: 'false'
          FANMIND_NON_PRODUCTION_WRITE_ACK: ''
        run: node scripts/operations/creator-confirmed-chat-learning-migration-runner.mjs --verify

      - name: Remove dedicated private database password file
        if: ${{ always() }}
        env:
          PGPASSFILE: ${{ runner.temp }}/fanmind-creator-confirmed-chat-learning.pgpass
        run: rm -f "$PGPASSFILE"
