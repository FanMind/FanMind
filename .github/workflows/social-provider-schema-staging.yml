name: FanMind Social Provider Schema Staging

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Read-only verification or controlled isolated Staging installation'
        required: true
        default: verify
        type: choice
        options: [verify, apply]
      reviewed_commit:
        description: 'Exact reviewed main commit containing the pinned controlled SQL'
        required: true
        type: string
      confirmation:
        description: 'Type verify-social-provider-schema or apply-social-provider-schema for the selected action'
        required: true
        type: string

concurrency:
  group: fanmind-social-provider-schema-staging-write
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  apply-social-provider-schema:
    name: Verify or install the Social provider schema on isolated Staging
    if: >-
      ${{
        github.ref == 'refs/heads/main' &&
        inputs.reviewed_commit == github.sha &&
        ((inputs.action == 'verify' && inputs.confirmation == 'verify-social-provider-schema') || (inputs.action == 'apply' && inputs.confirmation == 'apply-social-provider-schema'))
      }}
    timeout-minutes: 8
    runs-on: ubuntu-24.04
    environment: staging
    env:
      FANMIND_RUNTIME_ENVIRONMENT: staging
      NEXT_PUBLIC_APP_URL: ${{ vars.FANMIND_STAGING_APP_URL }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.FANMIND_STAGING_SUPABASE_URL }}
      FANMIND_TARGET_API_ORIGIN: ${{ vars.FANMIND_STAGING_APP_URL }}
      FANMIND_PRODUCTION_API_ORIGIN: https://fanmind.ch
      FANMIND_TARGET_SUPABASE_PROJECT_REF: ${{ vars.FANMIND_STAGING_SUPABASE_PROJECT_REF }}
      FANMIND_PRODUCTION_SUPABASE_PROJECT_REF: ${{ vars.FANMIND_PRODUCTION_SUPABASE_PROJECT_REF }}
      FANMIND_ENABLE_NON_PRODUCTION_WRITES: ${{ inputs.action == 'apply' && 'true' || 'false' }}
      FANMIND_NON_PRODUCTION_WRITE_ACK: ${{ inputs.action == 'apply' && 'I_UNDERSTAND_NON_PRODUCTION_ONLY' || '' }}
      FANMIND_SOCIAL_PROVIDER_SCHEMA_REVIEWED_COMMIT: ${{ inputs.reviewed_commit }}
      FANMIND_SOCIAL_PROVIDER_SCHEMA_APPLY_CONFIRM: ${{ inputs.confirmation }}
      FANMIND_SOCIAL_PROVIDER_SCHEMA_VERIFY_CONFIRM: ${{ inputs.confirmation }}
      FANMIND_SOCIAL_PILOT_ENABLED: 'false'
      PGHOST: ${{ secrets.FANMIND_STAGING_DB_HOST }}
      FANMIND_TARGET_DB_HOST: ${{ secrets.FANMIND_STAGING_DB_HOST }}
      FANMIND_PRODUCTION_DB_HOST: ${{ format('db.{0}.supabase.co', vars.FANMIND_PRODUCTION_SUPABASE_PROJECT_REF) }}
      PGPORT: '5432'
      PGDATABASE: ${{ vars.FANMIND_STAGING_DB_NAME }}
      PGUSER: ${{ format('postgres.{0}', vars.FANMIND_STAGING_SUPABASE_PROJECT_REF) }}
      PGSSLMODE: verify-full
      PGSSLROOTCERT: ${{ github.workspace }}/config/certificates/supabase-root-2021-ca.crt

    steps:
      - name: Checkout reviewed main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Verify pinned controlled SQL offline
        run: node scripts/operations/social-provider-schema-staging-runner.mjs --check

      - name: Prepare dedicated private database password file
        env:
          FANMIND_STAGING_DB_PASSWORD: ${{ secrets.FANMIND_STAGING_DB_PASSWORD }}
          PGPASSFILE: ${{ runner.temp }}/fanmind-social-provider-schema.pgpass
        run: |
          set -euo pipefail
          umask 077
          case "$FANMIND_STAGING_DB_PASSWORD" in
            ''|*$'\n'*|*$'\r'*)
              echo "Staging database password is missing or contains an unsupported line break." >&2
              exit 1
              ;;
          esac
          ESCAPED_DB_PASSWORD="${FANMIND_STAGING_DB_PASSWORD//\\/\\\\}"
          ESCAPED_DB_PASSWORD="${ESCAPED_DB_PASSWORD//:/\\:}"
          printf '%s:%s:%s:%s:%s\n' \
            "$PGHOST" "$PGPORT" "$PGDATABASE" "$PGUSER" \
            "$ESCAPED_DB_PASSWORD" > "$PGPASSFILE"
          chmod 600 "$PGPASSFILE"

      - name: Verify or install the pinned Social provider schema
        env:
          PGPASSFILE: ${{ runner.temp }}/fanmind-social-provider-schema.pgpass
          SOCIAL_SCHEMA_ACTION: ${{ inputs.action }}
        run: |
          case "$SOCIAL_SCHEMA_ACTION" in
            verify) node scripts/operations/social-provider-schema-staging-runner.mjs --verify ;;
            apply) node scripts/operations/social-provider-schema-staging-runner.mjs --apply ;;
            *) exit 1 ;;
          esac

      - name: Remove dedicated private database password file
        if: ${{ always() }}
        env:
          PGPASSFILE: ${{ runner.temp }}/fanmind-social-provider-schema.pgpass
        run: rm -f "$PGPASSFILE"
