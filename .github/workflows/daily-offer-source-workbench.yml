name: Daily offer source workbench
on:
  push:
    branches: [fix/daily-admin-rollout-20260914]
    paths: [.github/workflows/daily-offer-source-workbench.yml]
permissions:
  contents: read
jobs:
  public-source:
    if: github.repository == 'FanMind/FanMind' && github.ref == 'refs/heads/fix/daily-admin-rollout-20260914'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.13.1
      - name: Archive tracked public source only
        run: |
          set -euo pipefail
          git archive --format=tar.gz -o "$RUNNER_TEMP/fanmind-public-source.tar.gz" HEAD
          npm ci --ignore-scripts --no-audit --no-fund
          tar -czf "$RUNNER_TEMP/fanmind-public-dependencies.tar.gz" node_modules
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: daily-offer-public-workbench
          path: |
            ${{ runner.temp }}/fanmind-public-source.tar.gz
            ${{ runner.temp }}/fanmind-public-dependencies.tar.gz
          retention-days: 1
          if-no-files-found: error
