name: FanMind Creator Target Drift Diagnosis

on:
  issue_comment:
    types: [created]

concurrency:
  group: fanmind-staging-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  authorize:
    name: Validate exact owner diagnosis command and current main
    if: >-
      ${{ github.event.issue.number == 874 &&
      github.event.comment.user.login == 'Bernds-tech' &&
      github.event.comment.user.id == 270165082 &&
      startsWith(github.event.comment.body, 'run-creator-target-drift-diagnosis ') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    outputs:
      reviewed_commit: ${{ steps.command.outputs.reviewed_commit }}
    steps:
      - name: Parse exact one-shot diagnosis command
        id: command
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const body = process.env.COMMENT_BODY ?? "";
          const match = body.match(/^run-creator-target-drift-diagnosis ([0-9a-f]{40})$/u);
          if (!match) throw new Error("command_invalid");
          const reviewed = match[1];
          const response = await fetch("https://api.github.com/repos/FanMind/FanMind/branches/main", {
            headers: {Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: "application/vnd.github+json"},
            redirect: "error", signal: AbortSignal.timeout(15000),
          });
          if (!response.ok) throw new Error("main_unavailable");
          const main = await response.json();
          if (main.commit?.sha !== reviewed) throw new Error("main_moved");
          const {appendFileSync} = await import("node:fs");
          appendFileSync(process.env.GITHUB_OUTPUT, `reviewed_commit=${reviewed}\n`);
          console.log("CREATOR_TARGET_DRIFT_DIAGNOSIS_COMMAND=AUTHORIZED");
          NODE

      - name: Checkout exact current main diagnosis control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.command.outputs.reviewed_commit }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify bounded read-only diagnosis authorization
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ steps.command.outputs.reviewed_commit }}"
          grep -Fq 'FM-AUTH-CREATOR-TARGET-DRIFT-DIAGNOSIS-20260927' project-memory/AUTHORIZATIONS.md
          grep -Fq 'FanMind Staging `vshyhvgcmrlagvfnvomc` only' project-memory/AUTHORIZATIONS.md
          grep -Fq 'No SQL APPLY, deploy, runtime activation or Production mutation' project-memory/AUTHORIZATIONS.md

      - name: Consume the diagnosis command exactly once per reviewed main
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEWED_COMMIT: ${{ steps.command.outputs.reviewed_commit }}
          SOURCE_COMMENT_ID: ${{ github.event.comment.id }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const api = "https://api.github.com/repos/FanMind/FanMind";
          const reviewed = process.env.REVIEWED_COMMIT ?? "";
          if (!/^[0-9a-f]{40}$/u.test(reviewed)) throw new Error("reviewed_commit_invalid");
          const marker = `<!-- fanmind-creator-target-drift-diagnosis-consumed:${reviewed} -->`;
          const headers = {
            Authorization: `Bearer ${process.env.GH_TOKEN}`,
            Accept: "application/vnd.github+json",
            "Content-Type": "application/json",
          };
          let consumed = false;
          for (let page = 1; page <= 20; page++) {
            const response = await fetch(`${api}/issues/874/comments?per_page=100&page=${page}`, {
              headers, redirect: "error", signal: AbortSignal.timeout(15000),
            });
            if (!response.ok) throw new Error("consumption_read_failed");
            const comments = await response.json();
            consumed ||= comments.some(comment =>
              comment.user?.login === "github-actions[bot]" && comment.body?.startsWith(marker));
            if (comments.length < 100) break;
          }
          if (consumed) throw new Error("command_already_consumed");
          const response = await fetch(`${api}/issues/874/comments`, {
            method: "POST", headers, redirect: "error", signal: AbortSignal.timeout(15000),
            body: JSON.stringify({body: `${marker}\nreviewed_commit=${reviewed}\nsource_comment_id=${process.env.SOURCE_COMMENT_ID}`}),
          });
          if (response.status !== 201) throw new Error("consumption_write_failed");
          console.log("CREATOR_TARGET_DRIFT_DIAGNOSIS_COMMAND=CONSUMED");
          NODE

  reference:
    name: Rebuild exact accepted private PG17 reference
    needs: authorize
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    services:
      pg17:
        image: postgres:17.11-trixie@sha256:e38411452a464af89e5adadb8d223bf53b898d47d6ef918b2d58c08707350449
        env:
          POSTGRES_PASSWORD: fanmind-ci-only-pg17
          POSTGRES_INITDB_ARGS: >-
            --encoding=UTF8 --locale-provider=icu
            --icu-locale=en-US --locale=en_US.UTF-8
        options: >-
          --health-cmd "pg_isready --username=postgres --dbname=postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout exact accepted PG17 reference source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: b323361cafc3829e470f6da611c7ab7d8c8664f6
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.13.1

      - name: Rebuild the accepted reference in isolated PostgreSQL 17
        env:
          FANMIND_CREATOR_PG17_CONTAINER_ID: ${{ job.services.pg17.id }}
          FANMIND_CREATOR_PG17_REQUIRED: "true"
          FANMIND_CREATOR_RECONCILIATION_EXPORT: "true"
          FANMIND_CREATOR_RECONCILIATION_REVIEWED_SOURCE_SHA: 3cd67cedbcdc051be855d09de8d5ea3225179217
        run: |
          set -euo pipefail
          GITHUB_SHA=b323361cafc3829e470f6da611c7ab7d8c8664f6             node --test --test-concurrency=1 tests/creator-foundation-reconciliation-pg17.test.mjs

      - name: Upload the run-local accepted reference
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fanmind-creator-foundation-reference-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fanmind-creator-foundation-reference-${{ github.run_id }}-${{ github.run_attempt }}/*.json
          if-no-files-found: error
          retention-days: 1

  diagnose:
    name: Classify exact Staging target without writes
    needs: [authorize, reference]
    runs-on: ubuntu-24.04
    environment: staging
    permissions:
      actions: read
      contents: read
    env:
      FANMIND_RUNTIME_ENVIRONMENT: staging
      NEXT_PUBLIC_APP_URL: https://staging.fanmind.ch
      FANMIND_PRODUCTION_API_ORIGIN: https://fanmind.ch
      FANMIND_TARGET_SUPABASE_PROJECT_REF: ${{ vars.FANMIND_STAGING_SUPABASE_PROJECT_REF }}
      FANMIND_PRODUCTION_SUPABASE_PROJECT_REF: ${{ vars.FANMIND_PRODUCTION_SUPABASE_PROJECT_REF }}
      FANMIND_CREATOR_TRANSITION_REVIEWED_COMMIT: ${{ needs.authorize.outputs.reviewed_commit }}
      FANMIND_TARGET_DB_HOST: ${{ secrets.FANMIND_STAGING_DB_HOST }}
      FANMIND_PRODUCTION_DB_HOST: ${{ format('db.{0}.supabase.co', vars.FANMIND_PRODUCTION_SUPABASE_PROJECT_REF) }}
      PGHOST: ${{ secrets.FANMIND_STAGING_DB_HOST }}
      PGPORT: '5432'
      PGDATABASE: ${{ vars.FANMIND_STAGING_DB_NAME }}
      PGUSER: ${{ format('postgres.{0}', vars.FANMIND_STAGING_SUPABASE_PROJECT_REF) }}
      PGSSLMODE: verify-full
      PGSSLROOTCERT: ${{ github.workspace }}/config/certificates/supabase-root-2021-ca.crt
    steps:
      - name: Checkout exact reviewed main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.authorize.outputs.reviewed_commit }}
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'


      - name: Download and verify the run-local accepted private PG17 reference
        env:
          GH_TOKEN: ${{ github.token }}
          FANMIND_CREATOR_TRANSITION_REFERENCE_DIR: ${{ runner.temp }}/creator-drift-diagnosis-reference
          REFERENCE_ARTIFACT_NAME: fanmind-creator-foundation-reference-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          mkdir -m 700 "$FANMIND_CREATOR_TRANSITION_REFERENCE_DIR"
          node --input-type=module <<'NODE'
          import {createHash} from "node:crypto";
          import {writeFileSync} from "node:fs";
          const runId = process.env.GITHUB_RUN_ID;
          const name = process.env.REFERENCE_ARTIFACT_NAME;
          const headers = {Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: "application/vnd.github+json"};
          let response = await fetch(`https://api.github.com/repos/FanMind/FanMind/actions/runs/${runId}/artifacts?name=${encodeURIComponent(name)}`, {
            headers, redirect: "error", signal: AbortSignal.timeout(15000),
          });
          if (!response.ok) throw new Error("reference_metadata_unavailable");
          const listing = await response.json();
          if (listing.total_count !== 1 || listing.artifacts?.length !== 1) {
            throw new Error("reference_metadata_mismatch");
          }
          const meta = listing.artifacts[0];
          if (meta.expired || meta.name !== name || meta.workflow_run?.id !== Number(runId) ||
              !/^sha256:[a-f0-9]{64}$/u.test(meta.digest ?? "")) {
            throw new Error("reference_metadata_mismatch");
          }
          response = await fetch(meta.archive_download_url, {
            headers, redirect: "follow", signal: AbortSignal.timeout(30000),
          });
          if (!response.ok) throw new Error("reference_download_failed");
          const archive = Buffer.from(await response.arrayBuffer());
          if (`sha256:${createHash("sha256").update(archive).digest("hex")}` !== meta.digest) {
            throw new Error("reference_archive_mismatch");
          }
          writeFileSync(`${process.env.RUNNER_TEMP}/creator-drift-diagnosis-reference.zip`,
            archive, {mode: 0o600, flag: "wx"});
          NODE
          unzip -q "$RUNNER_TEMP/creator-drift-diagnosis-reference.zip" -d "$FANMIND_CREATOR_TRANSITION_REFERENCE_DIR"
          rm -f "$RUNNER_TEMP/creator-drift-diagnosis-reference.zip"
          chmod 600 "$FANMIND_CREATOR_TRANSITION_REFERENCE_DIR"/*.json
          node --input-type=module <<'NODE'
          import {createHash} from "node:crypto";
          import {readFileSync} from "node:fs";
          const directory = process.env.FANMIND_CREATOR_TRANSITION_REFERENCE_DIR;
          const digest = value => createHash("sha256").update(value).digest("hex");
          const legacy = readFileSync(`${directory}/legacy.json`);
          const current = readFileSync(`${directory}/current.json`);
          const manifest = JSON.parse(readFileSync(`${directory}/manifest.json`, "utf8"));
          if (digest(legacy) !== "310325bf904790db5644b0674cc3f70f7cf5562c0a7c749b98e716e5d36ce2ab" ||
              digest(current) !== "26fdb3969f985f1bc91539925615df725ae98f7fda4f8b38354e2934917bfe7e" ||
              manifest.scope !== "isolated_ci_creator_foundation_reference" ||
              manifest.githubSha !== "b323361cafc3829e470f6da611c7ab7d8c8664f6" ||
              manifest.reviewedSourceSha !== "3cd67cedbcdc051be855d09de8d5ea3225179217" ||
              manifest.runId !== process.env.GITHUB_RUN_ID ||
              manifest.runAttempt !== process.env.GITHUB_RUN_ATTEMPT ||
              manifest.querySha256 !== "252951c7b64adda2e52c92f2d2b141390e79275db61d09460d92bb7509ff2436" ||
              manifest.files?.["legacy.json"] !== digest(legacy) ||
              manifest.files?.["current.json"] !== digest(current)) {
            throw new Error("reference_content_mismatch");
          }
          NODE

      - name: Prepare dedicated private read-only database password file
        env:
          FANMIND_STAGING_DB_PASSWORD: ${{ secrets.FANMIND_STAGING_DB_PASSWORD }}
          PGPASSFILE: ${{ runner.temp }}/fanmind-creator-drift-diagnosis.pgpass
        run: |
          set -euo pipefail
          umask 077
          case "$FANMIND_STAGING_DB_PASSWORD" in
            ''|*$'\n'*|*$'\r'*) exit 1 ;;
          esac
          ESCAPED="${FANMIND_STAGING_DB_PASSWORD//\\/\\\\}"
          ESCAPED="${ESCAPED//:/\\:}"
          printf '%s:%s:%s:%s:%s\n' "$PGHOST" "$PGPORT" "$PGDATABASE" "$PGUSER" "$ESCAPED" > "$PGPASSFILE"
          chmod 600 "$PGPASSFILE"
          echo "PGPASSFILE=$PGPASSFILE" >> "$GITHUB_ENV"

      - name: Emit only bounded target classification metadata
        env:
          FANMIND_CREATOR_TRANSITION_REFERENCE_DIR: ${{ runner.temp }}/creator-drift-diagnosis-reference
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ needs.authorize.outputs.reviewed_commit }}"
          node scripts/operations/creator-foundation-transition-staging-runner.mjs --check >/dev/null
          set +e
          output="$(node scripts/operations/creator-foundation-transition-staging-runner.mjs --verify 2>&1)"
          status="$?"
          set -e
          test "$status" -eq 0 -o "$status" -eq 2
          mapfile -t lines <<< "$output"
          test "${#lines[@]}" -eq 5
          [[ "${lines[0]}" =~ ^CREATOR_TARGET_TRANSITION_STATE=[A-Za-z0-9_]+$ ]]
          [[ "${lines[1]}" =~ ^CREATOR_TARGET_TRANSITION_DIFFERING_SECTIONS=[A-Za-z0-9_,]+$ ]]
          [[ "${lines[2]}" =~ ^CREATOR_TARGET_TRANSITION_BLOCKERS=[A-Za-z0-9_,]+$ ]]
          test "${lines[3]}" = 'CREATOR_TARGET_TRANSITION_APPLY=not_requested'
          test "${lines[4]}" = 'CREATOR_TARGET_TRANSITION_RUNTIME_ACTIVATED=false'
          printf '%s\n' "${lines[@]}"

      - name: Remove private diagnosis evidence
        if: ${{ always() }}
        run: |
          rm -rf "$RUNNER_TEMP/creator-drift-diagnosis-reference"
          rm -f "$RUNNER_TEMP/fanmind-creator-drift-diagnosis.pgpass" "$RUNNER_TEMP/creator-drift-diagnosis-reference.zip"
