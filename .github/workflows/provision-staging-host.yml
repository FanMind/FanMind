name: Provision FanMind Staging Host

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type provision-fanmind-staging-host to confirm the isolated host setup'
        required: true
        type: string

concurrency:
  group: fanmind-staging-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  provision-staging-host:
    name: Provision isolated staging user, checkout, nginx and runner
    if: >-
      github.ref == 'refs/heads/main' &&
      inputs.confirmation == 'provision-fanmind-staging-host'
    environment: staging
    runs-on: [self-hosted, fanmind-prod, exoscale, linux, x64]
    env:
      STAGING_APP_URL: ${{ vars.FANMIND_STAGING_APP_URL }}
      STAGING_SUPABASE_PROJECT_REF: ${{ vars.FANMIND_STAGING_SUPABASE_PROJECT_REF }}
      PRODUCTION_SUPABASE_PROJECT_REF: ${{ vars.FANMIND_PRODUCTION_SUPABASE_PROJECT_REF }}
      STAGING_SUPABASE_URL: ${{ secrets.FANMIND_STAGING_SUPABASE_URL }}
      STAGING_SUPABASE_ANON_KEY: ${{ secrets.FANMIND_STAGING_SUPABASE_ANON_KEY }}
      STAGING_SUPABASE_SERVICE_KEY: ${{ secrets.FANMIND_STAGING_SUPABASE_SERVICE_ROLE_KEY }}
      STAGING_STRIPE_SECRET_KEY: ${{ secrets.FANMIND_STAGING_STRIPE_SECRET_KEY }}
      STAGING_STRIPE_WEBHOOK_SECRET: ${{ secrets.FANMIND_STAGING_STRIPE_WEBHOOK_SECRET }}
      STAGING_STRIPE_PRICE_STARTER_SETUP: ${{ vars.FANMIND_STAGING_STRIPE_PRICE_STARTER_SETUP }}
      STAGING_STRIPE_PRICE_STARTER_MONTHLY: ${{ vars.FANMIND_STAGING_STRIPE_PRICE_STARTER_MONTHLY }}
      STAGING_STRIPE_PRICE_INTERNAL_DAILY_TEST: ${{ vars.FANMIND_STAGING_STRIPE_PRICE_INTERNAL_DAILY_TEST }}
      STAGING_STRIPE_PRICE_AI_PLUS: ${{ vars.FANMIND_STAGING_STRIPE_PRICE_AI_PLUS }}
      STAGING_STRIPE_PRICE_AI_ULTRA: ${{ vars.FANMIND_STAGING_STRIPE_PRICE_AI_ULTRA }}
      STAGING_STRIPE_TAX_REGISTRATION_CONFIRMED: ${{ vars.FANMIND_STAGING_STRIPE_TAX_REGISTRATION_CONFIRMED }}
      STAGING_ADMIN_EMAILS: ${{ vars.FANMIND_STAGING_ADMIN_EMAILS }}
      STAGING_OPENAI_API_KEY: ${{ secrets.FANMIND_STAGING_OPENAI_API_KEY }}
      STAGING_RUNNER_REGISTRATION_TOKEN: ${{ secrets.FANMIND_STAGING_RUNNER_REGISTRATION_TOKEN }}

    steps:
      - name: Checkout reviewed provisioning files
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate isolated targets and runner prerequisite without mutations
        shell: bash
        run: |
          set -euo pipefail

          if [ "${RUNNER_NAME:-}" != "fanmind-prod-01-exoscale" ]; then
            echo "Unexpected bootstrap runner." >&2
            exit 1
          fi
          if [ "$STAGING_APP_URL" != "https://staging.fanmind.ch" ]; then
            echo "Unexpected staging application target." >&2
            exit 1
          fi
          if [ "$STAGING_SUPABASE_URL" != "https://$STAGING_SUPABASE_PROJECT_REF.supabase.co" ]; then
            echo "Staging Supabase target binding is invalid." >&2
            exit 1
          fi
          if [ -z "$STAGING_SUPABASE_PROJECT_REF" ] || [ "$STAGING_SUPABASE_PROJECT_REF" = "$PRODUCTION_SUPABASE_PROJECT_REF" ]; then
            echo "Staging Supabase is missing or matches Production." >&2
            exit 1
          fi
          if [ -z "$STAGING_SUPABASE_ANON_KEY" ] || [ -z "$STAGING_SUPABASE_SERVICE_KEY" ]; then
            echo "Required staging Supabase credentials are missing." >&2
            exit 1
          fi
          case "$STAGING_SUPABASE_SERVICE_KEY" in
            sb_secret_*|eyJ*) ;;
            *)
              echo "Unexpected staging server key format." >&2
              exit 1
              ;;
          esac
          if [ -n "$STAGING_STRIPE_SECRET_KEY" ]; then
            case "$STAGING_STRIPE_SECRET_KEY" in
              sk_test_*|rk_test_*) ;;
              *)
                echo "Only Stripe Test Mode is permitted in staging." >&2
                exit 1
                ;;
            esac
          fi
          if [ -n "$STAGING_STRIPE_WEBHOOK_SECRET" ]; then
            case "$STAGING_STRIPE_WEBHOOK_SECRET" in
              whsec_*) ;;
              *)
                echo "Unexpected staging Stripe webhook secret format." >&2
                exit 1
                ;;
            esac
          fi
          case "$STAGING_STRIPE_TAX_REGISTRATION_CONFIRMED" in
            ""|true|false) ;;
            *)
              echo "Unexpected staging Stripe Tax registration confirmation." >&2
              exit 1
              ;;
          esac

          RUNNER_DIR="/opt/actions-runner-fanmind-staging"
          if ! sudo test -f "$RUNNER_DIR/.runner" && [ -z "$STAGING_RUNNER_REGISTRATION_TOKEN" ]; then
            echo "Fresh staging runner registration token is required before any host mutation." >&2
            exit 1
          fi

          echo "STAGING_HOST_TARGET=isolated"
          echo "STAGING_SUPABASE_TARGET=separate"
          echo "STAGING_RUNNER_PREREQUISITE=ready"
          echo "STAGING_SECRETS_OUTPUT=false"

      - name: Provision isolated operating-system boundary
        shell: bash
        run: |
          set -euo pipefail

          STAGING_USER="fanmind-staging"
          SOURCE_DIR="/var/www/fanmind-staging"

          if ! id "$STAGING_USER" >/dev/null 2>&1; then
            sudo useradd --system --create-home --home-dir "/home/$STAGING_USER" --shell /bin/bash "$STAGING_USER"
          fi

          sudo install -d -o "$STAGING_USER" -g "$STAGING_USER" -m 0750 "$SOURCE_DIR"

          SUDOERS_TMP="$(mktemp "$RUNNER_TEMP/fanmind-staging-sudoers.XXXXXX")"
          trap 'rm -f "$SUDOERS_TMP"' EXIT
          printf '%s ALL=(root) NOPASSWD: /usr/sbin/nginx -t, /usr/bin/systemctl enable fanmind-staging.service, /usr/bin/systemctl restart fanmind-staging.service, /usr/bin/systemctl is-active --quiet fanmind-staging.service\n' "$STAGING_USER" > "$SUDOERS_TMP"
          chmod 0440 "$SUDOERS_TMP"
          sudo visudo --check --file "$SUDOERS_TMP"
          sudo install -o root -g root -m 0440 "$SUDOERS_TMP" /etc/sudoers.d/fanmind-staging-nginx-check
          rm -f "$SUDOERS_TMP"
          trap - EXIT

          echo "STAGING_OS_USER=isolated"
          echo "STAGING_SOURCE_PATH=isolated"

      - name: Install private staging runtime environment
        shell: bash
        run: |
          set -euo pipefail

          RUNTIME_SECRET_DIR="/etc/fanmind-staging"
          RUNTIME_SECRET_FILE="$RUNTIME_SECRET_DIR/runtime-secrets.env"
          ENV_TMP="$(mktemp "$RUNNER_TEMP/fanmind-staging-env.XXXXXX")"
          export ENV_TMP
          trap 'rm -f "$ENV_TMP"' EXIT

          node <<'NODE'
          const { writeFileSync } = require("node:fs");

          const required = (name) => {
            const value = String(process.env[name] ?? "");
            if (!value || /[\r\n\0]/u.test(value)) {
              throw new Error(`invalid required environment value: ${name}`);
            }
            return value;
          };
          const adminEmails = (name) => {
            const emails = required(name)
              .split(",")
              .map((value) => value.trim().toLowerCase());
            if (
              emails.some(
                (value) =>
                  !value || !/^[^\s@,]+@[^\s@,]+\.[^\s@,]+$/u.test(value),
              )
            ) {
              throw new Error(`invalid admin email list: ${name}`);
            }
            return [...new Set(emails)].join(",");
          };

          const optional = (name) => {
            const value = String(process.env[name] ?? "");
            if (/[\r\n\0]/u.test(value)) {
              throw new Error(`invalid optional environment value: ${name}`);
            }
            return value;
          };
          const confirmed = (name) => optional(name) === "true" ? "true" : "false";

          const values = [
            ["FANMIND_RUNTIME_ENVIRONMENT", "staging"],
            ["PORT", "3001"],
            ["NEXT_PUBLIC_APP_URL", required("STAGING_APP_URL")],
            ["NEXT_PUBLIC_SITE_URL", required("STAGING_APP_URL")],
            ["NEXT_PUBLIC_SUPABASE_URL", required("STAGING_SUPABASE_URL")],
            ["NEXT_PUBLIC_SUPABASE_ANON_KEY", required("STAGING_SUPABASE_ANON_KEY")],
            ["SUPABASE_SERVICE_ROLE_KEY", required("STAGING_SUPABASE_SERVICE_KEY")],
            ["FANMIND_TARGET_SUPABASE_PROJECT_REF", required("STAGING_SUPABASE_PROJECT_REF")],
            ["FANMIND_PRODUCTION_SUPABASE_PROJECT_REF", required("PRODUCTION_SUPABASE_PROJECT_REF")],
            ["FANMIND_ENABLE_NON_PRODUCTION_WRITES", "false"],
            ["FANMIND_NON_PRODUCTION_WRITE_ACK", ""],
            ["STRIPE_SECRET_KEY", optional("STAGING_STRIPE_SECRET_KEY")],
            ["STRIPE_WEBHOOK_SECRET", optional("STAGING_STRIPE_WEBHOOK_SECRET")],
            ["FANMIND_TAX_MODE", "stripe_tax"],
            ["FANMIND_STRIPE_TAX_REGISTRATION_CONFIRMED", confirmed("STAGING_STRIPE_TAX_REGISTRATION_CONFIRMED")],
            ["STRIPE_PRICE_STARTER_SETUP", optional("STAGING_STRIPE_PRICE_STARTER_SETUP")],
            ["STRIPE_PRICE_STARTER_MONTHLY", optional("STAGING_STRIPE_PRICE_STARTER_MONTHLY")],
            ["STRIPE_PRICE_INTERNAL_DAILY_TEST", optional("STAGING_STRIPE_PRICE_INTERNAL_DAILY_TEST")],
            ["STRIPE_PRICE_AI_PLUS", optional("STAGING_STRIPE_PRICE_AI_PLUS")],
            ["STRIPE_PRICE_AI_ULTRA", optional("STAGING_STRIPE_PRICE_AI_ULTRA")],
            ["OPENAI_API_KEY", optional("STAGING_OPENAI_API_KEY")],
            ["FANMIND_ENABLE_REFERRAL_BILLING", "false"],
            ["FANMIND_PUBLIC_DEMO_ENABLED", "false"],
            ["FANMIND_ENABLE_TELEGRAM_SEND", "false"],
            ["FANMIND_OPERATIONS_MONITOR_ENABLED", "false"],
            ["FANMIND_OPERATIONS_EMAIL_ENABLED", "false"],
            ["FANMIND_SERVER_ERROR_TRACKING_ENABLED", "false"],
            ["FANMIND_SERVER_ERROR_EMAIL_ENABLED", "false"],
            ["FANMIND_ADMIN_EMAILS", adminEmails("STAGING_ADMIN_EMAILS")],
            ["NEXT_PUBLIC_META_PIXEL_ID", ""],
            ["FANMIND_ENABLE_ISOLATED_RELEASE_DEPLOY", "false"],
          ];

          const content = values
            .map(([name, value]) => `${name}=${JSON.stringify(value)}`)
            .join("\n");
          writeFileSync(process.env.ENV_TMP, `${content}\n`, {
            encoding: "utf8",
            mode: 0o600,
          });
          NODE

          # Preserve device encryption material before replacing the private env.
          NEXT_ENV=/var/www/fanmind-staging/.env.production.provisioning
          test ! -e "$NEXT_ENV" && test ! -L "$NEXT_ENV"
          sudo install -o fanmind-staging -g fanmind-staging -m 0600 "$ENV_TMP" "$NEXT_ENV"
          sudo -u fanmind-staging /usr/bin/node scripts/operations/staging-push-key-preservation.mjs
          sudo mv -T "$NEXT_ENV" /var/www/fanmind-staging/.env.production
          rm -f "$ENV_TMP"
          trap - EXIT

          test "$(sudo stat -c '%U:%G:%a' /var/www/fanmind-staging/.env.production)" = "fanmind-staging:fanmind-staging:600"

          sudo install -d -o root -g fanmind-staging -m 0750 "$RUNTIME_SECRET_DIR"
          if sudo test -e "$RUNTIME_SECRET_FILE"; then
            if sudo test -L "$RUNTIME_SECRET_FILE" \
              || ! sudo test -f "$RUNTIME_SECRET_FILE" \
              || [ "$(sudo stat -c '%U:%G:%a' "$RUNTIME_SECRET_FILE")" != "root:fanmind-staging:640" ] \
              || ! sudo -u fanmind-staging -H grep -Eq '^FANMIND_SHARED_RATE_LIMIT_SECRET="[0-9a-f]{64}"$' "$RUNTIME_SECRET_FILE"; then
              echo "Existing staging runtime secret file is incomplete or unsafe." >&2
              exit 1
            fi
            echo "STAGING_RUNTIME_SECRET=preserved"
          else
            RUNTIME_SECRET_TMP="$(mktemp "$RUNNER_TEMP/fanmind-staging-runtime-secret.XXXXXX")"
            export RUNTIME_SECRET_TMP
            trap 'rm -f "$ENV_TMP" "$RUNTIME_SECRET_TMP"' EXIT
            node -e '
              const { randomBytes } = require("node:crypto");
              const { writeFileSync } = require("node:fs");
              const secret = randomBytes(32).toString("hex");
              writeFileSync(
                process.env.RUNTIME_SECRET_TMP,
                `FANMIND_SHARED_RATE_LIMIT_SECRET=${JSON.stringify(secret)}\n`,
                { encoding: "utf8", mode: 0o600 },
              );
            '
            sudo install -o root -g fanmind-staging -m 0640 "$RUNTIME_SECRET_TMP" "$RUNTIME_SECRET_FILE"
            rm -f "$RUNTIME_SECRET_TMP"
            trap 'rm -f "$ENV_TMP"' EXIT
            echo "STAGING_RUNTIME_SECRET=created"
          fi

          echo "STAGING_ENV_FILE=private"

      - name: Install isolated staging application service
        shell: bash
        run: |
          set -euo pipefail

          if [ "$(command -v systemctl)" != "/usr/bin/systemctl" ]; then
            echo "Unexpected systemctl path." >&2
            exit 1
          fi
          if [ "$(command -v npm)" != "/usr/bin/npm" ]; then
            echo "Unexpected npm path for the staging service." >&2
            exit 1
          fi

          sudo install -o root -g root -m 0644 \
            ops/systemd/fanmind-staging.service \
            /etc/systemd/system/fanmind-staging.service
          sudo systemctl daemon-reload
          echo "STAGING_APPLICATION_SERVICE=installed"

      - name: Install or preserve isolated virtual host
        shell: bash
        run: |
          set -euo pipefail

          STAGING_NGINX_CONFIG="/etc/nginx/sites-available/fanmind-staging"
          STAGING_CERTIFICATE="/etc/letsencrypt/live/staging.fanmind.ch/fullchain.pem"
          STAGING_CERTIFICATE_KEY="/etc/letsencrypt/live/staging.fanmind.ch/privkey.pem"

          if sudo test -e "$STAGING_CERTIFICATE" || sudo test -e "$STAGING_CERTIFICATE_KEY"; then
            if ! sudo test -r "$STAGING_CERTIFICATE" \
              || ! sudo test -r "$STAGING_CERTIFICATE_KEY" \
              || ! sudo test -f "$STAGING_NGINX_CONFIG"; then
              echo "Existing staging TLS state is incomplete or unsafe." >&2
              exit 1
            fi
            WHATSAPP_TLS_BOUNDARY="$(sudo awk \
              -v expected_certificate="$STAGING_CERTIFICATE" \
              -v expected_certificate_key="$STAGING_CERTIFICATE_KEY" \
              -f scripts/operations/verify-staging-nginx-whatsapp-boundary.awk \
              "$STAGING_NGINX_CONFIG")"
            if [ "$WHATSAPP_TLS_BOUNDARY" != "valid" ]; then
              echo "Existing staging TLS virtual host lacks the exact WhatsApp query-redaction boundary." >&2
              exit 1
            fi
            echo "STAGING_NGINX_TLS=preserved"
          else
            sudo install -o root -g root -m 0644 \
              ops/nginx/fanmind-staging.http.conf "$STAGING_NGINX_CONFIG"
            echo "STAGING_NGINX_HTTP=ready"
          fi

          sudo ln -sfn "$STAGING_NGINX_CONFIG" /etc/nginx/sites-enabled/fanmind-staging
          sudo nginx -t
          sudo systemctl reload nginx

      - name: Install isolated GitHub Actions runner
        shell: bash
        run: |
          set -euo pipefail

          RUNNER_USER="fanmind-staging"
          RUNNER_NAME="fanmind-staging-01-exoscale"
          RUNNER_DIR="/opt/actions-runner-fanmind-staging"
          RUNNER_ARCHIVE="actions-runner-linux-x64-2.336.0.tar.gz"
          RUNNER_URL="https://github.com/actions/runner/releases/download/v2.336.0/$RUNNER_ARCHIVE"
          RUNNER_SHA256="04cf0be1aff4c3ec3554466c39124ca250e3effd8873bb7e8d68535aa9505d5d"

          sudo install -d -o "$RUNNER_USER" -g "$RUNNER_USER" -m 0750 "$RUNNER_DIR"

          if [ ! -x "$RUNNER_DIR/config.sh" ]; then
            DOWNLOAD_PATH="$RUNNER_TEMP/$RUNNER_ARCHIVE"
            PRIVATE_ARCHIVE_PATH="$RUNNER_DIR/$RUNNER_ARCHIVE"
            curl --fail --silent --show-error --location --output "$DOWNLOAD_PATH" "$RUNNER_URL"
            printf '%s  %s\n' "$RUNNER_SHA256" "$DOWNLOAD_PATH" | sha256sum --check --status
            sudo install -o "$RUNNER_USER" -g "$RUNNER_USER" -m 0600 "$DOWNLOAD_PATH" "$PRIVATE_ARCHIVE_PATH"
            rm -f "$DOWNLOAD_PATH"
            sudo -u "$RUNNER_USER" -H tar -xzf "$PRIVATE_ARCHIVE_PATH" -C "$RUNNER_DIR"
            sudo -u "$RUNNER_USER" -H rm -f "$PRIVATE_ARCHIVE_PATH"
          fi

          if ! sudo test -f "$RUNNER_DIR/.runner"; then
            if [ -z "$STAGING_RUNNER_REGISTRATION_TOKEN" ]; then
              echo "Fresh runner registration token is required for first setup." >&2
              exit 1
            fi
            sudo -u "$RUNNER_USER" -H "$RUNNER_DIR/config.sh" --unattended --url https://github.com/Bernds-tech/FanMind --token "$STAGING_RUNNER_REGISTRATION_TOKEN" --name "$RUNNER_NAME" --labels fanmind-staging,exoscale --work _work --replace
            (
              cd "$RUNNER_DIR"
              sudo ./svc.sh install "$RUNNER_USER"
            )
          fi

          SERVICE_NAME="$(sudo cat "$RUNNER_DIR/.service")"
          case "$SERVICE_NAME" in
            actions.runner.Bernds-tech-FanMind.fanmind-staging-01-exoscale.service) ;;
            *)
              echo "Unexpected staging runner service identity." >&2
              exit 1
              ;;
          esac
          sudo systemctl enable --now "$SERVICE_NAME"
          sudo systemctl is-active --quiet "$SERVICE_NAME"
          echo "STAGING_RUNNER=active"

      - name: Report DNS target without touching Production
        shell: bash
        run: |
          set -euo pipefail

          SERVER_IPV4="$(
            ip -4 -o addr show scope global | awk '{split($4, address, "/"); print address[1]; exit}'
          )"
          if [[ ! "$SERVER_IPV4" =~ ^([0-9]{1,3}\.){3}[0-9]{1,3}$ ]]; then
            echo "Public IPv4 could not be identified." >&2
            exit 1
          fi
          {
            echo "### FanMind Staging DNS target"
            echo
            echo "Create an A record for \`staging.fanmind.ch\` pointing to \`$SERVER_IPV4\`."
            echo "The existing Production application and PM2 process were not changed."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "STAGING_DNS_TARGET=identified"
