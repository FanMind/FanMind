name: FanMind Staging Core and CSV Acceptance

on:
  workflow_dispatch:
    inputs:
      reviewed_commit:
        description: 'Exact reviewed main commit deployed to isolated Staging'
        required: true
        type: string
      confirmation:
        description: 'Type run-staging-core-csv-acceptance to continue'
        required: true
        type: string

concurrency:
  group: fanmind-staging-core-csv-write
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate-dispatch:
    name: Validate exact Staging acceptance request
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      REQUESTED_REVIEWED_COMMIT: ${{ inputs.reviewed_commit }}
      REQUESTED_CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - name: Reject an unreviewed request
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == 'refs/heads/main' ]]
          [[ "$REQUESTED_REVIEWED_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$REQUESTED_REVIEWED_COMMIT" == "$GITHUB_SHA" ]]
          [[ "$REQUESTED_CONFIRMATION" == 'run-staging-core-csv-acceptance' ]]

  staging-core-csv:
    name: Synthetic owner and member core flow with cleanup
    needs: validate-dispatch
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment: staging
    env:
      FANMIND_RUNTIME_ENVIRONMENT: staging
      NEXT_PUBLIC_APP_URL: ${{ vars.FANMIND_STAGING_APP_URL }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.FANMIND_STAGING_SUPABASE_URL }}
      FANMIND_TARGET_API_ORIGIN: ${{ vars.FANMIND_STAGING_APP_URL }}
      FANMIND_PRODUCTION_API_ORIGIN: https://fanmind.ch
      FANMIND_TARGET_SUPABASE_PROJECT_REF: ${{ vars.FANMIND_STAGING_SUPABASE_PROJECT_REF }}
      FANMIND_PRODUCTION_SUPABASE_PROJECT_REF: ${{ vars.FANMIND_PRODUCTION_SUPABASE_PROJECT_REF }}
      FANMIND_STAGING_CORE_REVIEWED_COMMIT: ${{ inputs.reviewed_commit }}
      FANMIND_STAGING_CORE_CONFIRM: run-staging-core-csv-acceptance
      FANMIND_ENABLE_NON_PRODUCTION_WRITES: 'true'
      FANMIND_NON_PRODUCTION_WRITE_ACK: I_UNDERSTAND_NON_PRODUCTION_ONLY
      FANMIND_STAGING_E2E_WORKSPACE_ID: ${{ vars.FANMIND_STAGING_E2E_WORKSPACE_ID }}
      FANMIND_STAGING_E2E_CONTACT_ID: ${{ vars.FANMIND_STAGING_E2E_CONTACT_ID }}
      FANMIND_STAGING_E2E_SECONDARY_WORKSPACE_ID: ${{ vars.FANMIND_STAGING_E2E_SECONDARY_WORKSPACE_ID }}
      FANMIND_STAGING_E2E_SECONDARY_CONTACT_ID: ${{ vars.FANMIND_STAGING_E2E_SECONDARY_CONTACT_ID }}
      PGHOST: ${{ secrets.FANMIND_STAGING_DB_HOST }}
      FANMIND_TARGET_DB_HOST: ${{ secrets.FANMIND_STAGING_DB_HOST }}
      FANMIND_PRODUCTION_DB_HOST: ${{ format('db.{0}.supabase.co', vars.FANMIND_PRODUCTION_SUPABASE_PROJECT_REF) }}
      PGPORT: '5432'
      PGDATABASE: ${{ vars.FANMIND_STAGING_DB_NAME }}
      PGUSER: ${{ format('postgres.{0}', vars.FANMIND_STAGING_SUPABASE_PROJECT_REF) }}
      PGSSLMODE: verify-full
      PGSSLROOTCERT: ${{ github.workspace }}/config/certificates/supabase-root-2021-ca.crt
      CI: '1'

    steps:
      - name: Checkout reviewed main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies reproducibly
        run: npm ci --no-audit --no-fund

      - name: Verify acceptance contract offline
        run: npm run staging:core-csv:check

      - name: Bind acceptance to the deployed Staging release
        env:
          FANMIND_DEPLOYED_VERSION_URL: ${{ format('{0}/api/version', vars.FANMIND_STAGING_APP_URL) }}
          FANMIND_EXPECTED_RELEASE_COMMIT: ${{ inputs.reviewed_commit }}
        run: |
          set -euo pipefail
          VERSION_JSON="$(curl --fail --silent --show-error --max-time 20 "$FANMIND_DEPLOYED_VERSION_URL")"
          VERSION_JSON="$VERSION_JSON" node <<'NODE'
          const payload = JSON.parse(process.env.VERSION_JSON || '{}');
          if (
            payload.releaseCommit !== process.env.FANMIND_EXPECTED_RELEASE_COMMIT ||
            payload.runtimeEnvironment !== 'staging'
          ) {
            throw new Error('staging_deployed_release_mismatch');
          }
          console.log('STAGING_CORE_CSV_DEPLOYED_RELEASE=PASS');
          NODE

      - name: Prepare dedicated private database password file
        id: passfile
        env:
          FANMIND_STAGING_DB_PASSWORD: ${{ secrets.FANMIND_STAGING_DB_PASSWORD }}
          PGPASSFILE: ${{ runner.temp }}/fanmind-staging-core-csv.pgpass
        run: |
          set -euo pipefail
          umask 077
          case "$FANMIND_STAGING_DB_PASSWORD" in
            ''|*$'\n'*|*$'\r'*) exit 1 ;;
          esac
          ESCAPED="${FANMIND_STAGING_DB_PASSWORD//\\/\\\\}"
          ESCAPED="${ESCAPED//:/\\:}"
          printf '%s:%s:%s:%s:%s\n' \
            "$PGHOST" "$PGPORT" "$PGDATABASE" "$PGUSER" "$ESCAPED" > "$PGPASSFILE"
          chmod 600 "$PGPASSFILE"

      - name: Capture shared read-only database rollout baseline
        id: rollout_baseline
        env:
          PGPASSFILE: ${{ runner.temp }}/fanmind-staging-core-csv.pgpass
          FANMIND_STAGING_ROLLOUT_BASELINE: ${{ runner.temp }}/fanmind-staging-core-csv-rollout.baseline
          FANMIND_ENABLE_NON_PRODUCTION_WRITES: 'false'
          FANMIND_NON_PRODUCTION_WRITE_ACK: ''
          FANMIND_STAGING_DATABASE_ROLLOUT_REVIEWED_COMMIT: ${{ inputs.reviewed_commit }}
          FANMIND_STAGING_DATABASE_ROLLOUT_STATE_CONFIRM: verify-staging-database-rollout-state
        run: |
          set -euo pipefail
          umask 077
          ROLLOUT_STATE="$(npm run db:staging-rollout-state:run)"
          printf '%s\n' "$ROLLOUT_STATE"
          grep -Fxq 'STAGING_DATABASE_ROLLOUT_STATE=PASS' <<< "$ROLLOUT_STATE"
          grep -Fxq 'STAGING_DATABASE_ROLLOUT_WORKSPACE_MEMBER_BOUNDARY=verify' <<< "$ROLLOUT_STATE"
          printf '%s\n' "$ROLLOUT_STATE" \
            | node scripts/operations/canonicalize-staging-rollout-evidence.mjs \
            > "$FANMIND_STAGING_ROLLOUT_BASELINE"
          [[ "$(stat -c '%a' "$FANMIND_STAGING_ROLLOUT_BASELINE")" == '600' ]]

      - name: Verify the applied member boundary before fixture writes
        env:
          PGPASSFILE: ${{ runner.temp }}/fanmind-staging-core-csv.pgpass
          FANMIND_ENABLE_NON_PRODUCTION_WRITES: 'false'
          FANMIND_NON_PRODUCTION_WRITE_ACK: ''
          FANMIND_WORKSPACE_MEMBER_DATA_BOUNDARY_REVIEWED_COMMIT: ${{ inputs.reviewed_commit }}
          FANMIND_WORKSPACE_MEMBER_DATA_BOUNDARY_VERIFY_CONFIRM: verify-workspace-member-data-boundary
        run: npm run db:workspace-member-data-boundary:verify

      - name: Install Chromium only
        run: npx playwright install --with-deps chromium

      - name: Generate a masked ephemeral member credential
        id: member_credential_generation
        run: npm run staging:member-credential:generate

      - name: Activate only the marked synthetic member credential
        id: member_credential_activation
        env:
          FANMIND_STAGING_SUPABASE_URL: ${{ secrets.FANMIND_STAGING_SUPABASE_URL }}
          FANMIND_STAGING_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.FANMIND_STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          FANMIND_STAGING_EPHEMERAL_MEMBER_REVIEWED_COMMIT: ${{ inputs.reviewed_commit }}
          FANMIND_STAGING_EPHEMERAL_MEMBER_CONFIRM: activate-staging-ephemeral-member-credential
          NODE_OPTIONS: ''
          NODE_EXTRA_CA_CERTS: ''
          NODE_USE_ENV_PROXY: ''
          HTTP_PROXY: ''
          HTTPS_PROXY: ''
          ALL_PROXY: ''
        run: |
          set -euo pipefail
          unset http_proxy https_proxy all_proxy
          npm run staging:member-credential:activate

      - name: Prepare isolated synthetic core records
        env: &acceptance_database_environment
          PGPASSFILE: ${{ runner.temp }}/fanmind-staging-core-csv.pgpass
          FANMIND_STAGING_SUPABASE_URL: ${{ secrets.FANMIND_STAGING_SUPABASE_URL }}
          FANMIND_STAGING_E2E_EMAIL: ${{ secrets.FANMIND_STAGING_E2E_EMAIL }}
          FANMIND_STAGING_E2E_PASSWORD: ${{ secrets.FANMIND_STAGING_E2E_PASSWORD }}
          FANMIND_STAGING_E2E_SECONDARY_EMAIL: ${{ secrets.FANMIND_STAGING_E2E_SECONDARY_EMAIL }}
          FANMIND_STAGING_E2E_SECONDARY_PASSWORD: ${{ secrets.FANMIND_STAGING_E2E_SECONDARY_PASSWORD }}
        run: npm run staging:core-csv:prepare

      - name: Bind non-secret run identities
        run: npm run staging:core-csv:identity >> "$GITHUB_ENV"

      - name: Run real Staging owner, member, AI and CSV flow
        env:
          FANMIND_E2E_STAGING_URL: ${{ vars.FANMIND_STAGING_APP_URL }}
          FANMIND_E2E_STAGING_WRITE_ACK: fanmind-staging-core-csv-write
          FANMIND_E2E_STAGING_REVIEWED_COMMIT: ${{ inputs.reviewed_commit }}
          FANMIND_E2E_STAGING_SUPABASE_URL: ${{ secrets.FANMIND_STAGING_SUPABASE_URL }}
          FANMIND_E2E_STAGING_PRODUCTION_SUPABASE_REF: ${{ vars.FANMIND_PRODUCTION_SUPABASE_PROJECT_REF }}
          FANMIND_E2E_STAGING_WORKSPACE_ID: ${{ vars.FANMIND_STAGING_E2E_WORKSPACE_ID }}
          FANMIND_E2E_STAGING_CONTACT_ID: ${{ vars.FANMIND_STAGING_E2E_CONTACT_ID }}
          FANMIND_E2E_STAGING_SECONDARY_WORKSPACE_ID: ${{ vars.FANMIND_STAGING_E2E_SECONDARY_WORKSPACE_ID }}
          FANMIND_E2E_STAGING_SECONDARY_CONTACT_ID: ${{ vars.FANMIND_STAGING_E2E_SECONDARY_CONTACT_ID }}
          FANMIND_E2E_STAGING_EMAIL: ${{ secrets.FANMIND_STAGING_E2E_EMAIL }}
          FANMIND_E2E_STAGING_PASSWORD: ${{ secrets.FANMIND_STAGING_E2E_PASSWORD }}
          FANMIND_E2E_STAGING_SECONDARY_EMAIL: ${{ secrets.FANMIND_STAGING_E2E_SECONDARY_EMAIL }}
          FANMIND_E2E_STAGING_SECONDARY_PASSWORD: ${{ secrets.FANMIND_STAGING_E2E_SECONDARY_PASSWORD }}
        run: npm run test:e2e:staging-write

      - name: Verify exact database effects before cleanup
        env: *acceptance_database_environment
        run: npm run staging:core-csv:verify

      - name: Remove all acceptance records and prove zero residue
        id: cleanup
        if: ${{ always() && steps.passfile.outcome == 'success' }}
        env: *acceptance_database_environment
        run: npm run staging:core-csv:cleanup

      - name: Revoke the ephemeral member credential and reject reuse
        id: member_credential_cleanup
        if: ${{ always() && steps.member_credential_generation.outcome == 'success' }}
        env:
          FANMIND_STAGING_SUPABASE_URL: ${{ secrets.FANMIND_STAGING_SUPABASE_URL }}
          FANMIND_STAGING_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.FANMIND_STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          FANMIND_STAGING_SUPABASE_ANON_KEY: ${{ secrets.FANMIND_STAGING_SUPABASE_ANON_KEY }}
          FANMIND_STAGING_EPHEMERAL_MEMBER_REVIEWED_COMMIT: ${{ inputs.reviewed_commit }}
          FANMIND_STAGING_EPHEMERAL_MEMBER_CONFIRM: revoke-staging-ephemeral-member-credential
          NODE_OPTIONS: ''
          NODE_EXTRA_CA_CERTS: ''
          NODE_USE_ENV_PROXY: ''
          HTTP_PROXY: ''
          HTTPS_PROXY: ''
          ALL_PROXY: ''
        run: |
          set -euo pipefail
          unset http_proxy https_proxy all_proxy
          clear_member_environment() {
            printf '%s\n' \
              'FANMIND_STAGING_E2E_MEMBER_PASSWORD=' \
              'FANMIND_E2E_STAGING_MEMBER_PASSWORD=' >> "$GITHUB_ENV"
          }
          trap clear_member_environment EXIT
          npm run staging:member-credential:revoke

      - name: Recheck database postflight and exact deployed release
        if: >-
          ${{
            success() &&
            steps.passfile.outcome == 'success' &&
            steps.rollout_baseline.outcome == 'success' &&
            steps.cleanup.outcome == 'success' &&
            steps.member_credential_cleanup.outcome == 'success'
          }}
        env:
          PGPASSFILE: ${{ runner.temp }}/fanmind-staging-core-csv.pgpass
          FANMIND_STAGING_ROLLOUT_BASELINE: ${{ runner.temp }}/fanmind-staging-core-csv-rollout.baseline
          FANMIND_ENABLE_NON_PRODUCTION_WRITES: 'false'
          FANMIND_NON_PRODUCTION_WRITE_ACK: ''
          FANMIND_STAGING_DATABASE_ROLLOUT_REVIEWED_COMMIT: ${{ inputs.reviewed_commit }}
          FANMIND_STAGING_DATABASE_ROLLOUT_STATE_CONFIRM: verify-staging-database-rollout-state
          FANMIND_WORKSPACE_MEMBER_DATA_BOUNDARY_REVIEWED_COMMIT: ${{ inputs.reviewed_commit }}
          FANMIND_WORKSPACE_MEMBER_DATA_BOUNDARY_VERIFY_CONFIRM: verify-workspace-member-data-boundary
          FANMIND_DEPLOYED_VERSION_URL: ${{ format('{0}/api/version', vars.FANMIND_STAGING_APP_URL) }}
          FANMIND_EXPECTED_RELEASE_COMMIT: ${{ inputs.reviewed_commit }}
        run: |
          set -euo pipefail
          CURRENT_ROLLOUT="$(mktemp "$RUNNER_TEMP/fanmind-staging-core-csv-rollout.current.XXXXXX")"
          trap 'rm -f -- "$CURRENT_ROLLOUT"' EXIT

          npm run db:workspace-member-data-boundary:verify

          ROLLOUT_STATE="$(npm run db:staging-rollout-state:run)"
          printf '%s\n' "$ROLLOUT_STATE"
          grep -Fxq 'STAGING_DATABASE_ROLLOUT_STATE=PASS' <<< "$ROLLOUT_STATE"
          grep -Fxq 'STAGING_DATABASE_ROLLOUT_WORKSPACE_MEMBER_BOUNDARY=verify' <<< "$ROLLOUT_STATE"
          printf '%s\n' "$ROLLOUT_STATE" \
            | node scripts/operations/canonicalize-staging-rollout-evidence.mjs \
            > "$CURRENT_ROLLOUT"
          if ! cmp --silent -- "$FANMIND_STAGING_ROLLOUT_BASELINE" "$CURRENT_ROLLOUT"; then
            echo 'Staging database rollout state changed during acceptance.' >&2
            exit 1
          fi

          VERSION_JSON="$(curl --fail --silent --show-error --max-time 20 "$FANMIND_DEPLOYED_VERSION_URL")"
          VERSION_JSON="$VERSION_JSON" node <<'NODE'
          const payload = JSON.parse(process.env.VERSION_JSON || '{}');
          if (
            payload.releaseCommit !== process.env.FANMIND_EXPECTED_RELEASE_COMMIT ||
            payload.runtimeEnvironment !== 'staging'
          ) {
            throw new Error('staging_final_deployed_release_mismatch');
          }
          NODE

          echo 'STAGING_CORE_CSV_DATABASE_POSTFLIGHT=PASS'
          echo 'STAGING_CORE_CSV_MEMBER_BOUNDARY_POSTFLIGHT=PASS'
          echo 'STAGING_CORE_CSV_FINAL_RELEASE=PASS'
          echo 'STAGING_CORE_CSV_ACCEPTANCE=PASS'

      - name: Remove dedicated private evidence files
        if: ${{ always() }}
        env:
          PGPASSFILE: ${{ runner.temp }}/fanmind-staging-core-csv.pgpass
          FANMIND_STAGING_ROLLOUT_BASELINE: ${{ runner.temp }}/fanmind-staging-core-csv-rollout.baseline
        run: rm -f -- "$PGPASSFILE" "$FANMIND_STAGING_ROLLOUT_BASELINE"
