name: Assemble bounded Daily admin source
on:
  push:
    branches: [fix/daily-admin-visibility-20260914]
    paths:
      - scripts/maintenance/daily_admin_assembly.py
      - .github/workflows/daily-admin-assembly.yml
permissions:
  contents: write
concurrency:
  group: daily-admin-source-assembly
  cancel-in-progress: false
jobs:
  assemble:
    if: github.repository == 'FanMind/FanMind' && github.ref == 'refs/heads/fix/daily-admin-visibility-20260914'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.13.1
          cache: npm
      - name: Install pinned source test dependencies
        run: npm ci --no-audit --no-fund
      - name: Check bounded assembly syntax
        run: python3 -m py_compile scripts/maintenance/daily_admin_assembly.py
      - name: Assemble source and test; create unreferenced blobs and tree only
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/maintenance/daily_admin_assembly.py
