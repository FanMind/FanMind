name: Transport reviewed confirmed-chat remediation v2

on:
  push:
    branches:
      - feat/creator-confirmed-chat-rollout-runner-20260923
    paths:
      - .github/workflows/transport-confirmed-chat-review-v2.yml

permissions:
  contents: write
  issues: write

jobs:
  transport:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/creator-confirmed-chat-rollout-runner-20260923
          fetch-depth: 0
          persist-credentials: true

      - name: Materialize reviewed remediation and close remaining verifier gaps
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BASE=588f7d182a5080c0bd985f49a1a7267f0d62fd09
          BRANCH=feat/creator-confirmed-chat-rollout-runner-20260923
          HELPER=.github/workflows/transport-confirmed-chat-review-v2.yml

          cleanup_failure() {
            code=$?
            if [ "$code" -ne 0 ]; then
              git reset --hard HEAD || true
              if [ -f "$HELPER" ]; then
                git rm -f "$HELPER" || true
                git commit -m "Remove failed confirmed-chat transport v2" || true
                git push origin "HEAD:refs/heads/$BRANCH" || true
              fi
              gh issue comment 1168 --body "Confirmed-chat transport v2 failed closed with exit code \`$code\`. No product remediation was published; helper cleanup was attempted."
            fi
            exit "$code"
          }
          trap cleanup_failure EXIT

          test "$(git diff --name-only "$BASE" HEAD | sort -u)" = "$HELPER"

          gh api "repos/${GITHUB_REPOSITORY}/issues/comments/5811558634" --jq .body > /tmp/runner.comment
          gh api "repos/${GITHUB_REPOSITORY}/issues/comments/5811507222" --jq .body > /tmp/tests.comment

          python3 - <<'PY'
          from pathlib import Path
          import re

          def extract(source, label, target):
              body = Path(source).read_text(encoding='utf-8')
              match = re.match(rf'\A{re.escape(label)}\n\n```js\n(.*)\n```\s*\Z', body, flags=re.S)
              if match is None:
                  raise SystemExit(f'comment_contract_invalid:{label}')
              Path(target).write_text(match.group(1) + '\n', encoding='utf-8')

          extract('/tmp/runner.comment', 'scripts/operations/creator-confirmed-chat-learning-migration-runner.mjs', 'scripts/operations/creator-confirmed-chat-learning-migration-runner.mjs')
          extract('/tmp/tests.comment', 'tests/creator-confirmed-chat-learning-verifier-review.cases.mjs', 'tests/creator-confirmed-chat-learning-verifier-review.cases.mjs')
          PY

          test "$(git hash-object scripts/operations/creator-confirmed-chat-learning-migration-runner.mjs)" = "cb8ec0e6a1afdd92b653d176435763f3d6dc15be"
          test "$(git hash-object tests/creator-confirmed-chat-learning-verifier-review.cases.mjs)" = "d832c64e4927b64d91a524354764eef68a531abd"

          python3 - <<'PY'
          from pathlib import Path

          runner_path = Path('scripts/operations/creator-confirmed-chat-learning-migration-runner.mjs')
          tests_path = Path('tests/creator-confirmed-chat-learning-verifier-review.cases.mjs')
          runner = runner_path.read_text(encoding='utf-8')
          tests = tests_path.read_text(encoding='utf-8')

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}:expected_one_found_{count}')
              return text.replace(old, new, 1)

          # Bind planner support metadata for every reviewed function.
          runner = replace_once(
              runner,
              '  function_variadic oid;\n  function_arg_names text[];',
              '  function_variadic oid;\n  function_support oid;\n  function_arg_names text[];',
              'declare_function_support',
          )
          runner = replace_once(
              runner,
              '      p.provariadic,\n      p.proargnames,',
              '      p.provariadic,\n      p.prosupport::oid,\n      p.proargnames,',
              'select_function_support',
          )
          runner = replace_once(
              runner,
              '      function_variadic,\n      function_arg_names,',
              '      function_variadic,\n      function_support,\n      function_arg_names,',
              'into_function_support',
          )
          metadata_guard = '    "function_variadic is distinct from 0::oid",\n'
          if runner.count(metadata_guard) != 2:
              raise SystemExit(f'function_support_guard_anchor_count:{runner.count(metadata_guard)}')
          runner = runner.replace(
              metadata_guard,
              metadata_guard + '    "function_support is distinct from 0::oid",\n',
          )

          # Reject internal triggers on the learning table unless they are exactly tied
          # to one of the table's reviewed outgoing foreign keys. Incoming/unbound
          # constraint triggers therefore cannot alter cascade/delete behavior invisibly.
          old_trigger_guard = """  if exists (\n    select 1 from pg_trigger\n     where tgrelid = learning_table\n       and not tgisinternal\n  ) then\n    raise exception 'creator_learning_trigger_set_invalid';\n  end if;\n"""
          new_trigger_guard = old_trigger_guard + """\n  if exists (\n    select 1\n      from pg_trigger t\n     where t.tgrelid = learning_table\n       and t.tgisinternal\n       and not exists (\n         select 1\n           from pg_constraint c\n          where c.oid = t.tgconstraint\n            and c.conrelid = learning_table\n            and c.contype = 'f'\n       )\n  ) then\n    raise exception 'creator_learning_internal_trigger_set_invalid';\n  end if;\n"""
          runner = replace_once(runner, old_trigger_guard, new_trigger_guard, 'internal_trigger_guard')

          # Every reviewed PRIMARY/UNIQUE constraint must retain a live, ready, valid,
          # unique backing index; a catalog-valid constraint alone is insufficient.
          anchor = """  select array_agg(\n           regexp_replace(\n"""
          backing_index_guard = """  if exists (\n    select 1\n      from pg_constraint c\n      left join pg_index i\n        on i.indexrelid = c.conindid\n       and i.indrelid = learning_table\n     where c.conrelid = learning_table\n       and c.contype in ('p','u')\n       and (\n         c.conindid = 0\n         or i.indexrelid is null\n         or not coalesce(i.indisunique, false)\n         or not coalesce(i.indisvalid, false)\n         or not coalesce(i.indisready, false)\n         or not coalesce(i.indislive, false)\n       )\n  ) then\n    raise exception 'creator_learning_constraint_index_invalid';\n  end if;\n\n"""
          runner = replace_once(runner, anchor, backing_index_guard + anchor, 'constraint_index_guard')

          tests += r'''\n\ntest("verifier rejects planner-support hooks on every reviewed function", async () => {\n  const runner = await runnerSource();\n  assert.match(runner, /p\.prosupport::oid/u);\n  assert.match(runner, /function_support oid/u);\n  assert.match(runner, /function_support is distinct from 0::oid/u);\n});\n\ntest("verifier requires live backing indexes for reviewed primary and unique constraints", async () => {\n  const runner = await runnerSource();\n  assert.match(runner, /c\.contype in \('p','u'\)/u);\n  assert.match(runner, /i\.indexrelid = c\.conindid/u);\n  assert.match(runner, /not coalesce\(i\.indisunique, false\)/u);\n  assert.match(runner, /not coalesce\(i\.indisvalid, false\)/u);\n  assert.match(runner, /not coalesce\(i\.indisready, false\)/u);\n  assert.match(runner, /not coalesce\(i\.indislive, false\)/u);\n  assert.match(runner, /creator_learning_constraint_index_invalid/u);\n});\n\ntest("verifier binds internal learning-table triggers to reviewed outgoing foreign keys", async () => {\n  const runner = await runnerSource();\n  assert.match(runner, /t\.tgrelid = learning_table[\s\S]*t\.tgisinternal/u);\n  assert.match(runner, /c\.oid = t\.tgconstraint/u);\n  assert.match(runner, /c\.conrelid = learning_table/u);\n  assert.match(runner, /c\.contype = 'f'/u);\n  assert.match(runner, /creator_learning_internal_trigger_set_invalid/u);\n});\n'''

          runner_path.write_text(runner, encoding='utf-8')
          tests_path.write_text(tests, encoding='utf-8')
          PY

          node scripts/operations/creator-confirmed-chat-learning-migration-runner.mjs --check
          node --test tests/creator-confirmed-chat-learning.test.mjs
          node --test tests/test-suite-coverage.test.mjs
          npx eslint scripts/operations/creator-confirmed-chat-learning-migration-runner.mjs tests/creator-confirmed-chat-learning.test.mjs tests/creator-confirmed-chat-learning-verifier-review.cases.mjs
          git diff --check

          git rm "$HELPER"
          git add scripts/operations/creator-confirmed-chat-learning-migration-runner.mjs tests/creator-confirmed-chat-learning-verifier-review.cases.mjs
          git diff --cached --check
          git commit -m "Close confirmed-chat current-head verifier gaps"
          test -z "$(git diff --name-only "$BASE" HEAD -- "$HELPER")"
          git push origin "HEAD:refs/heads/$BRANCH"
          trap - EXIT
