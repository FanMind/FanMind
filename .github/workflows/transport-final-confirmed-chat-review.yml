name: Transport final confirmed-chat review remediation

on:
  push:
    branches:
      - feat/creator-confirmed-chat-rollout-runner-20260923
    paths:
      - .github/workflows/transport-final-confirmed-chat-review.yml

permissions:
  contents: write
  issues: read
  pull-requests: read

jobs:
  transport:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/creator-confirmed-chat-rollout-runner-20260923
          fetch-depth: 0
          persist-credentials: true

      - name: Configure exact fail-closed transport
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          test "$(git rev-parse HEAD^)" = "588f7d182a5080c0bd985f49a1a7267f0d62fd09"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/transport-final-confirmed-chat-review.yml"

      - name: Materialize exact already-tested files from PR evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/issues/comments/5811558634" --jq .body > /tmp/runner.comment
          gh api "repos/${GITHUB_REPOSITORY}/issues/comments/5811507222" --jq .body > /tmp/tests.comment
          python3 - <<'PY'
          from pathlib import Path
          import re

          targets = [
              (
                  Path('/tmp/runner.comment'),
                  'scripts/operations/creator-confirmed-chat-learning-migration-runner.mjs',
                  Path('scripts/operations/creator-confirmed-chat-learning-migration-runner.mjs'),
              ),
              (
                  Path('/tmp/tests.comment'),
                  'tests/creator-confirmed-chat-learning-verifier-review.cases.mjs',
                  Path('tests/creator-confirmed-chat-learning-verifier-review.cases.mjs'),
              ),
          ]
          for source, label, target in targets:
              body = source.read_text(encoding='utf-8')
              pattern = rf'\A{re.escape(label)}\n\n```js\n(.*)\n```\s*\Z'
              match = re.match(pattern, body, flags=re.S)
              if match is None:
                  raise SystemExit(f'comment_contract_invalid:{label}')
              content = match.group(1) + '\n'
              target.write_text(content, encoding='utf-8')
          PY
          test "$(git hash-object scripts/operations/creator-confirmed-chat-learning-migration-runner.mjs)" = "cb8ec0e6a1afdd92b653d176435763f3d6dc15be"
          test "$(git hash-object tests/creator-confirmed-chat-learning-verifier-review.cases.mjs)" = "d832c64e4927b64d91a524354764eef68a531abd"
          test "$(git diff --name-only HEAD -- scripts/operations/creator-confirmed-chat-learning-migration-runner.mjs tests/creator-confirmed-chat-learning-verifier-review.cases.mjs | sort)" = $'scripts/operations/creator-confirmed-chat-learning-migration-runner.mjs\ntests/creator-confirmed-chat-learning-verifier-review.cases.mjs'

      - name: Verify exact bounded remediation
        shell: bash
        run: |
          set -euo pipefail
          node scripts/operations/creator-confirmed-chat-learning-migration-runner.mjs --check
          node --test tests/creator-confirmed-chat-learning.test.mjs
          node --test tests/test-suite-coverage.test.mjs
          npm run test:operations -- --test-name-pattern='confirmed-chat'
          npx eslint scripts/operations/creator-confirmed-chat-learning-migration-runner.mjs tests/creator-confirmed-chat-learning.test.mjs tests/creator-confirmed-chat-learning-verifier-review.cases.mjs
          git diff --check

      - name: Commit exact remediation and remove transport helper
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "588f7d182a5080c0bd985f49a1a7267f0d62fd09"
          git rm .github/workflows/transport-final-confirmed-chat-review.yml
          git add scripts/operations/creator-confirmed-chat-learning-migration-runner.mjs tests/creator-confirmed-chat-learning-verifier-review.cases.mjs
          git diff --cached --check
          git commit -m "Close final confirmed-chat verifier review gaps"
          test "$(git hash-object HEAD:scripts/operations/creator-confirmed-chat-learning-migration-runner.mjs)" = "cb8ec0e6a1afdd92b653d176435763f3d6dc15be"
          test "$(git hash-object HEAD:tests/creator-confirmed-chat-learning-verifier-review.cases.mjs)" = "d832c64e4927b64d91a524354764eef68a531abd"
          test -z "$(git diff --name-only 588f7d182a5080c0bd985f49a1a7267f0d62fd09..HEAD -- .github/workflows/transport-final-confirmed-chat-review.yml)"
          git push origin HEAD:refs/heads/feat/creator-confirmed-chat-rollout-runner-20260923
