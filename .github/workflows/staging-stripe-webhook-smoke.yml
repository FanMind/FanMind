name: FanMind Staging Stripe Webhook Signed Smoke

on:
  workflow_dispatch:
    inputs:
      verify_billing_freeze:
        description: 'Additionally prove the signed legacy Billing freeze without provider or database mutations'
        required: true
        type: boolean
        default: false
      reviewed_commit:
        description: 'Exact deployed and reviewed main commit for the signed Staging webhook smoke'
        required: true
        type: string
      confirmation:
        description: 'Type run-signed-staging-stripe-webhook-smoke to continue'
        required: true
        type: string

concurrency:
  group: fanmind-staging-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  signed-staging-webhook-smoke:
    name: Verify the deployed Staging webhook signing-secret binding
    if: >-
      ${{
        github.ref == 'refs/heads/main' &&
        inputs.reviewed_commit == github.sha &&
        inputs.confirmation == 'run-signed-staging-stripe-webhook-smoke'
      }}
    runs-on: ubuntu-24.04
    environment: staging
    env:
      FANMIND_RUNTIME_ENVIRONMENT: staging
      FANMIND_STAGING_STRIPE_WEBHOOK_SMOKE_CONFIRM: run-signed-staging-stripe-webhook-smoke
      FANMIND_EXPECTED_RELEASE_COMMIT: ${{ github.sha }}
      FANMIND_WORKFLOW_COMMIT: ${{ github.sha }}
      FANMIND_ENABLE_NON_PRODUCTION_WRITES: 'false'
      STRIPE_WEBHOOK_SECRET: ${{ secrets.FANMIND_STAGING_STRIPE_WEBHOOK_SECRET }}

    steps:
      - name: Checkout reviewed main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Verify the signed smoke contract offline
        run: npm run stripe:staging-webhook-smoke:check

      - name: Verify the deployed signing-secret binding without mutations
        run: npm run stripe:staging-webhook-smoke:run

      - name: Verify signed legacy Billing freeze
        if: ${{ inputs.verify_billing_freeze }}
        env:
          FANMIND_SIGNED_BILLING_FREEZE_CONFIRM: verify-signed-billing-freeze
        run: node scripts/operations/staging-signed-billing-freeze-probe.mjs
