name: FanMind AI Tier Staging Resource Readiness

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type verify-ai-tier-staging-resources to run the read-only isolated staging resource check'
        required: true
        type: string

concurrency:
  group: fanmind-ai-tier-staging-resource-readiness
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify-ai-tier-staging-resources:
    name: Verify isolated AI tier staging resources without writes
    if: >-
      ${{
        github.ref == 'refs/heads/main' &&
        inputs.confirmation == 'verify-ai-tier-staging-resources'
      }}
    runs-on: ubuntu-24.04
    environment: staging
    env:
      FANMIND_RUNTIME_ENVIRONMENT: staging
      NEXT_PUBLIC_APP_URL: ${{ vars.FANMIND_STAGING_APP_URL }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.FANMIND_STAGING_SUPABASE_URL }}
      FANMIND_TARGET_SUPABASE_PROJECT_REF: ${{ vars.FANMIND_STAGING_SUPABASE_PROJECT_REF }}
      FANMIND_PRODUCTION_SUPABASE_PROJECT_REF: ${{ vars.FANMIND_PRODUCTION_SUPABASE_PROJECT_REF }}
      FANMIND_ENABLE_NON_PRODUCTION_WRITES: 'false'
      FANMIND_NON_PRODUCTION_WRITE_ACK: ''
      FANMIND_AI_TIER_STAGING_RESOURCE_CONFIRM: verify-ai-tier-staging-resources
      FANMIND_AI_TIER_STAGING_WORKSPACE_ID: ${{ vars.FANMIND_AI_TIER_STAGING_WORKSPACE_ID }}
      STRIPE_SECRET_KEY: ${{ secrets.FANMIND_STAGING_STRIPE_SECRET_KEY }}
      STRIPE_PRICE_AI_PLUS: ${{ vars.FANMIND_STAGING_STRIPE_PRICE_AI_PLUS }}
      STRIPE_PRICE_AI_ULTRA: ${{ vars.FANMIND_STAGING_STRIPE_PRICE_AI_ULTRA }}
      PGHOST: ${{ secrets.FANMIND_STAGING_DB_HOST }}
      FANMIND_TARGET_DB_HOST: ${{ secrets.FANMIND_STAGING_DB_HOST }}
      PGPORT: ${{ vars.FANMIND_STAGING_DB_PORT }}
      PGDATABASE: ${{ vars.FANMIND_STAGING_DB_NAME }}
      PGUSER: ${{ secrets.FANMIND_STAGING_DB_USER }}

    steps:
      - name: Checkout reviewed main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Prepare private database password file
        env:
          FANMIND_STAGING_DB_PASSWORD: ${{ secrets.FANMIND_STAGING_DB_PASSWORD }}
          PGPASSFILE: ${{ runner.temp }}/fanmind-ai-tier-staging-resource-readiness.pgpass
        run: |
          set -euo pipefail
          umask 077
          case "$FANMIND_STAGING_DB_PASSWORD" in
            *$'\n'*|*$'\r'*)
              echo "Staging database password contains an unsupported line break." >&2
              exit 1
              ;;
          esac
          ESCAPED_DB_PASSWORD="${FANMIND_STAGING_DB_PASSWORD//\\/\\\\}"
          ESCAPED_DB_PASSWORD="${ESCAPED_DB_PASSWORD//:/\\:}"
          printf '%s:%s:%s:%s:%s\n' \
            "$PGHOST" \
            "$PGPORT" \
            "$PGDATABASE" \
            "$PGUSER" \
            "$ESCAPED_DB_PASSWORD" > "$PGPASSFILE"
          chmod 600 "$PGPASSFILE"

      - name: Verify staging resources without writes
        env:
          PGPASSFILE: ${{ runner.temp }}/fanmind-ai-tier-staging-resource-readiness.pgpass
        run: npm run ai:tiers:staging:preflight

      - name: Remove private database password file
        if: ${{ always() }}
        env:
          PGPASSFILE: ${{ runner.temp }}/fanmind-ai-tier-staging-resource-readiness.pgpass
        run: rm -f "$PGPASSFILE"
