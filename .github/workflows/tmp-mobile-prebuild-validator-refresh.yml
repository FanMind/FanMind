name: Temporary Mobile Prebuild Validator Refresh

on:
  push:
    branches:
      - fix/mobile-staging-login-diagnostics-20260905

permissions:
  contents: write

jobs:
  refresh-mobile-prebuild-validator:
    if: github.ref == 'refs/heads/fix/mobile-staging-login-diagnostics-20260905'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/mobile-staging-login-diagnostics-20260905

      - name: Align validator with verified Expo SDK 57 patch
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('apps/mobile/scripts/check-native-prebuild.mjs')
          text = path.read_text()
          old = 'assert.equal(sourcePackage.dependencies["expo-dev-client"], "~57.0.16");'
          new = 'assert.equal(sourcePackage.dependencies["expo-dev-client"], "~57.0.18");'
          if old not in text:
              raise SystemExit('expected old validator pin not found')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Commit validator update
        run: |
          set -euo pipefail
          git config user.name 'fanmind-github-mobile'
          git config user.email 'actions@users.noreply.github.com'
          git add apps/mobile/scripts/check-native-prebuild.mjs
          git commit -m 'test(mobile): align native validator with Expo 57 patch'
          git push origin HEAD:fix/mobile-staging-login-diagnostics-20260905
