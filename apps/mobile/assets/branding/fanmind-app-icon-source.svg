<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="background" x1="150" y1="80" x2="880" y2="940" gradientUnits="userSpaceOnUse">
